    if (ta) {
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }, 50);
}

function doSaveMessage(idx) {
  const ta = document.getElementById('edit-msg-area');
  if (!ta) { closeModal(); return; }
  const newContent = ta.value.trim();
  const oldContent = state.data.chatHistory[idx] ? state.data.chatHistory[idx].content : '';
  if (newContent && newContent !== oldContent) {
    state.data.chatHistory[idx].content = newContent;
    saveToStorage();
    updateChatMessageBubble(idx);
  }
  closeModal();
}

// Close menu when clicking outside
document.addEventListener('click', function(e) {
  const menu = document.getElementById('msg-action-menu');
  if (menu && !menu.contains(e.target) && !e.target.closest('.msg-row')) {
    menu.remove();
  }
});

/* ========== 群聊消息操作 ========== */
function showGroupMsgActions(idx) {
  const existing = document.getElementById('msg-action-menu');
  if (existing) existing.remove();

  const grp = state.data.groupChats.find(g => g.id === state.data.activeGroupId);
  if (!grp) return;
  const msg = grp.chatHistory[idx];
  if (!msg) return;

  const isMe = msg.role === 'user';
  const menu = document.createElement('div');
  menu.id = 'msg-action-menu';
  menu.className = 'msg-action-menu';
  menu.innerHTML = `
    <button class="msg-action-item" onclick="editGroupMessage(${idx})">编辑</button>
    <button class="msg-action-item" onclick="deleteGroupMessage(${idx})">删除</button>
  `;
  document.body.appendChild(menu);
  menu.classList.add('active');

  const msgEl = document.querySelector(`.msg-row[data-idx="${idx}"]`);
  if (msgEl) {
    const rect = msgEl.getBoundingClientRect();
    const menuRect = menu.getBoundingClientRect();
    let top = rect.bottom + 4;
    if (top + menuRect.height > window.innerHeight - 10) {
      top = rect.top - menuRect.height - 4;
    }
    menu.style.top = top + 'px';
    if (isMe) {
      menu.style.right = (window.innerWidth - rect.right + 42) + 'px';
      menu.style.left = 'auto';
    } else {
      menu.style.left = (rect.left + 42) + 'px';
      menu.style.right = 'auto';
    }
  }
}

function deleteGroupMessage(idx) {
  const grp = state.data.groupChats.find(g => g.id === state.data.activeGroupId);
  if (!grp) return;
  closeMsgActions();
  grp.chatHistory.splice(idx, 1);
  saveToStorage();
  renderChat();
  showToast('已删除');
}

function editGroupMessage(idx) {
  const grp = state.data.groupChats.find(g => g.id === state.data.activeGroupId);
  if (!grp) return;
  const msg = grp.chatHistory[idx];
  if (!msg) return;
  closeMsgActions();
  const oldContent = msg.content;

  showModal(`
    <div class="modal">
      <div class="modal-header">编辑消息</div>
      <div class="modal-body" style="padding:16px;">
        <textarea id="edit-msg-area" style="width:100%;min-height:120px;background:rgba(232,238,246,0.75);border:1px solid rgba(58,111,165,0.15);color:var(--text);font-size:14.5px;line-height:1.6;padding:12px;resize:vertical;outline:none;border-radius:0;font-family:inherit;">${escapeHtml(oldContent)}</textarea>
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="doSaveGroupMessage(${idx})">保存</button>
      </div>
    </div>
  `);
  setTimeout(() => {
    const ta = document.getElementById('edit-msg-area');
    if (ta) {
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }, 50);
}

function doSaveGroupMessage(idx) {
  const ta = document.getElementById('edit-msg-area');
  if (!ta) { closeModal(); return; }
  const grp = state.data.groupChats.find(g => g.id === state.data.activeGroupId);
  if (!grp) { closeModal(); return; }
  const newContent = ta.value.trim();
  const oldContent = grp.chatHistory[idx] ? grp.chatHistory[idx].content : '';
  if (newContent && newContent !== oldContent) {
    grp.chatHistory[idx].content = newContent;
    saveToStorage();
    renderChat();
  }
  closeModal();
}

/* ========== 日历页 ========== */
// 日历模式：晨报 + 时间轴事件(5-10条, 1-3关键剧情可推进)
// 关键剧情推进复用愿望→润色→叙事系统

function buildEventBlockHtml(evt) {
  const hasPlayer = evt.polishedWish || evt.wish;
  const hasAi = evt.aiNarrative;
  const playerBody = evt.polishedWish ? formatNarrativeText(evt.polishedWish) : (evt.wish ? formatNarrativeText(evt.wish) : '');
  const aiBody = evt.aiNarrative ? formatNarrativeText(evt.aiNarrative) : '';
  const isPrequel = evt.isPrequel;
  const isSummary = evt.isSummary;
  const aiTag = isSummary ? '事件总结' : (isPrequel ? '前置剧情' : '叙事');
  const aiExtraClass = isSummary ? ' summary' : (isPrequel ? ' prequel' : '');
  let html = `<div class="narrative-block" data-id="${evt.id}">`;
  if (hasPlayer) {
    html += `
      <div class="narr-card player">
        <div class="narr-card-header">
          <span class="narr-card-tag">愿望</span>
          <div class="narr-card-header-actions">
            <button class="narr-card-header-btn" onclick="editNarrative('${evt.id}','player')">EDIT</button>
            <button class="narr-card-header-btn" onclick="refreshNarrative('${evt.id}','player')">RETRY</button>
            <button class="narr-card-header-btn danger" onclick="deleteNarrative('${evt.id}','player')">DELETE</button>
          </div>
        </div>
        <div class="narr-card-body" id="player-narr-${evt.id}">${playerBody}</div>
        <div class="narr-card-actions" id="player-actions-${evt.id}"></div>
      </div>`;
  }
  if (hasAi) {
    html += `
      <div class="narr-card ai${aiExtraClass}">
        <div class="narr-card-header">
          <span class="narr-card-tag">${aiTag}</span>
          <div class="narr-card-header-actions">
            <button class="narr-card-header-btn" onclick="editNarrative('${evt.id}','ai')">EDIT</button>
            <button class="narr-card-header-btn" onclick="refreshNarrative('${evt.id}','ai')">RETRY</button>
            <button class="narr-card-header-btn danger" onclick="deleteNarrative('${evt.id}','ai')">DELETE</button>
          </div>
        </div>
        <div class="narr-card-body" id="ai-narr-${evt.id}">${aiBody}</div>
        <div class="narr-card-actions" id="ai-actions-${evt.id}"></div>
      </div>`;
  }
  html += `</div>`;
  return html;
}

// 记忆卡区域（沿用记忆模块样式）
// ====== 日历页：6个区块 ======

function buildCalMemoHtml() {
  const memos = state.data.calendarMemos || [];
  let body = '';
  if (!memos.length) {
    body = '<div class="memory-empty">暂无备忘录</div>';
  } else {
    body = '<div class="cal-memo-grid">';
    memos.forEach((m, i) => {
      const dot = isMorningEventSaved('memo', i) ? '<span class="cal-event-dot"></span>' : '';
      body += `<div class="cal-memo-item clickable" onclick="openStoryEventFromMorning('memo',${i})">${dot}${escapeHtml(m)}</div>`;
    });
    body += '</div>';
  }
  return `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">MEMO</span><span class="cal-section-title-cn">备忘</span></div>${body}</div>`;
}

// 检查晨报关键事件是否已保存（有 isSummary 记录）
function isMorningEventSaved(type, index) {
  const month = state.data.calendarMonth || 'unknown';
  const evtId = `morning_${type}_${index}_${month}`;
  return state.data.eventHistory.some(e => e.calendarEventId === evtId && e.isSummary);
}

// 检查归档月份的晨报关键事件是否有事件链（只要有任意记录即可点击查看）
function hasArchivedMorningEventChain(type, index, month) {
  const evtId = `morning_${type}_${index}_${month}`;
  const archive = (state.data.calendarTimelineArchives || []).find(a => a.month === month);
  if (!archive || !archive.eventHistory) return false;
  return archive.eventHistory.some(e => e.calendarEventId === evtId);
}

// 打开归档月份的晨报关键事件（只读查看事件链）
function openArchivedStoryEventFromMorning(type, index, month) {
  if (state.isLoading) { showToast('正在生成中，请稍后再操作'); return; }

  const archive = (state.data.calendarArchives || []).find(a => a.month === month);
  if (!archive) { showToast('未找到该月归档数据'); return; }

  let text = '';
  if (type === 'memo') {
    text = (archive.memos || [])[index];
  } else if (type === 'notif') {
    text = (archive.notifications || [])[index];
  }
  if (!text) { showToast('未找到该事件内容'); return; }

  const preview = text.length > 30 ? text.substring(0, 30) + '…' : text;
  const typeLabel = type === 'memo' ? '备忘' : '通知';

  // 直接弹出确认框（与日历关键事件一致：先弹窗再查看）
  showModal(`
    <div class="modal">
      <div class="modal-header">查看关键剧情</div>
      <div class="modal-body" style="padding:20px;text-align:center;">
        <p style="font-size:13px;color:var(--text-dim);margin:0;line-height:1.6;">
          来源：${typeLabel}<br>
          内容：<strong style="color:var(--gold);">${escapeHtml(preview)}</strong>
        </p>
        <p style="font-size:13px;color:var(--text-main);margin:12px 0 0;font-weight:500;">
          是否查看？
        </p>
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="closeModal();doOpenArchivedStoryEventFromMorning('${type}',${index},'${escapeHtml(month)}')">确认查看</button>
      </div>
    </div>
  `);
}

// 执行查看归档月份的晨报关键事件（只读模式）
function doOpenArchivedStoryEventFromMorning(type, index, month) {
  if (state.isLoading) { showToast('正在生成中，请稍后再操作'); return; }

  const archive = (state.data.calendarArchives || []).find(a => a.month === month);
  if (!archive) { showToast('未找到该月归档数据'); return; }

  let text = '';
  if (type === 'memo') {
    text = (archive.memos || [])[index];
  } else if (type === 'notif') {
    text = (archive.notifications || [])[index];
  }
  if (!text) { showToast('未找到该事件内容'); return; }

  const evtId = `morning_${type}_${index}_${month}`;

  // 从日历归档中查找事件链
  const timelineArchive = (state.data.calendarTimelineArchives || []).find(a => a.month === month);
  const chainEvents = (timelineArchive && timelineArchive.eventHistory)
    ? timelineArchive.eventHistory.filter(e => e.calendarEventId === evtId)
    : [];

  // 即使事件链为空也进入只读视图（与日历关键事件行为一致，空链显示"暂无剧情内容"）
  state.activeCalendarEvent = evtId;
  state.currentChainId = 'cal_chain_' + evtId;
  state.archiveEventChain = chainEvents;
  state.eventState = 'readonly';

  // 记住进入事件前的滚动位置
  const _calContainer = document.getElementById('calendar-content');
  if (_calContainer) state._preEventScrollTop = _calContainer.scrollTop;

  updateCalendarHeaderButtons();
  renderCalendarContent();
}

function buildCalNotificationHtml() {
  const items = state.data.calendarNotifications || [];
  let body = '';
  if (!items.length) {
    body = '<div class="memory-empty">暂无通知</div>';
  } else {
    body = '<div class="cal-section-body">';
    items.forEach((n, i) => {
      const dot = isMorningEventSaved('notif', i) ? '<span class="cal-event-dot"></span>' : '';
      body += `<div class="cal-notif-item clickable" onclick="openStoryEventFromMorning('notif',${i})">${dot}${escapeHtml(n)}</div>`;
    });
    body += '</div>';
  }
  return `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">NOTIFICATIONS</span><span class="cal-section-title-cn">通知</span></div>${body}</div>`;
}

function buildCalMenuHtml() {
  const items = state.data.calendarMenu || [];
  let body = '';
  if (!items.length) {
    body = '<div class="memory-empty">暂无餐食记录</div>';
  } else {
    body = '<div class="cal-section-body">';
    items.forEach(m => {
      body += `<div class="cal-menu-item"><span class="cal-menu-type">${escapeHtml(m.type||'')}</span><span class="cal-menu-food">${escapeHtml(m.food||'')}</span><span class="cal-menu-source">${escapeHtml(m.source||'')}</span>${m.thought?`<span class="cal-menu-thought">${escapeHtml(m.thought)}</span>`:''}</div>`;
    });
    body += '</div>';
  }
  return `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">DAILY MENU</span><span class="cal-section-title-cn">每日餐食</span></div>${body}</div>`;
}

function buildCalSocialHtml() {
  const items = state.data.calendarSocial || [];
  let body = '';
  if (!items.length) {
    body = '<div class="memory-empty">暂无舆论</div>';
  } else {
    body = '<div class="cal-section-body">';
    items.forEach(s => {
      if (s.author) {
        body += `<div class="cal-social-item"><span class="cal-social-author">@${escapeHtml(s.author)}</span><span class="cal-social-text">"${escapeHtml(s.text)}"</span></div>`;
      } else {
        // 兼容旧数据（纯字符串）
        body += `<div class="cal-social-item">${escapeHtml(s.text || s)}</div>`;
      }
    });
    body += '</div>';
  }
  return `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">SOCIAL FEEDBACK</span><span class="cal-section-title-cn">舆论</span></div>${body}</div>`;
}

function buildCalConnectionHtml() {
  const items = (state.data.calendarConnections || []).slice(0, 3);  // 最多显示3条羁绊
  // 渲染层去重：同一NPC只保留第一条（防止AI未遵守指令时重复）
  const _seenNpc = new Set();
  const deduped = items.filter(c => {
    const name = (c.pair || '').trim();
    if (!name || _seenNpc.has(name)) return false;
    _seenNpc.add(name);
    return true;
  });
  let body = '';
  if (!deduped.length) {
    body = '<div class="memory-empty">暂无羁绊进展</div>';
  } else {
    body = '<div class="cal-section-body">';
    deduped.forEach(c => {
      body += `<div class="cal-conn-item"><span class="cal-conn-pair">${escapeHtml(c.pair||'')}</span><span class="cal-conn-text">${escapeHtml(c.text||'')}</span></div>`;
    });
    body += '</div>';
  }
  return `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">CONNECTIONS</span><span class="cal-section-title-cn">羁绊</span></div>${body}</div>`;
}

function buildCalDailyNewsHtml() {
  const items = state.data.calendarDailyNews || [];
  let body = '';
  if (!items.length) {
    body = '<div class="memory-empty">暂无新闻</div>';
  } else {
    body = '';
    items.forEach(n => {
      const typeBadge = n.type ? `<span class="cal-news-type">${escapeHtml(n.type)}</span>` : '';
      let commentsHtml = '';
      if (n.comments && n.comments.length) {
        commentsHtml = '<div class="cal-news-divider"></div><div class="cal-news-comments">';
        n.comments.forEach(c => {
          commentsHtml += `<div class="cal-news-comment"><span class="cal-news-comment-author">@${escapeHtml(c.author||'')}</span><span class="cal-news-comment-text">${escapeHtml(c.text||'')}</span></div>`;
        });
        commentsHtml += '</div>';
      }
      body += `<div class="cal-news-item">${typeBadge}<div class="cal-news-title">${escapeHtml(n.title||'')}</div><div class="cal-news-body">${escapeHtml(n.body||'')}</div>${commentsHtml}</div>`;
    });
  }
  return `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">DAILY NEWS</span><span class="cal-section-title-cn">每日新闻</span></div>${body}</div>`;
}

// 日历状态UI (loading indicator for event generation)
function buildCalendarStateHtml() {
  if (state.eventState === 'generating' && state.activeCalendarEvent) {
    const chainEvents = state.data.eventHistory.filter(e => e.calendarEventId === state.activeCalendarEvent);
    const label = chainEvents.length === 0 ? '生成前置剧情' : '润色中';
    return `<div class="calendar-loading">${label}<span class="dots"><span></span><span></span><span></span></span></div>`;
  }
  return '';
}

function renderCalendarContent() {
  const container = document.getElementById('calendar-content');
  if (!container) return;

  // 晨报事件推进视图（从备忘/通知点击进入的关键事件）
  if (state.activeCalendarEvent && state.activeCalendarEvent.startsWith('morning_')) {
    let html = '';
    const chainEvents = state.archiveEventChain
      ? state.archiveEventChain
      : state.data.eventHistory.filter(e => e.calendarEventId === state.activeCalendarEvent);
    if (chainEvents.length === 0) {
      html += '<div class="memory-empty">该事件暂无剧情内容</div>';
    } else {
      chainEvents.forEach(evt => {
        html += buildEventBlockHtml(evt);
      });
    }
    html += `<div id="calendar-state-ui">${buildCalendarStateHtml()}</div>`;
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
    return;
  }

  // 过往日历归档视图
  if (state.calendarArchiveMode) {
    renderCalendarArchive(container);
    return;
  }

  // 查看某个归档月份的日历
  if (state.viewingCalendarArchiveMonth) {
    renderCalendarArchivedMonth(container, state.viewingCalendarArchiveMonth);
    return;
  }

  let html = '';
  // 日历页始终显示6个区块（事件推进视图在日历页）
  html += buildCalMemoHtml();
  html += buildCalNotificationHtml();
  html += buildCalMenuHtml();
  html += buildCalSocialHtml();
  html += buildCalConnectionHtml();
  html += buildCalDailyNewsHtml();
  container.innerHTML = html;
  // 不强制滚到底端：切换Tab和退出事件时保持滚动位置
  // 仅在初次载入/推进月份时由调用方显式滚动
}

// 过往日历归档列表（仅日历页自己的内容：晨报+备忘录等）
function renderCalendarArchive(container) {
  const currentMonth = state.data.calendarMonth || '';
  const archives = (state.data.calendarArchives || []).filter(a => a.month !== currentMonth);
  if (!archives.length) {
    container.innerHTML = `<div class="memory-empty" style="padding:60px 0;">暂无过往晨报<br><span style="font-size:11px;color:rgba(58,111,165,0.7)">推进月份后晨报会自动归档</span></div>`;
    return;
  }
  const months = [...archives].reverse(); // 最近的在上
  // 按年份分组
  const yearGroups = {};
  months.forEach(a => {
    const yearMatch = a.month.match(/^(第.+?年)/);
    const year = yearMatch ? yearMatch[1] : '其他';
    if (!yearGroups[year]) yearGroups[year] = [];
    yearGroups[year].push(a);
  });
  let html = '<div class="calendar-page-archive-list">';
  Object.keys(yearGroups).forEach(year => {
    html += `<div class="calendar-page-archive-year">${escapeHtml(year)}</div>`;
    yearGroups[year].forEach(a => {
      const preview = a.monthReport
        ? a.monthReport.substring(0, 40) + (a.monthReport.length > 40 ? '…' : '')
        : ((a.memos && a.memos.length) ? a.memos.length + '条备忘录' : '点击查看');
      html += `
      <div class="calendar-page-archive-card" onclick="viewCalendarArchivedMonth('${a.month}')">
        <div class="calendar-page-archive-month">${escapeHtml(a.month)}</div>
        <div class="calendar-page-archive-preview">${escapeHtml(preview)}</div>
      </div>`;
    });
  });
  html += '</div>';
  container.innerHTML = html;
}

// 查看归档月份的日历内容（晨报+备忘录+通知+餐食+舆论+关系+新闻，无时间轴事件）
function renderCalendarArchivedMonth(container, month) {
  const archive = (state.data.calendarArchives || []).find(a => a.month === month);
  if (!archive) {
    container.innerHTML = `<div class="memory-empty">该月无归档数据</div>`;
    return;
  }

  let html = '';

  // 晨报
  if (archive.monthReport) {
    html += `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">晨报</span></div><div class="cal-section-body"><div class="cal-memo-item">${escapeHtml(archive.monthReport)}</div></div></div>`;
  }

  // 备忘录
  const memos = archive.memos || [];
  if (memos.length) {
    html += `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">MEMO</span><span class="cal-section-title-cn">备忘</span></div><div class="cal-memo-grid">`;
    memos.forEach((m, i) => {
      const hasChain = hasArchivedMorningEventChain('memo', i, month);
      const dot = hasChain ? '<span class="cal-event-dot"></span>' : '';
      const clickAttr = hasChain ? ` onclick="openArchivedStoryEventFromMorning('memo',${i},'${escapeHtml(month)}')"` : '';
      const clickableClass = hasChain ? ' clickable' : '';
      html += `<div class="cal-memo-item${clickableClass}"${clickAttr} style="position:relative;">${dot}${escapeHtml(m)}</div>`;
    });
    html += `</div></div>`;
  }

  // 通知
  const notifs = archive.notifications || [];
  if (notifs.length) {
    html += `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">NOTIFICATIONS</span><span class="cal-section-title-cn">通知</span></div><div class="cal-section-body">`;
    notifs.forEach((n, i) => {
      const hasChain = hasArchivedMorningEventChain('notif', i, month);
      const dot = hasChain ? '<span class="cal-event-dot"></span>' : '';
      const clickAttr = hasChain ? ` onclick="openArchivedStoryEventFromMorning('notif',${i},'${escapeHtml(month)}')"` : '';
      const clickableClass = hasChain ? ' clickable' : '';
      html += `<div class="cal-notif-item${clickableClass}"${clickAttr} style="position:relative;">${dot}${escapeHtml(n)}</div>`;
    });
    html += `</div></div>`;
  }

  // 餐食
  const menu = archive.menu || [];
  if (menu.length) {
    html += `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">DAILY MENU</span><span class="cal-section-title-cn">每日餐食</span></div><div class="cal-section-body">`;
    menu.forEach(m => {
      html += `<div class="cal-menu-item"><span class="cal-menu-type">${escapeHtml(m.type||'')}</span><span class="cal-menu-food">${escapeHtml(m.food||'')}</span><span class="cal-menu-source">${escapeHtml(m.source||'')}</span>${m.thought?`<span class="cal-menu-thought">${escapeHtml(m.thought)}</span>`:''}</div>`;
    });
    html += `</div></div>`;
  }

  // 舆论
  const social = archive.social || [];
  if (social.length) {
    html += `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">SOCIAL FEEDBACK</span><span class="cal-section-title-cn">舆论</span></div><div class="cal-section-body">`;
    social.forEach(s => {
      if (s.author) {
        html += `<div class="cal-social-item"><span class="cal-social-author">@${escapeHtml(s.author)}</span><span class="cal-social-text">"${escapeHtml(s.text)}"</span></div>`;
      } else {
        html += `<div class="cal-social-item">${escapeHtml(s.text || s)}</div>`;
      }
    });
    html += `</div></div>`;
  }

  // 羁绊进展
  const connections = archive.connections || [];
  if (connections.length) {
    html += `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">CONNECTIONS</span><span class="cal-section-title-cn">羁绊</span></div><div class="cal-section-body">`;
    connections.forEach(c => {
      html += `<div class="cal-conn-item"><span class="cal-conn-pair">${escapeHtml(c.pair||'')}</span><span class="cal-conn-text">${escapeHtml(c.text||'')}</span></div>`;
    });
    html += `</div></div>`;
  }

  // 每日新闻
  const news = archive.dailyNews || [];
  if (news.length) {
    html += `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">DAILY NEWS</span><span class="cal-section-title-cn">每日新闻</span></div>`;
    news.forEach(n => {
      const typeBadge = n.type ? `<span class="cal-news-type">${escapeHtml(n.type)}</span>` : '';
      let commentsHtml = '';
      if (n.comments && n.comments.length) {
        commentsHtml = '<div class="cal-news-divider"></div><div class="cal-news-comments">';
        n.comments.forEach(c => {
          commentsHtml += `<div class="cal-news-comment"><span class="cal-news-comment-author">@${escapeHtml(c.author||'')}</span><span class="cal-news-comment-text">${escapeHtml(c.text||'')}</span></div>`;
        });
        commentsHtml += '</div>';
      }
      html += `<div class="cal-news-item">${typeBadge}<div class="cal-news-title">${escapeHtml(n.title||'')}</div><div class="cal-news-body">${escapeHtml(n.body||'')}</div>${commentsHtml}</div>`;
    });
    html += `</div>`;
  }

  if (!archive.monthReport && !memos.length && !notifs.length && !menu.length && !social.length && !connections.length && !news.length) {
    html += '<div class="memory-empty">该月无归档数据</div>';
  }

  container.innerHTML = html;
}

// 跳转到同月份的对应归档页面（晨报↔日历互跳）
function jumpToCorrespondingArchive() {
  // 当前在晨报查看历史月份 → 跳到日历的同一月
  if (state.viewingCalendarArchiveMonth) {
    const month = state.viewingCalendarArchiveMonth;
    const exists = (state.data.calendarTimelineArchives || []).some(a => a.month === month);
    if (!exists) { showToast('该月无日历归档数据'); return; }
    // 设置跳转标记，让 switchTab 跳过对目标 tab 归档状态的重置
    state._jumpingToArchive = month;
    state.viewingCalendarArchiveMonth = null;
    state.calendarArchiveMode = false;
    switchTab('memory');
    state._jumpingToArchive = null;
    updateCalendarPageHeaderButtons();
    return;
  }
  // 当前在日历查看历史月份 → 跳到晨报的同一月
  if (state.viewingCalendarTimelineArchiveMonth) {
    const month = state.viewingCalendarTimelineArchiveMonth;
    const exists = (state.data.calendarArchives || []).some(a => a.month === month);
    if (!exists) { showToast('该月无晨报归档数据'); return; }
    state._jumpingToArchive = month;
    state.viewingCalendarTimelineArchiveMonth = null;
    state.calendarTimelineArchiveMode = false;
    switchTab('calendar');
    state._jumpingToArchive = null;
    updateCalendarHeaderButtons();
    return;
  }
}

// Incrementally append a single event block without rebuilding the rest
function appendCalendarEvent(evtId) {
  // 事件视图在日历页，容器为 calendar-page-cards
  const container = document.getElementById('calendar-page-cards') || document.getElementById('calendar-content');
  const evt = state.data.eventHistory.find(e => e.id === evtId);
  if (!evt || !container) return;
  const stateUi = document.getElementById('calendar-state-ui');
  const eventHtml = buildEventBlockHtml(evt);
  if (stateUi) {
    stateUi.insertAdjacentHTML('beforebegin', eventHtml);
  } else {
    container.insertAdjacentHTML('beforeend', eventHtml);
  }
  // 确保DOM渲染完成后再滚动到底部
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      container.scrollTop = container.scrollHeight;
    });
  });
}

// Update only the bottom state UI without rebuilding event blocks
function updateCalendarStateUI() {
  const stateUi = document.getElementById('calendar-state-ui');
  if (stateUi) {
    stateUi.innerHTML = buildCalendarStateHtml();
  } else {
    const container = document.getElementById('calendar-page-cards') || document.getElementById('calendar-content');
    if (container) container.insertAdjacentHTML('beforeend', `<div id="calendar-state-ui">${buildCalendarStateHtml()}</div>`);
  }
  const container = document.getElementById('calendar-page-cards') || document.getElementById('calendar-content');
  if (container) {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        container.scrollTop = container.scrollHeight;
      });
    });
  }
}

// 事件输入草稿保留：重渲染输入栏时捕获/恢复未投递的文本
// 跳转页面后返回事件视图不丢内容；按事件ID隔离，切换事件不串内容
function captureEventInputDraft() {
  const el = document.getElementById('event-input');
  if (el && el.dataset.eventId) state._eventInputDraft = { eventId: el.dataset.eventId, text: el.value };
}
function restoreEventInputDraft() {
  const el = document.getElementById('event-input');
  if (!el || !el.dataset.eventId) return;
  const draft = state._eventInputDraft;
  if (draft && draft.eventId === el.dataset.eventId && draft.text) {
    el.value = draft.text;
    // switchTab 先渲染再切换可见性：渲染此刻目标页仍是 display:none，
    // scrollHeight 在隐藏状态下测不准（多行塌成一行），延迟一帧到可见后再撑高
    requestAnimationFrame(() => {
      if (el.isConnected) autoResizeInput(el);
    });
  }
}

// 点击事件链输入框时，事件内容滚动到最下方（最新叙事），等待键盘弹起动画

  setTimeout(function() {
    const container = isMorningEvent()
      ? document.getElementById('calendar-content')
      : document.getElementById('calendar-page-cards');
    if (container) container.scrollTop = container.scrollHeight;
  }, 300);
}

function renderCalendarInput() {
  const inputArea = document.getElementById('calendar-input-area');
  if (!inputArea) return;
  // 重渲染前捕获输入草稿
  captureEventInputDraft();

  // 晨报事件推进视图：渲染事件输入栏（浮标悬停在晨报内）
  if (isMorningEvent()) {
    // 只读模式：已推进的事件不再投递愿望，不显示输入栏
    if (state.eventState === 'readonly') {
      inputArea.classList.remove('input-bar-active');
      inputArea.innerHTML = '';
      return;
    }
    if (state.eventState === 'idle' || state.eventState === 'active' || state.eventState === 'input' || state.eventState === 'ended') {
      const placeholder = state.eventState === 'active' ? '继续投递剧情愿望...' : '写下你的剧情愿望...';
      inputArea.classList.add('input-bar-active');
      inputArea.innerHTML = `
        <textarea id="event-input" data-event-id="${state.activeCalendarEvent}" rows="1" placeholder="${placeholder}" onfocus="scrollEventChainToBottom()" oninput="autoResizeInput(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();sendCalendarEventWish()}"></textarea>
        <button onmousedown="event.preventDefault()" onclick="sendCalendarEventWish()">投递</button>
      `;
      restoreEventInputDraft();
      return;
    }
  }

  inputArea.classList.remove('input-bar-active');
  inputArea.innerHTML = '';
}

}

// 当月全部NPC的对话记录（供事件链/润色跨模块注入）
// 按当月开始时间戳过滤；超过6000字符时只保留最近部分（按行边界截断，避免截断在句子中间）
function collectMonthlyNpcChats() {
  const npcs = state.data.characters.npcs || [];
  const meName = (state.data.characters.me.name || '').trim() || '主控';
  const monthStart = state.data.calendarMonthStartedAt || 0;
  const MAX_CHAT_CHARS = 6000;
  let chatCtx = '';
  npcs.forEach(npc => {
    if (!npc.id || !npc.name) return;
    const chat = getNpcChat(npc.id);
    if (chat && chat.length) {
      const monthly = chat.filter(m => m.content && m.content.trim() && (!m.timestamp || m.timestamp >= monthStart));
      if (monthly.length) {
        chatCtx += `与${npc.name}当月对话：\n`;
        monthly.forEach(m => {
          const speaker = m.role === 'assistant' ? npc.name : meName;
          chatCtx += `${speaker}：${m.content}\n`;
        });
      }
    }
  });
  if (chatCtx.length > MAX_CHAT_CHARS) {
    const sliced = chatCtx.slice(-MAX_CHAT_CHARS);
    const firstNewline = sliced.indexOf('\n');
    const cleanSlice = firstNewline > 0 ? sliced.slice(firstNewline + 1) : sliced;
    chatCtx = '（聊天记录过长，仅保留最近部分）\n' + cleanSlice;
  }
  return chatCtx;
}

// 上个月全部对话记录（NPC单聊+群聊，供晨报/日历生成与刷新注入）
// 窗口=[上月起点, 本月起点)：过月生成时=刚结束月，月中刷新时=上一个月
// 超过6000字符时只保留最近部分（按行边界截断）
function collectPrevMonthAllChats() {
  const npcs = state.data.characters.npcs || [];
  const meName = (state.data.characters.me.name || '').trim() || '主控';
  const curStart = state.data.calendarMonthStartedAt || 0;
  const prevStart = state.data.calendarPrevMonthStartedAt || 0;
  const MAX_CHAT_CHARS = 6000;
  const inWindow = m => m.content && m.content.trim() && (!m.timestamp || (m.timestamp >= prevStart && m.timestamp < curStart));
  let chatCtx = '';
  npcs.forEach(npc => {
    if (!npc.id || !npc.name) return;
    const monthly = (getNpcChat(npc.id) || []).filter(inWindow);
    if (monthly.length) {
      chatCtx += `与${npc.name}上月对话：\n`;
      monthly.forEach(m => {
        const speaker = m.role === 'assistant' ? npc.name : meName;
        chatCtx += `${speaker}：${m.content}\n`;
      });
    }
  });
  (state.data.groupChats || []).forEach(grp => {
    if (!grp.name) return;
    const monthly = (grp.chatHistory || []).filter(inWindow);
    if (monthly.length) {
      chatCtx += `群聊「${grp.name}」上月对话：\n`;
      monthly.forEach(m => {
        const speaker = m.role === 'assistant' ? (m.speakerName || '成员') : meName;
        chatCtx += `${speaker}：${m.content}\n`;
      });
    }
  });
  if (chatCtx.length > MAX_CHAT_CHARS) {
    const sliced = chatCtx.slice(-MAX_CHAT_CHARS);
    const firstNewline = sliced.indexOf('\n');
    const cleanSlice = firstNewline > 0 ? sliced.slice(firstNewline + 1) : sliced;
    chatCtx = '（聊天记录过长，仅保留最近部分）\n' + cleanSlice;
  }
  return chatCtx;
}

// 晨报/日历生成与刷新的即时上下文：上个月全部对话（NPC单聊+群聊）
// 历史归档（前3个月时间轴+晨报三板块）已由 System Prompt L6 注入，此处不重复
function buildPrevMonthChatContext() {
  const chatCtx = collectPrevMonthAllChats();
  return chatCtx ? `\n【上月聊天记录（NPC与群聊，供感知人物关系与近况）】\n${chatCtx}` : '';
}

// 归一化事件类型：容错AI输出的大小写及中文变体（如"关键剧情""特殊NPC事件"）
function normEventType(raw) {
  const t = (raw || '').toString().trim().toLowerCase();
  if (t.includes('key') || t.includes('关键')) return 'key';
  if (t.includes('special') || t.includes('特殊')) return 'special';
  return 'normal';
}

// 近2月已生成的时间轴事件标题列表（查重清单，注入时间轴生成时的 user 消息）
function buildRecentEventTitlesContext() {
  const titles = [];
  const archs = state.data.calendarTimelineArchives || [];
  archs.slice(-2).forEach(a => {
    (a.events || []).forEach(e => titles.push(`${a.month} ${e.title}`));
  });
  (state.data.calendarEvents || []).forEach(e => titles.push(`${state.data.calendarMonth || ''} ${e.title}`));
  if (!titles.length) return '';
  return `\n【近期已生成的事件（新事件不得与其雷同，须避开其主题、场景和互动形式）】\n${titles.map(t => '·' + t).join('\n')}`;
}

async function _generateCalendarContent(targetMonth) {
  const month = targetMonth || state.data.calendarMonth || '';
  const monthPrefix = month ? `当前是${month}。` : '';

  // 收集历史上下文，注入晨报生成
  const monthlyCtx = buildPrevMonthChatContext();

  // 单次调用生成全部 6 模块
  try {
    const raw = await callAI(monthPrefix + monthlyCtx + '请一次性生成晨报全部6个板块的内容。', 'calendarAll');
    // 防御性清理：移除 AI 可能残留的 ===MODULE=== 分隔符
    const cleaned = raw.replace(/===MODULE===/g, '');
    // 按 ===MARKER=== 分隔符拆分各板块
    const parts = cleaned.split(/===(?:MEMO|NOTIFICATION|MENU|SOCIAL|CONNECTION|NEWS)===/);
    // parts[0] = 第一个标记前的内容（通常为空），后续依次为各板块内容
    // 容错校验：正常应拆出 7 段（含首段空内容）
    if (parts.length < 7) {
      console.warn('[晨报] 板块标记不完整，期望7段实际%d段，缺失板块将为空', parts.length);
    }

    // 1. MEMO
    state.data.calendarMemos = (parts[1] || '').trim().split('\n').filter(l => l.trim());

    // 2. NOTIFICATION
    state.data.calendarNotifications = (parts[2] || '').trim().split('\n').filter(l => l.trim());

    // 3. MENU
    state.data.calendarMenu = (parts[3] || '').trim().split('\n').filter(l => l.trim()).map(line => {
      const p = line.split('|||').map(s => s.trim());
      return { type: p[0]||'', food: p[1]||'', source: p[2]||'', thought: p[3]||'' };
    });

    // 4. SOCIAL
    state.data.calendarSocial = (parts[4] || '').trim().split('\n').filter(l => l.trim()).map(line => {
      const p = line.split('|||').map(s => s.trim());
      return { author: p[0] || '', text: p[1] || '' };
    });

    // 5. CONNECTION（带姓名纠错：姓氏相同但名字不同 → 视为笔误，自动纠正为真实NPC名；最多保留3条）
    const _existingNpcNames = (state.data.characters.npcs || []).map(n => (n.name || '').trim()).filter(Boolean);
    state.data.calendarConnections = (parts[5] || '').trim().split('\n').filter(l => l.trim()).map(line => {
      const p = line.split('|||').map(s => s.trim());
      let _name = p[0] || '';
      // 精确匹配 → 保留
      if (!_existingNpcNames.includes(_name) && _name.length >= 2) {
        // 姓氏模糊匹配：若与某NPC同姓但全名不同，判定为笔误，纠正为真实姓名
        const _matched = _existingNpcNames.find(real => real.length >= 2 && real[0] === _name[0] && real !== _name);
        if (_matched) {
          console.warn('[晨报] NPC姓名纠错：' + _name + ' → ' + _matched);
          _name = _matched;
        }
      }
      return { pair: _name, text: p[1]||'' };
    });

    // 6. NEWS（区块内用 ~~~ 分隔条目，兼容旧版 === 分隔）
    const newsRaw = (parts[6] || '').trim();
    const newsBlocks = newsRaw.split(/~~~|===/).map(s => s.trim()).filter(s => s);
    state.data.calendarDailyNews = newsBlocks.map(block => {
      const p = block.split('|||').map(s => s.trim());
      const type = p[0] || '';
      const title = p[1] || '';
      const body = p[2] || '';
      const comments = [];
      for (let i = 3; i < p.length; i++) {
        const c = p[i];
        // 兼容全角和半角冒号
        const colonIdx = Math.max(c.indexOf('：'), c.indexOf(':'));
        if (colonIdx > 0) {
          comments.push({ author: c.substring(0, colonIdx).trim(), text: c.substring(colonIdx + 1).trim() });
        }
      }
      return { type, title, body, comments };
    });
  } catch(e) {
    console.error('[晨报] 内容生成失败:', e);
  }

  if (!state.data.calendarMonth) {
    state.data.calendarMonth = '第1年1月';
    state.data.calendarMonthStartedAt = Date.now();
  }
  saveToStorage();
}

// 生成全部晨报内容（用户手动点击刷新按钮时调用）
async function generateCalendarAll(targetMonth) {
  if (state.isLoading) { showToast('正在生成中，请稍后再试'); return; }
  // 事件视图下不刷新
  if (state.activeCalendarEvent) {
    showToast('请先退出当前事件视图再刷新');
    return;
  }
  const genBtn = document.querySelector('.calendar-gen-btn');
  if (genBtn) genBtn.classList.add('loading');
  state.isLoading = true;

// 从事件ID查找或构造日历事件对象（晨报事件不在 calendarEvents 中，需从备忘/通知构造）
function getCalEventById(evtId) {
  // 先从当月日历事件中查找
  let calEvt = (state.data.calendarEvents || []).find(e => e.id === evtId);
  if (calEvt) return calEvt;
  // 晨报事件：从事件ID解析原始文本（morning_type_index_month 格式）
  const parts = evtId && evtId.match(/^morning_(\w+)_(\d+)_(.+)$/);
  if (!parts) return null;
  const type = parts[1];
  const idx = parseInt(parts[2]);
  const month = parts[3];
  let text = '';
  // 优先从当月数据查找，其次从归档数据查找
  if (type === 'memo') {
    text = (state.data.calendarMemos || [])[idx] || '';
    if (!text) {
      const archive = (state.data.calendarArchives || []).find(a => a.month === month);
      if (archive) text = (archive.memos || [])[idx] || '';
    }
  } else if (type === 'notif') {
    text = (state.data.calendarNotifications || [])[idx] || '';
    if (!text) {
      const archive = (state.data.calendarArchives || []).find(a => a.month === month);
      if (archive) text = (archive.notifications || [])[idx] || '';
    }
  }
  if (!text) return null;
  const title = text.length > 20 ? text.substring(0, 20) + '…' : text;
  return { id: evtId, title, desc: text, date: month, isKey: true, advanced: false };
}

// 清洗事件叙事AI响应中残留的状态快照标记
// 旧版叙事调用曾要求AI在正文后输出 |||STATE||| 状态快照，现仅作防御性清洗，正常情况无分隔符
// 返回 { narrative: '叙事正文', state: '状态快照（若有）' }
function parseNarrativeAndState(raw) {
  if (!raw) return { narrative: '', state: '' };
  const delimiter = '|||STATE|||';
  const idx = raw.indexOf(delimiter);
  if (idx === -1) {
    // AI没输出分隔符，尝试找【状态快照】等变体
    const altIdx = raw.search(/\n【?状态快照】?\n?/);
    if (altIdx !== -1) {
      return {
        narrative: raw.slice(0, altIdx).trim(),
        state: raw.slice(altIdx).replace(/^[\n【】状态快照]+/, '').trim()
      };
    }
    return { narrative: raw.trim(), state: '' };
  }
  return {
    narrative: raw.slice(0, idx).trim(),
    state: raw.slice(idx + delimiter.length).trim()
  };
}

// 构建快照上下文数据（日历事件+聊天+晨报+主线），供合并生成调用（generateSummaryAndSnapshot）使用
function buildSnapshotContext() {
  const _meName = (state.data.characters.me.name || '').trim() || '主控';
  const npcs = state.data.characters.npcs || [];
  const npcNames = npcs.map(n => n.name).filter(Boolean);
  const _npcListStr = npcNames.length ? npcNames.join('、') : 'AI角色';

  // 1. 日历事件数据
  const archives = state.data.calendarTimelineArchives || [];
  const recentArchives = archives.slice(-2);
  let timelineContext = '';

  recentArchives.forEach(arch => {
    const archKeyEvents = (arch.events || []).filter(e => e.isKey);
    const archSpecialEvents = (arch.events || []).filter(e => !e.isKey && e.type === 'special');
    const archNormalEvents = (arch.events || []).filter(e => !e.isKey && e.type !== 'special');
    // 旧事件只注入总结粒度，不注入叙事全文（总结已覆盖其信息，避免双份冗余）
    timelineContext += `\n【${arch.month} 日历事件概况】\n`;
    archKeyEvents.forEach(e => {
      timelineContext += `关键事件：${e.title} - ${e.desc}\n`;
      if (e.summary) timelineContext += `事件总结：${e.summary}\n`;
    });
    archSpecialEvents.forEach(e => {
      timelineContext += `特殊NPC事件：${e.title} - ${e.desc}\n`;
    });
    archNormalEvents.forEach(e => {
      timelineContext += `生活切片：${e.title} - ${e.desc}\n`;
    });
  });

  const currentMonth = state.data.calendarMonth || '当月';
  timelineContext += `\n【${currentMonth} 日历事件概况】\n`;
  const currentKeyEvents = (state.data.calendarEvents || []).filter(e => e.isKey);
  const currentSpecialEvents = (state.data.calendarEvents || []).filter(e => !e.isKey && e.type === 'special');
  const currentNormalEvents = (state.data.calendarEvents || []).filter(e => !e.isKey && e.type !== 'special');
  // 排除当前正在保存的链：其全文已在任务一的【事件内容】注入，此处不重复
  const currentChains = (state.data.eventHistory || []).filter(
    e => !e.isSummary && !e.isPrequel && e.chainId !== state.currentChainId
  );

  // 晨报关键事件：不在 calendarEvents 中，但从 eventHistory 中提取已保存的事件链
  const morningChainIds = [...new Set(
    state.data.eventHistory
      .filter(e => typeof e.calendarEventId === 'string' && e.calendarEventId.startsWith('morning_'))
      .map(e => e.calendarEventId)
  )];
  morningChainIds.forEach(evtId => {
    const summaryEvt = state.data.eventHistory.find(e => e.calendarEventId === evtId && e.isSummary);
    // 从事件ID解析标题（morning_type_index_month 格式）
    const parts = evtId.match(/^morning_(\w+)_(\d+)_(.+)$/);
    let morningTitle = evtId;
    let morningDesc = evtId;
    if (parts) {
      const type = parts[1];
      const idx = parseInt(parts[2]);
      let text = '';
      if (type === 'memo') text = (state.data.calendarMemos || [])[idx] || '';
      else if (type === 'notif') text = (state.data.calendarNotifications || [])[idx] || '';
      if (text) {
        morningTitle = text.length > 20 ? text.substring(0, 20) + '…' : text;
        morningDesc = text;
      }
    }
    timelineContext += `晨报关键事件：${morningTitle} - ${morningDesc}\n`;
    if (summaryEvt && summaryEvt.aiNarrative) timelineContext += `事件总结：${summaryEvt.aiNarrative}\n`;
  });
  currentKeyEvents.forEach(e => {
    timelineContext += `关键事件：${e.title} - ${e.desc}\n`;
    if (e.summary) timelineContext += `事件总结：${e.summary}\n`;
  });
  currentSpecialEvents.forEach(e => {
    timelineContext += `特殊NPC事件：${e.title} - ${e.desc}\n`;
  });
  currentNormalEvents.forEach(e => {
    timelineContext += `生活切片：${e.title} - ${e.desc}\n`;
  });
  currentChains.forEach(e => {
    if (e.aiNarrative) timelineContext += `叙事片段：${e.aiNarrative}\n`;
  });

  // 2. 当月聊天记录
  const monthStart = state.data.calendarMonthStartedAt || 0;
  let chatContext = '';
  npcs.forEach(npc => {
    if (!npc.id || !npc.name) return;
    const chat = getNpcChat(npc.id);
    if (chat && chat.length) {
      const monthly = chat.filter(m => m.content && m.content.trim() && (!m.timestamp || m.timestamp >= monthStart));
      if (monthly.length) {
        chatContext += `与${npc.name}当月对话：\n`;
        monthly.forEach(m => {
          const speaker = m.role === 'assistant' ? npc.name : _meName;
          chatContext += `${speaker}：${m.content}\n`;
        });
      }
    }
  });
  const MAX_SNAP_CHAT = 8000;
  if (chatContext.length > MAX_SNAP_CHAT) {
    const sliced = chatContext.slice(-MAX_SNAP_CHAT);
    const firstNewline = sliced.indexOf('\n');
    const cleanSlice = firstNewline > 0 ? sliced.slice(firstNewline + 1) : sliced;
    chatContext = '（聊天记录过长，仅保留最近部分）\n' + cleanSlice;
  }

  // 3. 晨报内容（注：monthReport 为历史遗留空字段，从不产出内容，不注入）
  let calendarContext = '';
  if (state.data.calendarMemos && state.data.calendarMemos.length) {
    calendarContext += '当月备忘录：\n';
    state.data.calendarMemos.forEach(m => { calendarContext += `- ${m}\n`; });
  }
  if (state.data.calendarNotifications && state.data.calendarNotifications.length) {
    calendarContext += '当月通知：\n';
    state.data.calendarNotifications.forEach(n => { calendarContext += `- ${n}\n`; });
  }
  if (state.data.calendarConnections && state.data.calendarConnections.length) {
    calendarContext += '当月羁绊进展：\n';
    state.data.calendarConnections.forEach(c => { calendarContext += `- ${c.pair}：${c.text || ''}\n`; });
  }
  const calArchives = state.data.calendarArchives || [];
  const recentCalArchives = calArchives.slice(-2);
  recentCalArchives.forEach(arch => {
    const secLines = [];
    if (arch.memos && arch.memos.length) secLines.push(`备忘录：${arch.memos.filter(Boolean).join('；')}`);
    if (arch.notifications && arch.notifications.length) secLines.push(`通知：${arch.notifications.filter(Boolean).join('；')}`);
    if (secLines.length) calendarContext += `\n【${arch.month} 晨报】\n${secLines.join('\n')}\n`;
  });

  // 4. 主线剧情
  const mainStory = (state.data.mainStory || '').trim();

  return { _meName, _npcListStr, timelineContext, chatContext, calendarContext, mainStory };
}

// 合并生成事件总结+状态快照（1次API调用，替代原来的2次）
// 用于关键剧情保存时，同时生成事件摘要和故事状态快照
async function generateSummaryAndSnapshot(calEvt, chainEvents) {
  const config = state.data.apiConfig;
  if (!config.apiKey) { throw new Error('未配置API密钥，请先在设置中填写'); }

  const { _meName, _npcListStr, timelineContext, chatContext, calendarContext, mainStory } = buildSnapshotContext();
  const _otherName = (getActiveNpc().name || '').trim() || 'AI角色';
  console.log('[合并生成] 开始 | 事件:%s | 主控:%s', calEvt.title, _meName);

  // 构建事件链内容
  let eventContent = '';
  chainEvents.forEach(e => {
    if (e.polishedWish) eventContent += `【愿望】${e.polishedWish}\n`;
    if (e.aiNarrative) eventContent += `【叙事】${e.aiNarrative}\n`;
  });

  const combinedPrompt = `请完成以下两项任务，按要求输出。

【任务一：事件总结】
请根据以下关键事件的内容，生成一段事件总结（类似记忆卡片）。
事件标题：${calEvt.title}
事件简述：${calEvt.desc}
事件内容：
${eventContent}
要求：
1. 总结关键信息：重要事件、角色关系变化、人物状态演变。尽量保留具体细节，如涉及的人物姓名、具体约定、关键道具、地点、转折点等，不要只写空泛的概括。
2. 一段简洁的摘要，不超过400字。一律使用人物姓名指代——主控角色用"${_meName}"，AI角色用"${_otherName}"。
3. 只记录已发生的事实，不加入推测或评价。
4. 直接输出摘要正文，不要加任何标题、标记或说明。

【任务二：故事状态快照】
请通读以下全部数据后，进行归纳总结，生成当前故事状态快照。关注权重递减为：关键事件 → 日历日常事件 → 聊天记录 → 晨报。
要求：
1. 提取关键信息：重要事件、角色关系变化、人物状态演变。尽量保留具体细节，不要只写空泛的概括。
2. 按以下维度逐项输出，每项以维度名为引导，内容为连贯叙述：
  【近期经历】概括最近几个月发生了什么，体现从先前到现在的变化脉络。
  【主线进展】主线剧情的当前推进阶段、核心冲突的演变、最近的关键转折。
  【关系动态】描述${_meName}与${_npcListStr}之间的关系当前态势，点出最具变化的关系即可。
  【情感矛盾】当前存在的情感张力、未解决的冲突或暗流。
  【角色状态】概括${_meName}及各NPC此刻的情绪心理和性格偏移。
3. 一律使用人物姓名指代，不使用"你""角色"等模糊代词。
4. 只记录已发生的事实，不加入推测或评价。
5. 整体控制在800字以内，简洁凝练。

【主线剧情约束】
${mainStory || '（未设置主线剧情）'}

【日历事件数据（含关键事件、日常事件、叙事片段）】
${timelineContext || '（无）'}

【近期聊天记录】
${chatContext || '（无）'}

【晨报内容（当月+历史归档）】
${calendarContext || '（无）'}

输出格式：
先输出任务一的事件总结，然后输出 ===SNAPSHOT=== 分隔符，再输出任务二的状态快照。不要加任何额外说明。`;

  console.log('[合并生成] Prompt字数:%d', combinedPrompt.length);
  if (combinedPrompt.length > 30000) {
    console.warn('[合并生成] Prompt总字数 %d 超过 30000，可能触发 token 溢出', combinedPrompt.length);
  }

  const messages = [
    { role: 'system', content: '你是一个故事状态总结助手。请按要求完成事件总结和状态快照两项任务。保留具体细节，不要写空泛的概括。' },
    { role: 'user', content: combinedPrompt }
  ];
  // 失败直接抛出，由调用方（saveCalendarKeyEvent）统一提示并中止保存流程
  const result = await callWithRetry(() => callOpenAICompatible(messages, config), 1);
  console.log('[合并生成] 返回字数:%d', result.length);
  // 解析分隔符
  const delimiter = '===SNAPSHOT===';
  const idx = result.indexOf(delimiter);
  if (idx !== -1) {
    const summary = result.slice(0, idx).trim();
    const snapshot = result.slice(idx + delimiter.length).trim();
    console.log('[合并生成] 解析成功 | 总结:%d字 | 快照:%d字', summary.length, snapshot.length);
    return { summary, snapshot };
  }
  // 模糊匹配
  const altIdx = result.search(/==+SNAPSHOT==+/);
  if (altIdx !== -1) {
    const summary = result.slice(0, altIdx).trim();
    const snapshot = result.slice(altIdx).replace(/^=+SNAPSHOT=+/, '').trim();
    console.log('[合并生成] 模糊匹配成功 | 总结:%d字 | 快照:%d字', summary.length, snapshot.length);
    return { summary, snapshot };
  }
  // 无分隔符：整体当总结，快照为空（降级为仅总结）
  console.warn('[合并生成] 未找到分隔符，整体作为总结返回');
  return { summary: result.trim(), snapshot: '' };
}

async function doRefreshNarrative(evtId, side) {
  const evt = state.data.eventHistory.find(e => e.id === evtId);
  if (!evt) return;
  if (state.isLoading) return;

  state.isLoading = true;
  state.calendarLoading = true;
  const boxId = side === 'ai' ? `ai-narr-${evtId}` : `player-narr-${evtId}`;
  const box = document.getElementById(boxId);
  if (box) box.innerHTML = `<div class="calendar-loading" style="padding:8px;">重新生成<span class="dots"><span></span><span></span><span></span></span></div>`;

  // 暂时从 eventHistory 中移除当前事件，使 buildHistoryMessages 上下文
  // 只包含此事件之前的历史（上一条未删除的润色/叙事文本），避免当前事件自身干扰重新生成
  const evtIdx = state.data.eventHistory.indexOf(evt);
  state.data.eventHistory.splice(evtIdx, 1);

  try {
    if (side === 'ai') {
      if (evt.isSummary) {
        // 事件总结Retry：重新生成总结
        const calEvt = getCalEventById(evt.calendarEventId);
        if (calEvt) {
          const chainEvents = state.data.eventHistory.filter(e => e.calendarEventId === evt.calendarEventId && !e.isSummary && e.id !== evt.id);
          const _meName = (state.data.characters.me.name || '').trim() || '主控';
          const _otherName = (getActiveNpc().name || '').trim() || 'AI角色';
          let eventContent = '';
          chainEvents.forEach(e => {
            if (e.polishedWish) eventContent += `【愿望】${e.polishedWish}\n`;
            if (e.aiNarrative) eventContent += `【叙事】${e.aiNarrative}\n`;
          });
          const summaryPrompt = `请根据以下关键事件的内容，生成一段事件总结（类似记忆卡片）。\n\n事件标题：${calEvt.title}\n事件简述：${calEvt.desc}\n\n事件内容：\n${eventContent}\n\n要求：\n1. 总结关键信息：重要事件、角色关系变化、人物状态演变。\n2. 尽量保留具体细节，如涉及的人物姓名、具体约定、关键道具、地点、转折点等，不要只写空泛的概括。\n3. 一段简洁的摘要，不超过400字。一律使用人物姓名指代——主控角色用"${_meName}"，AI角色用"${_otherName}"。\n4. 只记录已发生的事实，不加入推测或评价。\n5. 直接输出摘要正文，不要加任何标题、标记或说明。`;
          evt.aiNarrative = await callAI(summaryPrompt, 'eventNarrative');
          state.data.pendingSessionBreak = true;
        }
      } else if (evt.isPrequel) {
        // 前置剧情Retry：重新生成场景铺垫
        const calEvt = getCalEventById(evt.calendarEventId);
        if (calEvt) {
          const _meName = (state.data.characters.me.name || '').trim() || '主控';
          const _otherName = (getActiveNpc().name || '').trim() || 'AI角色';
          const prequelPrompt = `请为以下关键事件生成一段前置剧情（场景铺垫），为正式事件的发生做铺垫。\n\n事件标题：${calEvt.title}\n事件简述：${calEvt.desc}\n事件日期：${calEvt.date}\n\n要求：\n1. 严格使用第三人称叙述，指代主控角色用"${_meName}"，指代AI角色用"${_otherName}"。\n2. 描写事件发生前的场景、氛围、人物状态，自然引向事件的发生。\n3. 不要直接复述事件简述，而是展开事件发生前的细节。\n4. 200-400字，段落间用换行分隔。\n5. 心理活动用「」括起来，对话内容用""括起来。\n6. 只输出叙事文段，不加任何说明。`;
          evt.aiNarrative = await callAI(prequelPrompt, 'event');
          const parsed = parseNarrativeAndState(evt.aiNarrative);
          evt.aiNarrative = parsed.narrative;
          state.data.pendingSessionBreak = true;
        }
      } else {
        // 叙事Retry：与 sendEventWish 的原始生成逻辑一致
        // 基于玩家的愿望 + 当前的润色文本（若已被删除则只用愿望），从上一条未删除文本之后继续推进
        const polished = evt.polishedWish || '';
        const wish = evt.wish || evt.polishedWish || '';
        let prompt;
        if (polished) {
          prompt = `【玩家的剧情愿望】\n<用户输入>${wish}</用户输入>\n\n【润色后的愿望文本（仅供参考，不要复述其中内容）】\n${polished}\n\n请基于玩家的愿望推进剧情，生成第三人称叙事文段。叙事必须从润色文本结束的地方继续推进，展开新的动作、对话、场景或情节发展，严禁复述或重复润色文本中已写过的任何句子、段落或场景描写。`;
        } else {
          prompt = `【玩家的剧情愿望】\n<用户输入>${wish}</用户输入>\n\n请基于玩家的愿望推进剧情，生成第三人称叙事文段。`;
        }
        evt.aiNarrative = await callAI(prompt, 'event');
        // 清洗叙事文本（防止AI残留 |||STATE||| 等标记）
        const parsed = parseNarrativeAndState(evt.aiNarrative);
        evt.aiNarrative = parsed.narrative;
        // 剧情推进：挂起会话分隔信号（下次聊天开新会话边界；新快照仅在保存关键事件时生成）
        state.data.pendingSessionBreak = true;
      }
    } else {
      // 润色Retry：基于玩家投递的叙事愿望，从上一条未删除的文本之后自然衔接
      const wish = evt.wish || evt.polishedWish || '';
      evt.polishedWish = await callAI(wish, 'polish');
    }
    // 恢复当前事件到 eventHistory 原位置
    state.data.eventHistory.splice(evtIdx, 0, evt);
    saveToStorage();
    // Only update the single card body (no full re-render)
    if (box) {
      const body = side === 'ai' ? evt.aiNarrative : evt.polishedWish;
      box.innerHTML = body ? formatNarrativeText(body) : '<span style="color:var(--text-faint);font-style:italic;">（已删除）</span>';
    }
  } catch(e) {
    // 恢复当前事件到 eventHistory 原位置
    state.data.eventHistory.splice(evtIdx, 0, evt);
    showToast('重新生成失败：' + (e.message || '未知错误'));
    // Restore original content on failure
    if (box) {
      const body = side === 'ai' ? evt.aiNarrative : evt.polishedWish;
      box.innerHTML = body ? formatNarrativeText(body) : '<span style="color:var(--text-faint);font-style:italic;">（已删除）</span>';
    }
  } finally {
    state.isLoading = false;
    state.calendarLoading = false;
  }
}

function doDeleteNarrative(evtId, side) {
  const evt = state.data.eventHistory.find(e => e.id === evtId);
  if (!evt) return;
  // Clear the deleted side's content
  if (side === 'ai') {
    evt.aiNarrative = '';
  } else {
    evt.polishedWish = '';
    evt.wish = '';
  }

  // Remove the corresponding card element from DOM (no full re-render)
  const blockEl = document.querySelector(`.narrative-block[data-id="${evtId}"]`);
  if (blockEl) {
    const cardEl = blockEl.querySelector(side === 'ai' ? '.narr-card.ai' : '.narr-card.player');
    if (cardEl) cardEl.remove();
  }

  // If both sides are now empty, remove the entire event block from data
  if (!evt.polishedWish && !evt.wish && !evt.aiNarrative) {
    const idx = state.data.eventHistory.findIndex(e => e.id === evtId);
    if (idx !== -1) state.data.eventHistory.splice(idx, 1);
    if (blockEl) blockEl.remove();
  }
  saveToStorage();
  showToast('已删除');
}

/* ========== 记忆页（日历） ========== */
function renderCalendarPage() {
  const container = document.getElementById('calendar-page-cards');
  if (!container) return;

  // 事件推进视图：渲染前置剧情 + 叙事卡片（晨报事件仅在晨报页渲染，不在日历页显示）
  if (state.activeCalendarEvent && !isMorningEvent()) {
    let html = '';
    // 优先从归档事件链读取，否则从当月 eventHistory 读取
    const chainEvents = state.archiveEventChain
      ? state.archiveEventChain
      : state.data.eventHistory.filter(e => e.calendarEventId === state.activeCalendarEvent);
    if (chainEvents.length === 0) {
      html += '<div class="memory-empty">该事件暂无剧情内容</div>';
    } else {
      chainEvents.forEach(evt => {
        html += buildEventBlockHtml(evt);
      });
    }
    html += `<div id="calendar-state-ui">${buildCalendarStateHtml()}</div>`;
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
    renderCalendarPageEventInput();
    return;
  }

  // 查看归档月份的时间轴
  if (state.viewingCalendarTimelineArchiveMonth) {
    renderCalendarPageArchivedTimeline(state.viewingCalendarTimelineArchiveMonth);
    return;
  }

  // 过往记忆档案视图
  if (state.calendarTimelineArchiveMode) {
    renderCalendarPageArchive(container);
    restoreCalendarPageActions();
    return;
  }

  // 时间轴事件视图
  const events = state.data.calendarEvents || [];

  if (!events.length) {
    container.innerHTML = `<div class="memory-empty">暂无时间轴事件<br><span style="font-size:11px;color:rgba(58,111,165,0.7)">点击下方按钮生成事件</span></div>`;
    restoreCalendarPageActions();
    return;
  }

  let html = '<div class="calendar-timeline">';
  events.forEach(evt => {
    const keyClass = evt.isKey ? ' key' : '';
    const specialClass = (!evt.isKey && evt.type === 'special') ? ' special' : '';
    const advancedClass = evt.advanced ? ' advanced' : '';
    const keyBadge = evt.isKey
      ? (evt.advanced
        ? '<span class="calendar-event-badge done">已推进</span>'
        : '<span class="calendar-event-badge">关键剧情</span>')
      : (evt.type === 'special' ? '<span class="calendar-event-badge special">特殊NPC</span>' : '');
    // 关键剧情：整个卡片可点击进入（已推进的也可查看）
    const clickable = evt.isKey;
    const clickAttr = clickable ? ` onclick="openCalendarKeyEvent('${evt.id}')"` : '';
    const clickableClass = clickable ? ' clickable' : '';
    // 已推进的事件：显示事件总结（优先用 evt.summary，旧数据回退查 eventHistory）
    let summaryText = '';
    if (evt.isKey && evt.advanced) {
      if (evt.summary) {
        summaryText = evt.summary;
      } else {
        const summaryEvt = (state.data.eventHistory || []).find(
          e => e.calendarEventId === evt.id && e.isSummary
        );
        if (summaryEvt) {
          summaryText = summaryEvt.aiNarrative || '';
          // 回写到事件本身，下次不用再查
          evt.summary = summaryText;
        }
      }
    }
    const summaryHtml = summaryText
      ? `<div class="calendar-event-summary">${escapeHtml(summaryText)}</div>`
      : '';
    html += `
      <div class="calendar-event${keyClass}${specialClass}${advancedClass}${clickableClass}"${clickAttr}>
        <div class="calendar-event-dot"></div>
        <div class="calendar-event-body">
          <div class="calendar-event-date-row">
            <span class="calendar-event-date">${escapeHtml(evt.date)}</span>
            ${keyBadge}
          </div>
          <div class="calendar-event-desc">${escapeHtml(evt.desc)}</div>
          ${summaryHtml}
        </div>
      </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
  restoreCalendarPageActions();
}

// 过往日历档案视图：按年分组，每月显示关键剧情标题
function renderCalendarPageArchive(container) {
  const currentMonth = state.data.calendarMonth || '';
  const archives = (state.data.calendarTimelineArchives || []).filter(a => a.month !== currentMonth);
  if (!archives.length) {
    container.innerHTML = `<div class="memory-empty">暂无过往日历<br><span style="font-size:11px;color:rgba(58,111,165,0.7)">推进月份后过往日历会自动归档</span></div>`;
    return;
  }
  const months = [...archives].reverse(); // 最近的在上

  // 按年份分组
  const yearGroups = {};
  months.forEach(a => {
    const yearMatch = a.month.match(/^(第.+?年)/);
    const year = yearMatch ? yearMatch[1] : '其他';
    if (!yearGroups[year]) yearGroups[year] = [];
    yearGroups[year].push(a);
  });

  let html = '<div class="calendar-page-archive-list">';
  Object.keys(yearGroups).forEach(year => {
    html += `<div class="calendar-page-archive-year">${escapeHtml(year)}</div>`;
    yearGroups[year].forEach(a => {
      const events = a.events || [];
      const keyEvents = events.filter(e => e.isKey);
      // 辅助文本：显示关键剧情标题
      let preview;
      if (keyEvents.length > 0) {
        preview = keyEvents.map(e => e.title).join('、');
      } else if (events.length > 0) {
        preview = events[0].title + '等' + events.length + '条事件';
      } else {
        preview = '点击查看';
      }
      html += `
      <div class="calendar-page-archive-card" onclick="viewArchivedMonth('${a.month}')">
        <div class="calendar-page-archive-month">${escapeHtml(a.month)}</div>
        <div class="calendar-page-archive-preview">${escapeHtml(preview)}</div>
      </div>`;
    });
  });
  html += '</div>';
  container.innerHTML = html;
}

// 渲染归档月份的日历内容（时间轴事件 + 记忆卡片，仅来自 calendarTimelineArchives）
function renderCalendarPageArchivedTimeline(month) {
  const container = document.getElementById('calendar-page-cards');
  if (!container) return;

  // 仅从日历页自己的归档中查找
  const archive = (state.data.calendarTimelineArchives || []).find(a => a.month === month);
  if (!archive) {
    container.innerHTML = `<div class="memory-empty">该月无归档数据</div>`;
    return;
  }
  const events = archive.events || [];
  const cards = archive.cards || [];

  let html = '';

  // 显示该月的记忆卡片
  if (cards.length) {
    html += '<div class="calendar-cards-section-title">记忆卡片</div>';
    html += '<div class="calendar-page-archive-cards">';
    cards.forEach(card => {
      html += `<div class="calendar-card-item"><div class="calendar-card-content">${escapeHtml(card.content || '')}</div></div>`;
    });
    html += '</div>';
  }

  // 显示该月的时间轴事件
  if (events.length) {
    html += '<div class="calendar-page-archive-section-title">时间轴</div>';
    html += '<div class="calendar-timeline">';
    events.forEach(evt => {
      const keyClass = evt.isKey ? ' key' : '';
      const specialClass = (!evt.isKey && evt.type === 'special') ? ' special' : '';
      const advancedClass = evt.advanced ? ' advanced' : '';
      const keyBadge = evt.isKey
        ? (evt.advanced
          ? '<span class="calendar-event-badge done">已推进</span>'
          : '<span class="calendar-event-badge">关键剧情</span>')
        : (evt.type === 'special' ? '<span class="calendar-event-badge special">特殊NPC</span>' : '');
      const clickable = evt.isKey;
      const clickAttr = clickable ? ` onclick="openCalendarKeyEvent('${evt.id}','${escapeHtml(month)}')"` : '';
      const clickableClass = clickable ? ' clickable' : '';
      const summaryHtml = (evt.isKey && evt.advanced && evt.summary)
        ? `<div class="calendar-event-summary">${escapeHtml(evt.summary)}</div>`
        : '';
      html += `
        <div class="calendar-event${keyClass}${specialClass}${advancedClass}${clickableClass}"${clickAttr}>
          <div class="calendar-event-dot"></div>
          <div class="calendar-event-body">
            <div class="calendar-event-date-row">
              <span class="calendar-event-date">${escapeHtml(evt.date)}</span>
              ${keyBadge}
            </div>
            <div class="calendar-event-desc">${escapeHtml(evt.desc)}</div>
            ${summaryHtml}
          </div>
        </div>`;
    });
    html += '</div>';
  }

  if (!cards.length && !events.length) {
    html += '<div class="memory-empty">该月无归档数据</div>';
  }

  container.innerHTML = html;
}

// 保存并结束关键事件：生成事件总结，标记已推进（可查看但不能再投递愿望）
async function saveCalendarKeyEvent() {
  if (state.isLoading) { showToast('正在生成中，请稍后再保存'); return; }
  if (!state.activeCalendarEvent) return;

  // 查找事件对象：先从 calendarEvents 查找，晨报事件不在其中则构造临时对象
  let calEvt = state.data.calendarEvents.find(e => e.id === state.activeCalendarEvent);
  const isMorning = isMorningEvent();
  if (!calEvt && isMorning) {
    // 晨报事件：从 eventHistory 中查找事件信息构造临时对象
    const firstEvt = state.data.eventHistory.find(e => e.calendarEventId === state.activeCalendarEvent);
    // 从事件ID解析原始文本（morning_type_index_month 格式）
    const parts = state.activeCalendarEvent.match(/^morning_(\w+)_(\d+)_(.+)$/);
    let title = state.activeCalendarEvent;
    let desc = state.activeCalendarEvent;
    if (parts) {
      const type = parts[1];
      const idx = parseInt(parts[2]);
      const month = parts[3];
      let text = '';
      if (type === 'memo') text = (state.data.calendarMemos || [])[idx] || '';
      else if (type === 'notif') text = (state.data.calendarNotifications || [])[idx] || '';
      if (text) {
        title = text.length > 20 ? text.substring(0, 20) + '…' : text;
        desc = text;
      }
    }
    calEvt = { id: state.activeCalendarEvent, title, desc, date: parts ? parts[3] : '', isKey: true, advanced: false };
  }
  if (!calEvt) return;

  // 已推进的事件：忽略保存操作（晨报事件通过 isSummary 判断）
  if (isMorning) {
    const hasSummary = state.data.eventHistory.some(
      e => e.calendarEventId === state.activeCalendarEvent && e.isSummary
    );
    if (hasSummary) return;
  } else {
    if (calEvt.advanced) return;
  }

  // 检查是否有实际内容（前置剧情或玩家投递）
  const chainEvents = state.data.eventHistory.filter(e => e.calendarEventId === state.activeCalendarEvent);
  if (!chainEvents.length) {
    showToast('暂无内容可保存');
    return;
  }

  state.isLoading = true;
  state.calendarLoading = true;
  state.eventState = 'generating';
  updateActiveEventHeaderButtons();
  renderActiveEventView();

  try {
    // 合并调用：1次API同时生成事件总结 + 状态快照C
    const { summary, snapshot } = await generateSummaryAndSnapshot(calEvt, chainEvents);
    // 生成失败或总结为空时不落盘（不写入空总结记录，快照保持旧值）
    if (!summary || !summary.trim()) {
      throw new Error('事件总结为空');
    }

    // 将总结作为事件总结存入事件链
    state.data.eventHistory.push({
      id: 'summary_' + Date.now(),
      chainId: state.currentChainId,
      calendarEventId: state.activeCalendarEvent,
      wish: '',
      polishedWish: '',
      aiNarrative: summary,
      isSummary: true,
      timestamp: Date.now()
    });

    // 标记关键事件已推进，并存储总结到事件本身（晨报事件不在 calendarEvents 中，跳过）
    if (!isMorning) {
      calEvt.advanced = true;
      calEvt.summary = summary;
    }
    // 标记新会话边界（下次聊天画时间戳分隔线；聊天本身不生成新快照）
    state.data.pendingSessionBreak = true;
    // 共用备份当前快照（在覆盖前捕获）：本月首次保存关键事件时记录一次，之后不覆盖
    // 刷新晨报/日历时，若被刷新的线本月有已保存事件，则回退到此备份
    if (!state.data.storyStateBeforeMonthEvents) {
      state.data.storyStateBeforeMonthEvents = state.data.storyState || '';
    }
    // 应用合并调用返回的快照B
    if (snapshot) {
      state.data.storyState = snapshot;
      // 记录快照来源元信息（生成月份/事件/时间），便于排查快照失真问题
      state.data.storyStateMeta = {
        month: state.data.calendarMonth || '',
        eventTitle: calEvt.title || state.activeCalendarEvent,
        generatedAt: Date.now(),
        note: ''
      };
      console.log('[快照] 已更新 | 事件:%s | 月:%s | 快照:%d字', calEvt.title, state.data.calendarMonth, snapshot.length);
    }

    // 将总结添加到记忆卡片
    state.data.calendarTimelineCards.push({
      id: 'mc_' + Date.now(),
      content: summary,
      timestamp: Date.now(),
      isMorningSummary: isMorning || false
    });

    saveToStorage();
    state.isLoading = false;
    state.calendarLoading = false;
    state.eventState = 'readonly';

    // 渲染带总结的事件视图，保存按钮隐藏，用返回按钮退出
    updateActiveEventHeaderButtons();
    renderActiveEventView();
    showToast('已保存事件总结');
  } catch (err) {
    console.error('事件总结生成失败:', err);
    state.isLoading = false;
    state.calendarLoading = false;
    // 失败时保留事件视图：已投递愿望回到 active（可继续投递），仅有前置铺垫回到 idle
    state.eventState = chainEvents.some(e => !e.isPrequel && !e.isSummary) ? 'active' : 'idle';
    renderActiveEventView();
    showToast('总结生成失败：' + (err.message || '请重试'));
  }
}

async function doAdvanceToNextMonth() {
  if (state.isLoading && !state.calendarLoading) { showToast('正在生成中，请稍后再试'); return; }
  state.isLoading = true;
  state.calendarLoading = true;
  state.eventState = 'generating';
  state.activeCalendarEvent = null;
  state.calendarTimelineArchiveMode = false;
  updateCalendarPageHeaderButtons();

  const refreshBtn = document.getElementById('calendar-page-refresh-btn');
  if (refreshBtn) refreshBtn.classList.add('loading');

  const container = document.getElementById('calendar-page-cards');
  if (container) container.innerHTML = `<div class="calendar-loading" style="padding:60px 0;">推进至下一月<span class="dots"><span></span><span></span><span></span></span></div>`;

  const calContainer = document.getElementById('calendar-content');
  if (calContainer) calContainer.innerHTML = `<div class="calendar-loading" style="padding:60px 0;">推进至下一月<span class="dots"><span></span><span></span><span></span></span></div>`;

  try {
    // 1. 归档当前月数据（纯存储，使用上月快照A，不调用API）
    const currentMonth = state.data.calendarMonth || '第1年1月';
    const currentCards = state.data.calendarTimelineCards || [];

    // 日历页归档：时间轴事件 + 记忆卡片 + 事件链历史（含晨报关键事件链）
    const morningEventIds = state.data.eventHistory
      .filter(e => typeof e.calendarEventId === 'string' && e.calendarEventId.startsWith('morning_'))
      .map(e => e.calendarEventId);
    const allEventIds = [...state.data.calendarEvents.map(e => e.id), ...new Set(morningEventIds)];
    const hasMorningContent = morningEventIds.length > 0;
    if (state.data.calendarEvents.length > 0 || currentCards.length > 0 || hasMorningContent) {
      const currentEventIds = state.data.calendarEvents.map(e => e.id);
      const archivedEventHistory = state.data.eventHistory.filter(
        e => currentEventIds.includes(e.calendarEventId) || (typeof e.calendarEventId === 'string' && e.calendarEventId.startsWith('morning_'))
      );
      state.data.calendarTimelineArchives.push({
        id: 'ma_' + Date.now(),
        month: currentMonth,
        events: JSON.parse(JSON.stringify(state.data.calendarEvents)),
        cards: JSON.parse(JSON.stringify(currentCards)),
        eventHistory: JSON.parse(JSON.stringify(archivedEventHistory))
      });
    }

    // 晨报页归档：晨报 + 日历内容
    if (state.data.calendarMonthReport || (state.data.calendarMemos && state.data.calendarMemos.length) || (state.data.calendarNotifications && state.data.calendarNotifications.length)) {
      state.data.calendarArchives.push({
        id: 'ca_' + Date.now(),
        month: currentMonth,
        monthReport: state.data.calendarMonthReport || '',
        memos: JSON.parse(JSON.stringify(state.data.calendarMemos || [])),
        notifications: JSON.parse(JSON.stringify(state.data.calendarNotifications || [])),
        menu: JSON.parse(JSON.stringify(state.data.calendarMenu || [])),
        social: JSON.parse(JSON.stringify(state.data.calendarSocial || [])),
        connections: JSON.parse(JSON.stringify(state.data.calendarConnections || [])),
        dailyNews: JSON.parse(JSON.stringify(state.data.calendarDailyNews || []))
      });
    }

    // 2. 设置新月份（上月窗口起点=刚结束月的起点，晨报/日历生成时据此取上月全部对话）
    const nextMonth = incrementGameMonth(currentMonth);
    const oldMonth = state.data.calendarMonth;
    const oldStartedAt = state.data.calendarMonthStartedAt;
    const oldPrevStartedAt = state.data.calendarPrevMonthStartedAt || 0;
    state.data.calendarMonth = nextMonth;
    state.data.calendarPrevMonthStartedAt = oldStartedAt;
    state.data.calendarMonthStartedAt = Date.now();

    // 3. 生成新月份晨报（使用上月快照A + 归档上下文，失败不中断）
    try {
      await _generateCalendarContent(nextMonth);
    } catch(e) {
      console.error('[至下一月] 晨报内容生成失败，用户可手动刷新:', e);
      showToast('月份已推进，晨报内容生成失败，请点击刷新按钮重试');
    }

    // 4. 生成新月份时间轴事件（使用上月快照A + 归档上下文）
    let events = [];
    try {
      const eventsCtx = buildPrevMonthChatContext() + buildRecentEventTitlesContext();
      const eventsRaw = await callAI(`请生成${nextMonth}的时间轴事件。所有日期须使用"${nextMonth}"中的年份和月份，格式为"第X年X月X日"。${eventsCtx}`, 'calendarEvents');
      const lines = eventsRaw.trim().split('\n').filter(l => l.trim());
      lines.forEach((line, i) => {
        const parts = line.split('|||').map(s => s.trim());
        if (parts.length >= 3) {
          const _t = normEventType(parts[3]);
          events.push({
            id: 'cal_' + Date.now() + '_' + i,
            date: parts[0],
            title: parts[1],
            desc: parts[2],
            isKey: _t === 'key',
            type: _t,
            advanced: false
          });
        }
      });
    } catch(e) {
      console.error('[至下一月] 时间轴事件生成失败，回滚月份:', e);
      state.data.calendarMonth = oldMonth;
      state.data.calendarMonthStartedAt = oldStartedAt;
      state.data.calendarPrevMonthStartedAt = oldPrevStartedAt;
      saveToStorage();
      showToast('时间轴事件生成失败，已恢复，请重试');
      return;
    }

    // 5. 替换当月数据（事件生成成功）
    state.data.calendarEvents = events;
    state.data.calendarMonthReport = '';
    state.data.calendarTimelineCards = [];
    state.data.eventHistory = [];
    // 新月份重置共用快照备份（本月归档内容视作已发生，不回退；新月首次保存时重新备份）
    state.data.storyStateBeforeMonthEvents = '';

    // 注：不在此处生成快照（快照仅在保存关键事件时生成）；过月剧情有新进展，挂起会话分隔信号
    state.data.pendingSessionBreak = true;

    saveToStorage();
    showToast('已推进至' + nextMonth);
  } catch(e) {
    showToast('生成失败：' + (e.message || '未知错误'));
  } finally {
    state.isLoading = false;
    state.calendarLoading = false;
    state.eventState = 'idle';
    const refreshBtn2 = document.getElementById('calendar-page-refresh-btn');
    if (refreshBtn2) refreshBtn2.classList.remove('loading');
    renderCalendarPage();
    renderCalendar();
  }
}

// 游戏月份递增：解析"第x年y月"→"第x年(y+1)月"，y=12时进位
function incrementGameMonth(monthStr) {
  const m = monthStr.match(/第(\d+)年(\d+)月/);
  if (!m) return '第1年1月';
  let year = parseInt(m[1]);
  let month = parseInt(m[2]);
  month++;
  if (month > 12) { month = 1; year++; }
  return `第${year}年${month}月`;
}

// 刷新当月时间轴事件（1次API，不推进月份，不生成快照）
async function refreshCalendarEvents() {
  if (state.isLoading) { showToast('正在生成中，请稍后再试'); return; }
  // 事件视图或归档视图下不刷新
  if (state.activeCalendarEvent || state.calendarTimelineArchiveMode || state.viewingCalendarTimelineArchiveMonth) {
    showToast('请先退出当前视图再刷新');
    return;
  }

  const refreshBtn = document.getElementById('calendar-page-refresh-btn');
  if (refreshBtn) refreshBtn.classList.add('loading');
  state.isLoading = true;
  state.calendarLoading = true;

  const container = document.getElementById('calendar-page-cards');
  if (container) container.innerHTML = `<div class="calendar-loading" style="padding:60px 0;">刷新时间轴事件<span class="dots"><span></span><span></span><span></span></span></div>`;

  const currentMonth = state.data.calendarMonth || '第1年1月';

  try {
    const eventsCtx = buildPrevMonthChatContext() + buildRecentEventTitlesContext();
    const eventsRaw = await callAI(`请生成${currentMonth}的时间轴事件。所有日期须使用"${currentMonth}"中的年份和月份，格式为"第X年X月X日"。${eventsCtx}`, 'calendarEvents');
    const lines = eventsRaw.trim().split('\n').filter(l => l.trim());
    const events = [];
    lines.forEach((line, i) => {
      const parts = line.split('|||').map(s => s.trim());
      if (parts.length >= 3) {
        const _t = normEventType(parts[3]);
        events.push({
          id: 'cal_' + Date.now() + '_' + i,
          date: parts[0],
          title: parts[1],
          desc: parts[2],
          isKey: _t === 'key',
          type: _t,
          advanced: false
        });
      }
    });

    if (events.length === 0) {
      showToast('事件生成失败，请重试');
      return;
    }

    // 记录日历线本月是否有已保存的关键事件（须在替换事件前检测，新事件对象不含 advanced）
    const hadCalendarSaves = (state.data.calendarEvents || []).some(e => e.advanced);
    // 替换事件 + 仅清零日历线内容（晨报事件链与晨报总结卡片保留）
    state.data.calendarEvents = events;  // 全新事件对象，advanced/summary 自然重置
    state.data.calendarTimelineCards = (state.data.calendarTimelineCards || []).filter(c => c.isMorningSummary);
    state.data.eventHistory = state.data.eventHistory.filter(
      e => typeof e.calendarEventId === 'string' && e.calendarEventId.startsWith('morning_')
    );
    // 日历线有已保存的关键事件 → 回退快照到共用备份（本月首次保存前），并清空备份；否则快照不动
    if (hadCalendarSaves && state.data.storyStateBeforeMonthEvents) {
      state.data.storyState = state.data.storyStateBeforeMonthEvents;
      state.data.pendingSessionBreak = false;
      state.data.storyStateBeforeMonthEvents = '';
      // 记录回退后的快照元信息
      state.data.storyStateMeta = { month: state.data.calendarMonth || '', eventTitle: '', generatedAt: Date.now(), note: '已回退（刷新日历撤销本月已保存事件）' };
    }
    saveToStorage();
    showToast('时间轴事件已刷新');
  } catch(e) {
    console.error('[刷新事件] 生成失败:', e);
    showToast('刷新失败：' + (e.message || '未知错误'));
  } finally {
    state.isLoading = false;
    state.calendarLoading = false;
    if (refreshBtn) refreshBtn.classList.remove('loading');
    renderCalendarPage();
  }
}

function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showToast('请选择图片文件');
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    showToast('图片不能超过5MB');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    // Compress avatar via canvas to keep localStorage small
    // Use PNG (lossless) at 400px for retina sharpness — ~50-150KB typically
    const img = new Image();
    img.onload = function() {
      const maxDim = 400;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      // 压缩为有损格式：WebP > JPEG > PNG 兜底。
      // 之前用无损 PNG，照片类头像常达 100-300KB base64，
      // 头像会被存进每条消息渲染与每次自动保存的序列化里，体积直接放大卡顿感。
      // WebP/JPEG 0.85 通常只有 20-60KB，画质在 400px 头像尺寸下无肉眼差异。
      let compressed = canvas.toDataURL('image/webp', 0.85);
      if (!compressed.startsWith('data:image/webp')) {
        compressed = canvas.toDataURL('image/jpeg', 0.85);
        if (!compressed.startsWith('data:image/jpeg')) compressed = canvas.toDataURL('image/png');
      }
      const frame = document.querySelector('.avatar-frame');
      if (frame) {
        frame.innerHTML = `<img src="${compressed}" alt="头像"><div class="avatar-frame-hint">更换头像</div>`;
      }
      // Only update a temporary preview variable; commit to state.data on saveCharacter()
      if (editorCharType) {
        editorPendingAvatar = compressed;
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function saveCharacter(type) {
  // 读取表单字段
  const fields = {
    name: document.getElementById('char-name').value.trim(),
    gender: document.getElementById('char-gender').value.trim(),
    age: document.getElementById('char-age').value.trim(),
    identity: document.getElementById('char-identity').value.trim(),
    oneLiner: document.getElementById('char-oneliner').value.trim(),
    appearance: document.getElementById('char-appearance').value.trim(),
    personality: document.getElementById('char-personality').value.trim(),
    background: document.getElementById('char-background').value.trim(),
    other: document.getElementById('char-other').value.trim()
  };
  if (editorPendingAvatar !== null) fields.avatar = editorPendingAvatar;

  if (type === 'me') {
    const c = state.data.characters.me;
    c.name = fields.name || c.name;
    c.gender = fields.gender; c.age = fields.age; c.identity = fields.identity;
    c.oneLiner = fields.oneLiner; c.appearance = fields.appearance;
    c.personality = fields.personality; c.background = fields.background; c.other = fields.other;
    if (fields.avatar !== undefined) c.avatar = fields.avatar;
  } else if (type === 'npc' || type === 'other') {
    // 'other' 类型经 openCharacterEditor 已重定向为编辑激活NPC（editorNpcId 已设）
    if (editorNpcId) {
      // 编辑已有NPC
      const npc = state.data.characters.npcs.find(n => n.id === editorNpcId);
      if (npc) {
        npc.name = fields.name || npc.name;
        npc.gender = fields.gender; npc.age = fields.age; npc.identity = fields.identity;
        npc.oneLiner = fields.oneLiner; npc.appearance = fields.appearance;
        npc.personality = fields.personality; npc.background = fields.background; npc.other = fields.other;
        if (fields.avatar !== undefined) npc.avatar = fields.avatar;
        npc.starred = editorNpcStarred;
      }
    } else {
      // 新增NPC
      if (!fields.name) {
        showToast('请填写姓名');
        return;
      }
      const newId = 'npc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      const npc = Object.assign({ id: newId }, fields);
      state.data.characters.npcs.push(npc);
      // 若当前没有激活NPC，自动激活新建的
      if (!state.data.activeNpcId) {
        state.data.activeNpcId = newId;
        state.data.chatHistory = [];
      }
    }
  }

  editorPendingAvatar = null;
  editorNpcId = null;
  saveToStorage();
  closeModal();
  applyChatAvatarVars();
  renderSettings();
  if (state.currentTab === 'chat') renderChat();
  renderNavCharList();
  showToast('人设已保存');
}
