// 新增角色：选择剧本模板（弹窗版剧本列表）
// 从剧本同步构建并注册一个新角色档案（不切界面、不弹加载页）
// 返回新档案 id；scriptId 无效时返回 null
// opts.silent：不切换激活角色（用于初始化补齐默认角色时保留用户当前进度）
function registerProfileFromScript(scriptId, opts) {
  const script = SCRIPTS.find(s => s.id === scriptId);
  if (!script) return null;
  const silent = opts && opts.silent;
  const now = Date.now();
  const id = 'p_' + now + '_' + Math.random().toString(36).slice(2, 8);
  const data = deepMerge(structuredClone(DEFAULT_DATA), structuredClone(script.data));
  // 全局配置（API/全局规则）沿用到新角色
  applyProfileGlobals(data);
  // Fix timestamps: replace 0 with current time for pre-set messages/events
  const sessionForPreset = state.chatSessionId;
  if (data.chatHistory) {
    data.chatHistory.forEach((msg, i) => {
      if (!msg.timestamp) msg.timestamp = now - (data.chatHistory.length - i) * 60000;
      if (msg.sessionId === 0) msg.sessionId = sessionForPreset;
    });
  }
  if (data.eventHistory) {
    data.eventHistory.forEach(evt => {
      if (!evt.timestamp) evt.timestamp = now;
    });
  }
  // 注册新角色（排在列表最前；silent 模式不改变当前激活角色）
  profiles.order.unshift(id);
  if (!silent) profiles.activeId = id;
  profiles.data[id] = data;
  // 剧本名称/头像与角色名/角色头像独立，新建时留空，由编辑入口(openEditProfileName)自定义。
  // 显示时由 renderNavCharList 兜底为「未命名世界」。
  profiles.meta[id] = {
    name: '',
    avatar: '',
    scriptId: scriptId,
    createdAt: now,
    updatedAt: now
  };
  // 直接写入 localStorage，不经过 saveToStorage()（后者会用 state.data 覆盖刚创建的角色）
  try {
    localStorage.setItem(SOUL_KEY, JSON.stringify(profiles));
  } catch(e) { console.error('角色档案保存失败', e); }
  return id;
}

// 新增角色：直接弹确认弹窗
function confirmCreateProfile() {
  closeNav();
  const script = SCRIPTS.find(s => s.id === 'custom');
  if (!script) return;
  // 生成中禁止新建，防止进行中的回复写入错误角色
  if (state.isLoading) { showToast('正在生成中，请稍后再试'); return; }
  // 排版参考截图：标题 → 描述 → 确认问题 → 双按钮，弱字号层级、居中
  showModal(`
    <div class="modal">
      <div class="modal-body" style="padding:30px 24px 20px;">
        <div class="modal-confirm-title">新增世界</div>
        <div class="modal-confirm-desc">所有设定由你亲手书写，<br>从零开始开辟你的世界。</div>
        <div class="modal-confirm-q">确定创建此世界吗？</div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="createProfileFromScript('custom')">确认新增</button>
      </div>
    </div>
  `);
}

// 从剧本创建一个新角色档案（确认后调用：加载页 → 注册 → 进入聊天）
function createProfileFromScript(scriptId) {
  const script = SCRIPTS.find(s => s.id === scriptId);
  if (!script) return;
  // 生成中禁止新建，防止进行中的回复写入错误角色
  if (state.isLoading) { showToast('正在生成中，请稍后再试'); return; }
  closeModal();
  closeNav();
  // 当前进度先落盘
  if (state.data) saveToStorage();
  // Show world loading screen
  document.getElementById('global-rules-screen').style.display = 'none';
  document.getElementById('api-config-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'none';
  const loadScreen = document.getElementById('world-loading-screen');
  // Reset progress bar animation
  const barFill = loadScreen.querySelector('.world-loading-bar-fill');
  barFill.style.animation = 'none';
  loadScreen.style.display = 'flex';
  // Force reflow then restart animation
  void barFill.offsetWidth;
  barFill.style.animation = '';
  // After ~2.5s, enter game
  setTimeout(() => {
    const id = registerProfileFromScript(scriptId);
    if (!id) { loadScreen.style.display = 'none'; return; }
    state.data = profiles.data[id];
    resetRuntimeState();
    saveToStorage();
    applyBgImage();
    // Enter game
    loadScreen.style.display = 'none';
    enterChatMain();
    showToast('已开始「' + script.name + '」');
  }, 2500);
}

// 重置运行时状态（切换角色/读档/新开一局共用）
function resetRuntimeState() {
  state.eventState = 'idle';
  state.currentChainId = null;
  state.quoteContext = null;
  state.isLoading = false;
  state.calendarLoading = false;
  state.chatLoading = false;
  state.isTyping = false;
  state.rulesExpanded = true;
  state.chatSessionId++;
  state.chatSessionStartTime = 0;
  state.chatView = 'list';        // 进入游戏默认显示NPC好友列表
  state.activeCalendarEvent = null;
  // 归档视图状态重置，防止跨角色泄漏
  state.calendarTimelineArchiveMode = false;
  state.viewingCalendarTimelineArchiveMonth = null;
  state.archiveEventChain = null;
  state.calendarArchiveMode = false;
  state.viewingCalendarArchiveMonth = null;
  const quoteBar = document.getElementById('quote-bar');
  if (quoteBar) quoteBar.style.display = 'none';
}

// 进入聊天主界面：渲染全部页签并定位到聊天
function enterChatMain() {
  document.getElementById('global-rules-screen').style.display = 'none';
  document.getElementById('api-config-screen').style.display = 'none';
  document.getElementById('world-loading-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'flex';
  // Force re-render all tabs with fresh data
  state.currentTab = '';
  renderChat();
  renderCalendar();
  renderCalendarPage();
  renderSettings();
  updateCalendarPageHeaderButtons();
  // Now switch to chat
  state.currentTab = 'chat';
  document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
  document.getElementById('tab-chat').style.display = 'flex';
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === 'chat');
  });
  updateChatHeaderTitle();
  renderNavCharList();
  // 三个界面全部滚动到最底部
  scrollAllToBottom();
}

// 聊天页标题：列表视图=游戏名，对话视图=当前NPC名
function updateChatHeaderTitle() {
  const el = document.getElementById('chat-title');
  if (!el) return;
  // 群聊模式：显示群名
  if (state.chatView === 'group' && state.data && state.data.activeGroupId) {
    const grp = state.data.groupChats.find(g => g.id === state.data.activeGroupId);
    el.textContent = (grp && grp.name) || '群聊';
    return;
  }
  if (state.chatView === 'list' || !state.data || !state.data.activeNpcId) {
    el.textContent = (profiles && profiles.activeId) ? profileDisplayName(profiles.activeId) : '聊天';
  } else {
    const name = getActiveNpc().name;
    el.textContent = name || '聊天';
  }
}

/* ========== 角色导航抽屉 ========== */
function openNav() {
  renderNavCharList();
  document.getElementById('nav-overlay').classList.add('open');
}

function closeNav() {
  document.getElementById('nav-overlay').classList.remove('open');
}

// 导航角色列表：带变更守卫 —— 名字/头像/顺序/激活项没变时跳过重建（saveToStorage 高频调用）
let _navListSig = '';
function renderNavCharList() {
  const listEl = document.getElementById('nav-char-list');
  if (!listEl || !profiles) return;
  if (!profiles.order.length) {
    if (_navListSig !== 'empty') {
      _navListSig = 'empty';
      listEl.innerHTML = '<div class="nav-char-empty">还没有剧本<br>点击下方「新增世界」开始</div>';
    }
    return;
  }
  const sig = profiles.order.join('|') + '::' + profiles.activeId + '::' +
    profiles.order.map(id => {
      const m = profiles.meta[id] || {};
      return (m.name || '') + '#' + (m.avatar || '');
    }).join('|');
  if (sig === _navListSig) return;  // 无变化，跳过 DOM 重建
  _navListSig = sig;
  let html = '';
  profiles.order.forEach(id => {
    const m = profiles.meta[id] || {};
    const name = m.name || '未命名世界';
    const active = id === profiles.activeId;
    const avatarStyle = m.avatar ? ` style="background-image:url('${m.avatar}');background-size:cover;background-position:center"` : '';
    const avatarInner = m.avatar ? '' : escapeHtml(getAvatarChar(name, '剧'));
    html += `
      <div class="nav-char-item${active ? ' active' : ''}" onclick="switchProfile('${id}')">
        <div class="nav-char-avatar"${avatarStyle}>${avatarInner}</div>
        <div class="nav-char-name">${escapeHtml(name)}</div>
        <button class="nav-char-edit" title="编辑名称" onclick="event.stopPropagation();openEditProfileName('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="nav-char-del" title="删除世界" onclick="event.stopPropagation();confirmDeleteProfile('${id}')">×</button>
      </div>
    `;
  });
  listEl.innerHTML = html;
}

// 切换角色：当前进度自动保存，目标角色进度原样恢复
function switchProfile(id) {
  if (!profiles.data[id]) return;
  if (id === profiles.activeId) { closeNav(); return; }
  if (state.isLoading) { showToast('正在生成中，请稍后再切换'); return; }
  // 保存当前剧本进度
  if (state.data && profiles.activeId) saveToStorage();
  profiles.activeId = id;
  loadProfileIntoState(id);
  resetRuntimeState();
  saveToStorage();
  applyBgImage();
  closeNav();
  enterChatMain();
  showToast('已切换至「' + profileDisplayName(id) + '」');
}

// 编辑剧本名称（与角色名称无关，仅修改剧本显示名）
function openEditProfileName(id) {
  if (!profiles.meta[id]) return;
  const currentName = profiles.meta[id].name || '';
  showModal(`
    <div class="modal">
      <div class="modal-header">编辑剧本名称</div>
      <div class="modal-body">
        <input type="text" id="edit-profile-name-input" class="form-input" placeholder="输入剧本名称" value="${escapeHtml(currentName)}" maxlength="20" />
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="saveEditProfileName('${id}')">保存</button>
      </div>
    </div>
  `);
  setTimeout(() => {
    const input = document.getElementById('edit-profile-name-input');
    if (input) { input.focus(); input.select(); }
  }, 100);
}

function saveEditProfileName(id) {
  const input = document.getElementById('edit-profile-name-input');
  if (!input) return;
  const newName = input.value.trim();
  if (!newName) { showToast('名称不能为空'); return; }
  profiles.meta[id].name = newName;
  saveToStorage();
  closeModal();
  renderNavCharList();
  // 如果编辑的是当前剧本，同步更新聊天页标题
  if (id === profiles.activeId) {
    const titleEl = document.getElementById('chat-title');
    if (titleEl) titleEl.textContent = newName;
  }
  showToast('已修改剧本名称');
}

function confirmDeleteProfile(id) {
  // 删除当前角色时，生成中禁止操作（防止进行中的回复写入错误角色）
  if (id === profiles.activeId && state.isLoading) {
    showToast('正在生成中，请稍后再试');
    return;
  }
  const name = profileDisplayName(id);
  showModal(`
    <div class="modal">
      <div class="modal-header">删除世界</div>
      <div class="modal-body" style="text-align:center;color:var(--text-dim);font-size:13px;line-height:1.8;">
        确定删除「${escapeHtml(name)}」吗？<br>该世界的全部聊天记录与进度将一并删除，不可撤销。
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" style="color:var(--danger);" onclick="deleteProfile('${id}')">确认删除</button>
      </div>
    </div>
  `);
}

function deleteProfile(id) {
  delete profiles.data[id];
  delete profiles.meta[id];
  profiles.order = profiles.order.filter(x => x !== id);
  const wasActive = profiles.activeId === id;
  if (wasActive) {
    if (profiles.order.length) {
      // 还有其他角色：激活下一个
      profiles.activeId = profiles.order[0];
      loadProfileIntoState(profiles.activeId);
    } else {
      // 全部删光：回到空状态
      profiles.activeId = null;
      state.data = structuredClone(DEFAULT_DATA);
      applyGlobalsToState();
    }
    resetRuntimeState();
  }
  saveToStorage();
  applyBgImage();
  closeModal();
  renderNavCharList();
  if (profiles.activeId || wasActive) enterChatMain();
  if (!profiles.order.length) {
    // 全部删光：回到空状态，等待用户新建
    showToast('已删除世界');
  } else {
    showToast('已删除世界');
  }
}

/* ========== 右滑呼出角色抽屉 ========== */
function setupSwipeNav() {
  let sx = 0, sy = 0, st = 0, tracking = false;
  document.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1) { tracking = false; return; }
    const t = e.touches[0];
    tracking = true; sx = t.clientX; sy = t.clientY; st = Date.now();
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    if (!t) return;
    const dx = t.clientX - sx, dy = t.clientY - sy, dt = Date.now() - st;
    // 忽略慢速滑动与纵向为主的滑动
    if (dt > 700) return;
    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
    // 弹窗打开时不响应
    if (document.getElementById('modal-overlay').classList.contains('active')) return;
    const navEl = document.getElementById('nav-overlay');
    if (navEl.classList.contains('open')) {
      // 抽屉打开时左滑关闭
      if (dx < 0) closeNav();
      return;
    }
    const gameVisible = document.getElementById('game-screen').style.display !== 'none';
    const rulesVisible = document.getElementById('global-rules-screen').style.display !== 'none';
    const apiVisible = document.getElementById('api-config-screen').style.display !== 'none';
    // 从屏幕左缘右滑 → 打开角色抽屉（聊天 / 全局设定 / API配置 页均可）
    if (dx > 0 && sx < 70 && (gameVisible || rulesVisible || apiVisible)) openNav();
  }, { passive: true });
}

function switchTab(tab) {
  // Close any open modal
  closeModal();
  // Dismiss keyboard on tab switch
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }

  if (state.currentTab === tab) return;

  // 生成中：聊天页正常渲染（不影响聊天），日历页只切换可见性（保留加载状态）
  if (state.calendarLoading && tab !== 'chat') {
    const target = document.getElementById('tab-' + tab);
    target.style.display = 'flex';
    document.querySelectorAll('.tab-content').forEach(el => {
      if (el !== target) el.style.display = 'none';
    });
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    state.currentTab = tab;
    return;
  }

  // Render target content BEFORE showing it (prevents flash during DOM rebuild)
  if (tab === 'chat') {
    renderNavCharList();
    renderChat();
  } else if (tab === 'calendar') {
    if (state._jumpingToArchive) {
      // 从日历页跳转过来：直接进入目标月份的晨报归档，不做常规重置
      state.viewingCalendarArchiveMonth = state._jumpingToArchive;
      state.calendarArchiveMode = false;
    } else {
      state.calendarArchiveMode = false;
      state.viewingCalendarArchiveMonth = null;
    }
    updateCalendarHeaderButtons();
    renderCalendar();
  } else if (tab === 'memory') {
    if (state._jumpingToArchive) {
      // 从晨报页跳转过来：直接进入目标月份的日历归档，不做常规重置
      state.viewingCalendarTimelineArchiveMonth = state._jumpingToArchive;
      state.calendarTimelineArchiveMode = false;
    } else {
      state.calendarTimelineArchiveMode = false;
      state.viewingCalendarTimelineArchiveMonth = null;
    }
    updateCalendarPageHeaderButtons();
    renderCalendarPage();
    renderCalendar();
  } else if (tab === 'settings') {
    renderSettings();
  }

  // Now switch visibility — target is already rendered, so no flash
  state.currentTab = tab;
  const target = document.getElementById('tab-' + tab);
  target.style.display = 'flex';
  document.querySelectorAll('.tab-content').forEach(el => {
    if (el !== target) el.style.display = 'none';
  });
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
}

/* ========== 工具函数 ========== */
function showToast(msg, duration) {
  duration = duration || 2500;
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('out');
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

// 保存弹窗打开前的滚动位置，关闭时恢复（防止 focusout 处理器把页面滚到底部）
let _modalScrollSave = null;

function showModal(html) {
  // 保存当前可见滚动容器的滚动位置
  _modalScrollSave = {};
  const chat = document.getElementById('chat-messages');
  if (chat && chat.offsetParent !== null) _modalScrollSave.chat = chat.scrollTop;
  const calendar = document.getElementById('calendar-content');
  if (calendar && calendar.offsetParent !== null) _modalScrollSave.calendar = calendar.scrollTop;
  const mem = document.getElementById('calendar-page-cards');
  if (mem && mem.offsetParent !== null) _modalScrollSave.calendarPage = mem.scrollTop;
  const overlay = document.getElementById('modal-overlay');
  overlay.innerHTML = html;
  overlay.classList.add('active');
}

function closeModal() {
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.remove('active');
  overlay.innerHTML = '';
  // 恢复弹窗前的滚动位置（延迟以覆盖 focusout 处理器的异步滚动）
  if (_modalScrollSave) {
    const saved = _modalScrollSave;
    _modalScrollSave = null;
    setTimeout(function() {
      if (saved.chat != null) {
        const chat = document.getElementById('chat-messages');
        if (chat) chat.scrollTop = saved.chat;
      }
      if (saved.calendar != null) {
        const calendar = document.getElementById('calendar-content');
        if (calendar) calendar.scrollTop = saved.calendar;
      }
      if (saved.calendarPage != null) {
        const mem = document.getElementById('calendar-page-cards');
        if (mem) mem.scrollTop = saved.calendarPage;
      }
    }, 250);
  }
}

// ========== 全屏模式 ==========
// 全屏功能已按需求移除（原入口在「设定」页，现已删除）
// 浏览器自带的全屏操作（如系统菜单）仍可用，键盘高度处理逻辑保留兼容

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function truncateText(text, maxLen) {
  if (!text) return '';
  let t = text.replace(/\s+/g, ' ');
  if (t.length > maxLen) t = t.slice(0, maxLen) + '…';
  return t;
}

// Format narrative text: paragraph breaks + 「」italic (thoughts) + ""bold (dialogue)
function formatNarrativeText(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  // Paragraph breaks: \n → <p> tags (段落独立分段，间距由CSS控制)
  const lines = html.split(/\r?\n/);
  html = lines.map(line => `<p>${line}</p>`).join('');
  // 「...」 → italic, keep the brackets (心理活动)
  html = html.replace(/「([^」]*)」/g, '<i>「$1」</i>');
  // "..." (Chinese curly quotes U+201C U+201D) → bold, keep the quotes (对话引用)
  html = html.replace(/\u201C([^\u201D]*)\u201D/g, '<b>\u201C$1\u201D</b>');
  // Straight quotes "...": escapeHtml does NOT convert " in text content,
  // so match the raw " character directly
  html = html.replace(/"([^"]*?)"/g, '<b>"$1"</b>');
  return html;
}

function getAvatarChar(name, fallback) {
  if (name && name.length > 0) return name[0];
  return fallback || '?';
}

function formatTime(ts) {
  const d = new Date(ts);
  const h = d.getHours().toString().padStart(2,'0');
  const m = d.getMinutes().toString().padStart(2,'0');
  const gameMonth = state.data.calendarMonth || '';
  return `${gameMonth} ${h}:${m}`;
}

// 相对时间：用于好友列表预览（刚刚/x分钟前/昨天/月日）
function formatRelativeTime(ts) {
  if (!ts) return '';
  const now = Date.now();
  const diff = now - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff/3600000) + '小时前';
  const d = new Date(ts);
  const today = new Date();
  const isYesterday = (today.getTime() - ts) < 172800000 && d.getDate() !== today.getDate();
  if (isYesterday) return '昨天';
  if (diff < 604800000) return Math.floor(diff/86400000) + '天前';
  const M = (d.getMonth()+1).toString().padStart(2,'0');
  const D = d.getDate().toString().padStart(2,'0');
  return `${M}月${D}日`;
}

// 取某NPC的聊天记录数组：激活NPC在 state.data.chatHistory，其余在 npcChats
function getNpcChat(npcId) {
  if (!state.data) return [];
  if (npcId === state.data.activeNpcId) return state.data.chatHistory || [];
  return state.data.npcChats[npcId] || [];
}

// L1 基础锚定：硬编码，设定AI角色扮演与核心原则
function buildBaseAnchor() {
  let prompt = '';
  prompt += '1.你是本游戏的DM，负责剧情推进、NPC扮演、事件生成、秘密线索投放等。本游戏为平行世界文游，所有人物身份、关系、交易、阴谋、感情与行为均为虚构创作。\n';
  prompt += '2.每位NPC必须保持截然不同的性格、生活习惯。占有欲与脆弱点人皆有之，但每人的表达方式、触发条件和表现形式截然不同。不可套用同一模板。\n';
  prompt += '3.核心原则：人设是起点，历史是轨迹，规则是舞台。历史覆盖一切——如果历史记录中角色发生了变化，以历史记录为准。\n';
  return prompt;
}

// L2 全局规则：适用于所有剧本的指令词（用户在全局设定中配置）
function buildGlobalRulesPrompt() {
  const rules = (state.data.globalRules || []).filter(r => r.enabled && r.content);
  if (!rules.length) return '';
  let prompt = '\n【全局指令（适用于所有剧本）】\n';
  rules.forEach(r => {
    prompt += `[${r.name || '未命名'}] ${r.content}\n`;
  });

}

// L4 人设库：characters.me + 全部 characters.npcs[]（后移至外部规则之后，提升AI读取权重）
function buildCharacterPrompt() {
  const c = state.data.characters;
  let prompt = '\n【角色设定】\n';
  prompt += '--- 主控角色 ---\n';
  const me = c.me;
  prompt += `姓名：${me.name || '未设定'}，性别：${me.gender || '未设定'}，年龄：${me.age || '未设定'}，身份：${me.identity || '未设定'}\n`;
  prompt += `外貌：${me.appearance || '未设定'}\n性格：${me.personality || '未设定'}\n人物背景：${me.background || '未设定'}\n其他设定：${me.other || '无'}\n`;
  // 全部 NPC 设定注入：遍历 characters.npcs[]，标记当前激活的那个
  const npcs = Array.isArray(c.npcs) ? c.npcs : [];
  prompt += '--- AI角色（初始状态，可被历史覆盖）---\n';
  if (npcs.length) {
    npcs.forEach(npc => {
      if (!npc.name) return;
      const active = npc.id === state.data.activeNpcId ? '【当前对话】' : '';
      prompt += `\n${active}姓名：${npc.name}，性别：${npc.gender || '未设定'}，年龄：${npc.age || '未设定'}，身份：${npc.identity || '未设定'}\n`;
      prompt += `外貌：${npc.appearance || '未设定'}\n性格：${npc.personality || '未设定'}\n人物背景：${npc.background || '未设定'}\n其他设定：${npc.other || '无'}\n`;
    });
  }
  return prompt;
}

// L3 外部规则：rules[]（前移至人设之前，作为舞台背景铺垫）
function buildRulesPrompt() {
  if (!state.data.rules.length) return '';
  let prompt = '\n【补充设定（舞台背景）】\n';

// L5 主线剧情约束：mainStory（用户手填，注入所有NPC。后移至人设之后，更接近对话，权重更高）
function buildMainStoryPrompt() {

  if (!ms || !ms.trim()) return '';

// L9 即时上下文：最近记录
// 双向打通：聊天能看到近期剧情，剧情能看到近期聊天
function buildHistoryMessages(mode, isContinuation) {
  const MAX_PRIMARY = 10;     // 事件链主上下文上限（聚焦当前剧情段，超长链只带最近部分）
  const MAX_CHAT = 25;        // 单聊历史条数上限

  let primary = [];
  let cross = [];

  if (mode === 'chat') {
    // 聊天模式：主上下文是聊天记录
    // 正常发送：sendChatMessage 会先把用户消息 push 到 chatHistory，再调用 callAI；
    // callAI 又会把 userMessage 作为最后一条单独追加。
    // 如果最后一条是 user 消息，说明是刚 push 进去的，需要排除，否则AI会看到两条相同的消息（误判用户复读）。
    // 空发送续写：没有新消息 push，chatHistory 最后一条可能是 user（删除AI回复后）或 assistant；
    // 此时 userMessage 是系统提示而非真实用户消息，不应排除最后一条，否则会丢失真实上文。
    const chatHist = state.data.chatHistory;
    const excludeLast = !isContinuation && chatHist.length > 0 && chatHist[chatHist.length - 1].role === 'user';
    const sliceSource = excludeLast ? chatHist.slice(0, -1) : chatHist;
    primary = sliceSource.slice(-MAX_CHAT).map(h => ({
      role: h.role === 'user' ? 'user' : 'assistant',
      content: h.content || ''
    }));
    // 跨模块剧情注入：故事状态快照已在 System Prompt 中注入（L7），此处不再重复注入事件全文
    // 避免旧事件叙事干扰AI对当前时间节点的感知
  } else if (mode === 'event') {
    // 剧情模式：主上下文是剧情事件链，跨模块注入当月全部NPC对话
    primary = state.data.eventHistory.flatMap(e => [
      { role: 'user', content: `剧情愿望：${e.wish}` },
      { role: 'assistant', content: e.aiNarrative }
    ]).slice(-MAX_PRIMARY);
    const chatCtx = collectMonthlyNpcChats();
    if (chatCtx) {
      cross.push({ role: 'user', content: `【近期聊天记录（供你感知当前关系状态和约定，叙事中可自然承接）】\n${chatCtx}` });
    }
  } else if (mode === 'polish') {
    // 润色模式：注入近期剧情叙事作为上下文，确保润色文本与上文衔接
    primary = state.data.eventHistory.flatMap(e => [
      { role: 'user', content: `剧情愿望：${e.polishedWish || e.wish || ''}` },
      { role: 'assistant', content: e.aiNarrative || '' }
    ]).slice(-MAX_PRIMARY);
    const chatCtx = collectMonthlyNpcChats();
    if (chatCtx) {
      cross.push({ role: 'user', content: `【近期聊天记录（供你感知当前关系状态，勿在叙事中复述）】\n${chatCtx}` });
    }
  }

  // 顺序：跨模块上下文 → 主上下文（当前交互在最末尾，最受关注）
  return [...cross, ...primary];
}

// 羁绊板块选人：星标NPC优先随机取3；不足3位时从未标记的特殊NPC里随机补足至3
// 星标仅作用于羁绊模块，其余模块仍使用全部NPC列表
function pickConnectionNpcs() {
  const npcs = (state.data.characters.npcs || []).filter(n => n.name);
  const starred = npcs.filter(n => n.starred);
  const rest = npcs.filter(n => !n.starred);
  const shuffle = arr => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const picked = shuffle(starred).slice(0, 3);
  if (picked.length < 3) picked.push(...shuffle(rest).slice(0, 3 - picked.length));
  return picked;
}

// L8 模式指令：根据 mode 动态注入
function buildModeInstruction(mode) {
  if (mode === 'chat') {

  } else if (mode === 'event') {

// L7 故事状态快照（主状态，紧贴对话以提升权重）：注入缓存的当前故事状态

// 快照基于近几月日历事件数据（calendarTimelineArchives + 当月事件）归纳
function buildStoryStatePrompt() {
  const ss = state.data.storyState;
  if (!ss || !ss.trim()) return '';
  return '\n【当前故事状态（供你内在感知剧情进展）】\n' + ss.trim() + '\n';
}

// L6 时间线上下文（辅助层，置于快照之前）：日历时间轴与晨报三板块
// 供聊天/群聊感知具体事件细节（快照只有五维概述，细节断层在此补齐）
// 取数只用固定数据，不读记忆卡片池（那是展示给玩家的UI）：
//   日历线关键事件总结 → 保存时写回事件自身的 e.summary
//   晨报线关键事件总结 → 事件链总结记录（当月在 eventHistory，归档月在 calendarTimelineArchives[].eventHistory 的 isSummary 条目）
// 日历注入日常事件全文+关键事件总结；晨报只取备忘/通知/羁绊，备忘/通知触发过已保存事件链的附上总结记忆卡
// scope：'chat'（默认）= 近2个月归档+当月，供聊天/群聊
//        'calendar' = 仅近3个月归档、不含当月，供日历/晨报生成与刷新（当月内容即将重新生成，注入会自我循环）
function buildTimelineContextPrompt(scope) {
  const isCalendar = scope === 'calendar';
  const months = isCalendar ? 3 : 2;
  let ctx = '';

  // 单条日历事件 → 注入行（关键事件取保存时写回的总结；未保存的关键事件不剧透）
  const eventLine = (e) => {
    if (e.isKey) {
      return e.summary ? `【${e.date || ''}】${e.title}（关键）：${e.summary}` : '';
    }
    if (e.type === 'special') {
      return `【${e.date || ''}】${e.title}（特殊NPC事件）：${e.desc || ''}`;
    }
    return `【${e.date || ''}】${e.title}：${e.desc || ''}`;
  };

  const tlArchives = state.data.calendarTimelineArchives || [];

  // 1. 历史时间轴（日历线事件）
  const recentTl = tlArchives.slice(-months);
  if (recentTl.length) {
    ctx += '\n【近月时间线（已发生的事实）】\n';
    recentTl.forEach(arch => {
      const lines = [];
      (arch.events || []).forEach(e => {
        const line = eventLine(e);
        if (line) lines.push(line);
      });
      if (lines.length) ctx += `◆ ${arch.month}\n${lines.join('\n')}\n`;
    });
  }

  // 2. 当月时间轴（日历线事件；日历/晨报生成不注入当月）
  const currentMonth = state.data.calendarMonth || '当月';
  if (!isCalendar) {
    const currentEvents = state.data.calendarEvents || [];
    const hasCurrent = currentEvents.some(e => e.isKey ? e.summary : true);
    if (hasCurrent) {
      ctx += `\n【${currentMonth} 时间线（当前月份已发生的事实）】\n`;
      currentEvents.forEach(e => {
        const line = eventLine(e);
        if (line) ctx += line + '\n';
      });
    }
  }

  // 3. 晨报三板块（归档月份；对话模式另含当月）
  // 某月晨报 → 注入文本；备忘/通知触发过已保存事件链的，附上该事件的总结记忆卡（保存时生成的总结，与记忆卡片内容一致）
  const morningBlock = (month, memos, notifications, connections, history) => {
    const getChainSummary = (type, index) => {
      const evtId = `morning_${type}_${index}_${month}`;
      const s = (history || []).find(e => e.calendarEventId === evtId && e.isSummary);
      return s && s.aiNarrative ? s.aiNarrative.trim() : '';
    };
    const lines = [];
    (memos || []).forEach((m, i) => {
      if (!m) return;
      const sum = getChainSummary('memo', i);
      lines.push(sum ? `备忘：${m.trim()}（该备忘已展开为关键事件，总结记忆卡：${sum}）` : `备忘：${m}`);
    });
    (notifications || []).forEach((n, i) => {
      if (!n) return;
      const sum = getChainSummary('notif', i);
      lines.push(sum ? `通知：${n.trim()}（该通知已展开为关键事件，总结记忆卡：${sum}）` : `通知：${n}`);
    });
    (connections || []).forEach(c => {
      if (c && c.pair) lines.push(`羁绊：${c.pair}——${c.text || ''}`);
    });
    return lines.length ? `◆ ${month}\n${lines.join('\n')}\n` : '';
  };

  const calArchives = state.data.calendarArchives || [];
  const morningBlocks = calArchives.slice(-months).map(arch => {
    const archTl = tlArchives.find(a => a.month === arch.month);
    return morningBlock(arch.month, arch.memos, arch.notifications, arch.connections, (archTl && archTl.eventHistory) || []);
  });
  // 当月晨报未归档，直接读当前数据与当前事件链（仅对话模式；日历/晨报生成不含当月）
  if (!isCalendar && ((state.data.calendarMemos || []).length || (state.data.calendarNotifications || []).length || (state.data.calendarConnections || []).length)) {
    morningBlocks.push(morningBlock(currentMonth, state.data.calendarMemos, state.data.calendarNotifications, state.data.calendarConnections, state.data.eventHistory));
  }
  const morningCtx = morningBlocks.filter(Boolean).join('');
  if (morningCtx) {
    ctx += `\n【近月晨报（背景信息，自然感知即可，勿主动复述）】\n${morningCtx}`;
  }

  // 4. 更早月份：只注入记忆卡片（晨报线+日历线全部关键事件总结卡；旧归档无cards时回退到事件总结与事件链总结记录）
  // 仅日历/晨报生成注入：对话窗口近3月已带全文细节，更远的历史只需保留总结级记忆
  if (isCalendar && tlArchives.length > months) {
    const oldBlocks = [];
    tlArchives.slice(0, -months).forEach(arch => {
      const cards = [];
      ((arch.cards) || []).forEach(c => { if (c && c.content) cards.push(c.content.trim()); });
      if (!cards.length) {
        (arch.events || []).forEach(e => { if (e.isKey && e.summary) cards.push(e.summary.trim()); });
        (arch.eventHistory || []).forEach(e => { if (e.isSummary && e.aiNarrative) cards.push(e.aiNarrative.trim()); });
      }
      if (cards.length) oldBlocks.push(`◆ ${arch.month}\n${cards.map(c => '·' + c).join('\n')}\n`);
    });
    if (oldBlocks.length) {
      ctx += `\n【更早记忆卡片（3个月以前的关键事件总结）】\n${oldBlocks.join('')}`;
    }
  }

  return ctx;
}

// 完整 System Prompt 拼装：L1 → L2 → L3 → L4 → L5 → L6（时间线，辅助）→ L7（快照，主状态）→ L8（模式指令）
// 越靠后的层越接近用户消息，AI 读取权重越高（attention recency bias）
// 因此将人设、主线剧情和快照后移，让它们更接近实际对话，提升约束力；时间线为辅助层置于快照前
// L9（即时上下文）作为 history messages 单独传入，不拼入 system prompt
function buildSystemPrompt(mode) {
  let prompt = '';
  prompt += buildBaseAnchor();        // L1 基础锚定
  prompt += buildGlobalRulesPrompt(); // L2 全局规则
  prompt += buildRulesPrompt();      // L3 外部规则（舞台背景，前置铺垫）
  prompt += buildCharacterPrompt();  // L4 人设库（后移，更接近对话）
  prompt += buildMainStoryPrompt();  // L5 主线剧情约束（高权重，后移）
  if (mode === 'chat' || mode === 'event' || mode === 'polish') {
    // L6 时间线上下文（辅助层）：聊天/事件链/润色注入当月+近2个月归档，置于快照之前
    // 事件叙事可据此感知时间轴已发生事件与晨报背景，与剧情自然衔接
    prompt += buildTimelineContextPrompt();
  } else if (mode === 'calendarAll' || mode === 'calendarEvents') {
    // L6 时间线上下文（辅助层）：日历/晨报生成与刷新注入近3个月归档（不含当月）
    prompt += buildTimelineContextPrompt('calendar');
  }
  prompt += buildStoryStatePrompt(); // L7 故事状态快照（主状态，紧贴对话）
  prompt += buildModeInstruction(mode); // L8 模式指令
  return prompt;
}

async function callAI(userMessage, mode) {
  const config = state.data.apiConfig;

  if (!config.apiKey) {
    throw new Error('未配置API密钥，请先在设置中填写');
  }

  const systemPrompt = buildSystemPrompt(mode);
  // 空发送续写时，userMessage 是系统提示而非真实用户消息，不需要排除 chatHistory 最后一条
  const isContinuation = mode === 'chat' && userMessage.startsWith('（系统提示：');
  // L9 即时上下文：最近20条记录，作为 history messages 注入
  const historyMsgs = (mode === 'chat' || mode === 'event' || mode === 'polish') ? buildHistoryMessages(mode, isContinuation) : [];

  const messages = [
    { role: 'system', content: systemPrompt },
    ...historyMsgs,
    { role: 'user', content: mode === 'polish' ? `请将以下内容润色为叙事文段：\n${userMessage}` : userMessage }
  ];

  try {
    // 不设定 max_tokens，让 API 使用模型默认最大输出长度，避免内容截断
    return await callWithRetry(() => callOpenAICompatible(messages, config), 1);
  } catch(e) {
    console.error('AI调用失败', e);
    throw e;
  }
}

// 自动重试包装：仅对网络错误/超时/5xx 重试，内容审查/4xx 不重试
async function callWithRetry(fn, maxRetries) {
  let lastError;
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      return await fn();
    } catch(e) {
      lastError = e;
      const msg = (e.message || '').toLowerCase();
      // 可重试：网络错误、超时、5xx 服务端错误
      const isRetryable = e.name === 'AbortError'
        || msg.includes('网络请求失败')
        || msg.includes('超时')
        || /api\s+5\d{2}/.test(msg)
        || msg.includes('failed to fetch');
      if (!isRetryable || attempt === maxRetries) throw e;
      // 重试前等 1 秒
      await new Promise(r => setTimeout(r, 1000));
    }
  }
  throw lastError;
}

// 统一 OpenAI 兼容调用（支持所有 OpenAI 兼容平台：DeepSeek官方/OpenRouter/各类代理等）
async function callOpenAICompatible(messages, config) {
  // 规范化 baseUrl：去除末尾的 / 和 /v1
  let base = (config.baseUrl || '').replace(/\/+$/, '');
  base = base.replace(/\/v1$/, '');
  // 超时控制：90秒无响应则中止请求，防止 UI 永久卡在加载状态
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 90000);

  // 构建请求体：检测到 Gemini 模型时附加 safety_settings，放宽安全过滤阈值。
  // Gemini 默认阈值为 BLOCK_MEDIUM_AND_ABOVE（中等风险即拦截），
  // 对古言权谋、战争、政治等正常创作题材误判率极高。
  // 改为 BLOCK_ONLY_HIGH：仅拦截高概率有害内容，大幅减少误判 [$TRAE_REF](https://ai.google.dev/gemini-api/docs/safety-settings?hl=zh-cn)
  const reqBody = {
    model: config.model,
    messages: messages,
    temperature: config.temperature != null ? config.temperature : 0.85,
    frequency_penalty: config.frequencyPenalty != null ? config.frequencyPenalty : 0.4,
    presence_penalty: config.presencePenalty != null ? config.presencePenalty : 0.3
  };
  const isGemini = /gemini/i.test(config.model || '') || /generativelanguage\.googleapis\.com/i.test(base);
  if (isGemini) {
    reqBody.safety_settings = [
      { category: 'HARM_CATEGORY_HARASSMENT', threshold: 'BLOCK_ONLY_HIGH' },
      { category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_ONLY_HIGH' },
      { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_ONLY_HIGH' },
      { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_ONLY_HIGH' },
      { category: 'HARM_CATEGORY_CIVIC_INTEGRITY', threshold: 'BLOCK_ONLY_HIGH' }
    ];
  }

  let resp;
  try {
    resp = await fetch(`${base}/v1/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${config.apiKey}`
      },
      body: JSON.stringify(reqBody),
      signal: controller.signal
    });
  } catch(e) {
    clearTimeout(timeoutId);
    if (e.name === 'AbortError') {
      throw new Error('请求超时（90秒无响应），请检查网络或API服务状态');
    }
    throw new Error('网络请求失败：' + (e.message || '未知错误'));
  }
  clearTimeout(timeoutId);
  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(`API ${resp.status}: ${errText}`);
  }

  // 解析返回
  const data = await resp.json();
  if (!data.choices || !data.choices[0]) throw new Error('API返回为空');
  const choice = data.choices[0];
  const content = (choice.message?.content || '').trim();

  // 截断检测保留作为安全监控：未设 max_tokens 时不应触发 length，
  // 若仍出现说明 API 端有隐性限制
  if (choice.finish_reason === 'length') {
    console.warn('[AI] 响应被截断（finish_reason: length），可能 API 端有隐性长度限制');
  }
  // 检测内容审查拦截：Google Gemini 通过 OpenAI 兼容端点返回时，
  // HTTP 状态码为 200，但 finish_reason 标记为 safety/content_filter，
  // 或 content 里直接塞入了审查错误的英文说明文本。
  const safetyReasons = ['safety', 'content_filter', 'recitation'];
  if (safetyReasons.includes(choice.finish_reason)) {
    throw new Error('内容被安全审查拦截（finish_reason: ' + choice.finish_reason + '），请调整剧情内容后重试');
  }
  // 内容审查错误文本特征（Gemini 会把这段话塞进 content 而非走错误码）
  const censorshipPatterns = [
    /prompt could not be submitted/i,
    /sensitive words? that violate/i,
    /Generative AI Prohibited Use policy/i,
    /Try rephrasing the prompt/i
  ];
  if (content && censorshipPatterns.some(re => re.test(content))) {
    throw new Error('内容被安全审查拦截，请调整剧情内容后重试');
  }

  if (!content) throw new Error('API返回内容为空（可能是内容审查拦截或token超限）');
  return content;
}

// 自动拉取平台下属的模型列表（OpenAI 兼容 GET /v1/models）
async function fetchModelList(baseUrl, apiKey) {
  let base = (baseUrl || '').replace(/\/+$/, '');
  base = base.replace(/\/v1$/, '');
  const resp = await fetch(`${base}/v1/models`, {
    method: 'GET',
    headers: { 'Authorization': `Bearer ${apiKey}` }
  });
  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(`拉取模型失败 ${resp.status}: ${errText}`);
  }
  const data = await resp.json();
  if (!data.data || !Array.isArray(data.data)) throw new Error('模型列表格式异常');
  return data.data.map(m => m.id).filter(Boolean);
}

/* ========== 聊天页 ========== */
function buildMessageHtml(msg, idx) {
  const isMe = msg.role === 'user';
  const charData = isMe ? state.data.characters.me : getActiveNpc();
  // 头像经全局 CSS 变量渲染（applyChatAvatarVars），行内不再复制 base64
  const avatarInner = charData.avatar
    ? ''
    : escapeHtml(getAvatarChar(charData.name, isMe ? '我' : 'TA'));
  return `
    <div class="msg-row ${isMe ? 'me' : 'ai'}" data-idx="${idx}" onclick="showMsgActions(${idx})">
      <div class="chat-avatar ${isMe ? 'me' : 'ai'}">${avatarInner}</div>
      <div class="msg-bubble">${escapeHtml(msg.content)}</div>
    </div>
  `;
}

// 聊天标签：根据 chatView 渲染「NPC好友列表」或「单NPC对话」
function renderChat() {
  if (!state.data) return;
  const view = state.chatView || 'list';
  const listView = document.getElementById('chat-list-view');
  const convView = document.getElementById('chat-conversation-view');
  const fsBtn = document.getElementById('chat-fs-btn');
  const topBtn = document.getElementById('chat-top-btn');
  const bottomBtn = document.getElementById('chat-bottom-btn');
  const addNpcBtn = document.getElementById('chat-add-npc-btn');
  const addGroupBtn = document.getElementById('chat-add-group-btn');
  const ICON_NAV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>';
  const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';

  if (view === 'list') {
    if (convView) convView.style.display = 'none';
    if (listView) listView.style.display = '';
    if (fsBtn) { fsBtn.innerHTML = ICON_NAV; fsBtn.setAttribute('onclick','openNav()'); fsBtn.title = '剧本列表'; }
    if (topBtn) topBtn.style.display = 'none';
    if (bottomBtn) bottomBtn.style.display = 'none';
    if (addNpcBtn) addNpcBtn.style.display = '';
    if (addGroupBtn) addGroupBtn.style.display = '';
    renderChatList();
    updateChatHeaderTitle();
    return;
  }

  // 对话视图（NPC单人 或 群聊）
  if (listView) listView.style.display = 'none';
  if (convView) convView.style.display = '';
  if (fsBtn) { fsBtn.innerHTML = ICON_BACK; fsBtn.setAttribute('onclick','backToChatList()'); fsBtn.title = '返回列表'; }
  if (topBtn) topBtn.style.display = '';
  if (bottomBtn) bottomBtn.style.display = '';
  if (addNpcBtn) addNpcBtn.style.display = 'none';
  if (addGroupBtn) addGroupBtn.style.display = 'none';

  // 群聊视图
  if (view === 'group' && state.data.activeGroupId) {
    renderGroupChatView();
    return;
  }

  // 动态更新输入框 placeholder（单人聊天模式）
  const npcInput = document.getElementById('chat-input');
  if (npcInput) npcInput.placeholder = '输入消息（空发送=让TA继续说）...';

  applyChatAvatarVars();
  updateChatHeaderTitle();

  const container = document.getElementById('chat-messages');
  const history = state.data.chatHistory;

  if (!state.data.activeNpcId) {
    container.innerHTML = `<div class="memory-empty">未选择NPC<br><span style="font-size:11px;opacity:0.6">返回列表选择一个角色</span></div>`;
    return;
  }
  if (history.length === 0) {
    const npcName = (getActiveNpc().name || '').trim();
    container.innerHTML = npcName
      ? `<div class="memory-empty">开始与「${escapeHtml(npcName)}」的对话<br><span style="font-size:11px;opacity:0.6">在下方输入消息</span></div>`
      : `<div class="memory-empty">开始你的故事<br><span style="font-size:11px;opacity:0.6">在下方输入消息</span></div>`;
    return;
  }

  let html = '';
  let lastSession = -1;
  const currentSessionId = state.chatSessionId;

  // 窗口化渲染：只渲染最近 N 条，顶部留一个哨兵元素供滚动监听触发自动加载
  const total = history.length;
  const renderCount = Math.min(total, CHAT_RENDER_WINDOW);
  state._chatRenderedCount = renderCount;
  const startIdx = total - renderCount;

  if (startIdx > 0) {
    html += `<div class="chat-load-sentinel" data-remaining="${startIdx}"></div>`;
  }

  for (let i = startIdx; i < total; i++) {
    const msg = history[i];
    if (msg.sessionId !== lastSession) {
      const ts = (msg.sessionId === currentSessionId && state.chatSessionStartTime)
        ? state.chatSessionStartTime
        : msg.timestamp;
      html += `<div class="chat-timestamp">${formatTime(ts)}</div>`;
      lastSession = msg.sessionId;
    }
    html += buildMessageHtml(msg, i);
  }

  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;

  // 恢复打字动画（跨页面切换后 DOM 被重建）；isTyping 仅由聊天线设置，
  // 事件生成中并发聊天时动画同样需要恢复，不受 calendarLoading 影响
  if (state.isTyping) showTypingIndicator();
}

// 窗口化渲染：自动加载更早的聊天消息（滑到顶部触发，增量前插，保持滚动位置）
function loadMoreChatMessages() {
  const container = document.getElementById('chat-messages');
  if (!container) return;
  if (state._chatLoadingMore) return;  // 防重复
  const history = state.data.chatHistory;
  const total = history.length;
  const currentlyRendered = state._chatRenderedCount || CHAT_RENDER_WINDOW;
  const newCount = Math.min(currentlyRendered + CHAT_RENDER_WINDOW, total);
  if (newCount === currentlyRendered) return; // 没有更多了

  state._chatLoadingMore = true;

  // 显示加载动画
  const sentinel = container.querySelector('.chat-load-sentinel');
  if (sentinel) {
    sentinel.innerHTML = '<div class="chat-load-spinner"><span>加载中</span><span class="dots"><span></span><span></span><span></span></span></div>';
  }

  // 用 requestAnimationFrame 延迟一帧，让 spinner 先渲染出来
  requestAnimationFrame(() => {
    setTimeout(() => {
      const newStart = total - newCount;
      const oldStart = total - currentlyRendered;
      state._chatRenderedCount = newCount;

      // 记住旧滚动位置
      const oldScrollHeight = container.scrollHeight;
      const oldScrollTop = container.scrollTop;

      // 构建新加载段的 HTML
      let prependHtml = '';
      let lastSession = (oldStart < total) ? history[oldStart].sessionId : -1;
      const currentSessionId = state.chatSessionId;
      for (let i = newStart; i < oldStart; i++) {
        const msg = history[i];
        if (msg.sessionId !== lastSession) {
          const ts = (msg.sessionId === currentSessionId && state.chatSessionStartTime)
            ? state.chatSessionStartTime
            : msg.timestamp;
          prependHtml += `<div class="chat-timestamp">${formatTime(ts)}</div>`;
          lastSession = msg.sessionId;
        }
        prependHtml += buildMessageHtml(msg, i);
      }

      // 更新或移除哨兵
      if (sentinel) {
        if (newStart > 0) {
          sentinel.setAttribute('data-remaining', newStart);
          sentinel.innerHTML = '';
          sentinel.insertAdjacentHTML('afterend', prependHtml);
        } else {
          sentinel.remove();
          container.insertAdjacentHTML('afterbegin', prependHtml);
        }
      } else {
        container.insertAdjacentHTML('afterbegin', prependHtml);
      }

      // 保持视觉位置不变
      container.scrollTop = oldScrollTop + (container.scrollHeight - oldScrollHeight);
      state._chatLoadingMore = false;
    }, 80);  // 80ms 让 spinner 可见
  });
}

// 好友列表（NPC + 群聊混排，按最后消息时间倒序）
function renderChatList() {
  const container = document.getElementById('chat-list-view');
  if (!container) return;
  const npcs = state.data.characters.npcs || [];
  const groups = state.data.groupChats || [];

  if (!npcs.length && !groups.length) {
    container.innerHTML = `<div class="memory-empty">还没有NPC<br><span style="font-size:11px;opacity:0.6">点击右上角「＋」新增</span></div>`;
    return;
  }

  // 统一收集所有对话项
  let items = [];

  // NPC 项
  npcs.forEach(npc => {
    const chat = getNpcChat(npc.id);
    const last = chat.length ? chat[chat.length - 1] : null;
    items.push({
      type: 'npc',
      id: npc.id,
      name: npc.name || '未命名',
      preview: last ? truncateText(last.content, 28) : '开始对话',
      time: last ? last.timestamp : 0,
      timeStr: last ? formatRelativeTime(last.timestamp) : '',
      avatar: npc.avatar || '',
      avatarChar: getAvatarChar(npc.name, 'NPC'),
      active: npc.id === state.data.activeNpcId && !state.data.activeGroupId,
      onclick: `switchNpcChat('${npc.id}')`,
      onAvatarClick: `event.stopPropagation();openNpcEditor('${npc.id}')`
    });
  });

  // 群聊项
  groups.forEach(grp => {
    const last = grp.chatHistory.length ? grp.chatHistory[grp.chatHistory.length - 1] : null;
    let preview = '开始群聊';
    if (last) {
      const prefix = last.role === 'assistant' && last.speakerName ? last.speakerName + '：' : '';
      preview = truncateText(prefix + (last.content || ''), 28);
    }
    items.push({
      type: 'group',
      id: grp.id,
      name: grp.name || '未命名群聊',
      preview: preview,
      time: last ? last.timestamp : (grp.createdAt || 0),
      timeStr: last ? formatRelativeTime(last.timestamp) : '',
      avatar: grp.avatar || '',
      avatarChar: (grp.name || '群')[0],
      active: grp.id === state.data.activeGroupId,
      onclick: `switchToGroupChat('${grp.id}')`,
      onAvatarClick: `event.stopPropagation();editGroupChat('${grp.id}')`
    });
  });

  // 按最后消息时间倒序排列（无消息的按创建时间排后）
  items.sort((a, b) => b.time - a.time);

  let html = '<div class="npc-list">';
  items.forEach(item => {
    const avatarStyle = item.avatar ? ` style="background-image:url('${item.avatar}');background-size:cover;background-position:center"` : '';
    const avatarInner = item.avatar ? '' : escapeHtml(item.avatarChar);
    const nameHtml = item.name && item.name !== '未命名' && item.name !== '未命名群聊'
      ? escapeHtml(item.name)
      : `<span style="opacity:0.45">${escapeHtml(item.name)}</span>`;
    html += `
      <div class="npc-list-item${item.active ? ' active' : ''}" onclick="${item.onclick}">
        <div class="npc-list-avatar"${avatarStyle} onclick="${item.onAvatarClick}">${avatarInner}</div>
        <div class="npc-list-info">
          <div class="npc-list-top"><span class="npc-list-name">${nameHtml}</span>${item.timeStr ? `<span class="npc-list-time">${item.timeStr}</span>` : ''}</div>
          <div class="npc-list-preview">${escapeHtml(item.preview)}</div>
        </div>
      </div>`;
  });
  html += '</div>';

  container.innerHTML = html;
}

// 返回好友列表
function backToChatList() {
  state.chatView = 'list';
  renderChat();
  renderNavCharList();
}

/* ========== 群聊模块 ========== */

// 群聊创建临时状态
let _groupCreatorState = { name: '', avatar: '', selectedIds: [], editId: null };

// 打开群聊创建/编辑弹窗
function openGroupCreator(editId) {
  const npcs = state.data.characters.npcs || [];
  if (npcs.length < 2) {
    showToast('至少需要2个NPC才能创建群聊');
    return;
  }

  if (editId) {
    const grp = state.data.groupChats.find(g => g.id === editId);
    if (!grp) return;
    _groupCreatorState = {
      name: grp.name || '',
      avatar: grp.avatar || '',
      selectedIds: [...(grp.memberIds || [])],
      editId: editId
    };
  } else {
    _groupCreatorState = { name: '', avatar: '', selectedIds: [], editId: null };
  }

  let membersHtml = '';
  npcs.forEach(npc => {
    const checked = _groupCreatorState.selectedIds.includes(npc.id);
    const avatarStyle = npc.avatar ? `style="background-image:url('${npc.avatar}');background-size:cover;background-position:center"` : '';
    const avatarInner = npc.avatar ? '' : escapeHtml(getAvatarChar(npc.name, 'NPC'));
    membersHtml += `
      <div class="group-member-item" onclick="toggleGroupMember('${npc.id}')">
        <div class="group-member-avatar" ${avatarStyle}>${avatarInner}</div>
        <div class="group-member-info">
          <div class="group-member-name">${escapeHtml(npc.name || '未命名')}</div>
          <div class="group-member-desc">${escapeHtml(npc.oneLiner || npc.identity || '无介绍')}</div>
        </div>
        <div class="group-member-check${checked ? ' checked' : ''}" id="gcheck-${npc.id}"></div>
      </div>`;
  });

  const avatarBg = _groupCreatorState.avatar
    ? `style="background-image:url('${_groupCreatorState.avatar}');background-size:cover;background-position:center"`
    : '';
  const avatarText = _groupCreatorState.avatar ? '' : `<span style="font-size:24px;font-weight:300;color:rgba(239,244,250,0.95)">${escapeHtml((_groupCreatorState.name || '群')[0])}</span>`;

  showModal(`
    <div class="modal">
      <div class="modal-header">${editId ? '编辑群聊' : '新建群聊'}</div>
      <div class="modal-body group-creator-body">
        <div class="group-creator-avatar" id="group-avatar-preview" ${avatarBg} onclick="uploadGroupAvatar()" title="点击上传群头像">${avatarText}</div>
        <input type="text" class="group-creator-name" id="group-name-input" placeholder="群聊名称" value="${escapeHtml(_groupCreatorState.name)}" oninput="_groupCreatorState.name=this.value;updateGroupAvatarPreview()">
        <div class="group-member-list">${membersHtml}</div>
      </div>
      <div class="modal-footer">
        ${editId ? '<button class="modal-btn" style="color:var(--danger)" onclick="deleteGroupChat(\'' + editId + '\')">删除</button>' : ''}
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="saveGroupChat()">${editId ? '保存' : '创建'}</button>
      </div>
    </div>
  `);
}

// 切换NPC选中状态
// 输入群名时实时更新默认头像首字
function updateGroupAvatarPreview() {
  if (_groupCreatorState.avatar) return; // 有自定义头像时不更新
  const preview = document.getElementById('group-avatar-preview');
  if (!preview) return;
  const firstChar = (_groupCreatorState.name || '群')[0];
  preview.innerHTML = `<span style="font-size:24px;font-weight:300;color:rgba(239,244,250,0.95)">${escapeHtml(firstChar)}</span>`;
}

function toggleGroupMember(npcId) {
  const idx = _groupCreatorState.selectedIds.indexOf(npcId);
  if (idx >= 0) {
    _groupCreatorState.selectedIds.splice(idx, 1);
  } else {
    _groupCreatorState.selectedIds.push(npcId);
  }
  const check = document.getElementById('gcheck-' + npcId);
  if (check) check.classList.toggle('checked');
}

// 上传群头像
function uploadGroupAvatar() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      _groupCreatorState.avatar = ev.target.result;
      const preview = document.getElementById('group-avatar-preview');
      if (preview) {
        preview.style.backgroundImage = `url('${ev.target.result}')`;
        preview.style.backgroundSize = 'cover';
        preview.style.backgroundPosition = 'center';
        preview.innerHTML = '';
      }
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

// 保存/创建群聊
function saveGroupChat() {
  let name = (_groupCreatorState.name || '').trim();
  if (_groupCreatorState.selectedIds.length < 2) { showToast('至少选择2个NPC'); return; }

  // 群聊名称未填写时，用成员名自动生成默认名
  if (!name) {
    const npcs = state.data.characters.npcs || [];
    const memberNames = _groupCreatorState.selectedIds.map(id => {
      const n = npcs.find(n => n.id === id);
      return n ? n.name : '';
    }).filter(Boolean);
    name = memberNames.slice(0, 3).join('、') + (memberNames.length > 3 ? '等' : '') + '的群聊';
  }

  if (_groupCreatorState.editId) {
    const grp = state.data.groupChats.find(g => g.id === _groupCreatorState.editId);
    if (grp) {
      grp.name = name;
      grp.avatar = _groupCreatorState.avatar;
      grp.memberIds = [..._groupCreatorState.selectedIds];
    }
  } else {
    const newGroup = {
      id: 'grp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      name: name,
      avatar: _groupCreatorState.avatar,
      memberIds: [..._groupCreatorState.selectedIds],
      chatHistory: [],
      createdAt: Date.now()
    };
    state.data.groupChats.push(newGroup);
  }
  saveToStorage();
  closeModal();
  renderChatList();
  showToast(_groupCreatorState.editId ? '群聊已更新' : '群聊已创建');
}

// 编辑群聊
function editGroupChat(groupId) {
  openGroupCreator(groupId);
}

// 删除群聊
function deleteGroupChat(groupId) {
  showModal(`
    <div class="modal">
      <div class="modal-header">删除群聊</div>
      <div class="modal-body" style="text-align:center;color:var(--text-dim);font-size:13px;">
        确定删除该群聊吗？聊天记录将一并删除。
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn" style="color:var(--danger)" onclick="confirmDeleteGroup('${groupId}')">删除</button>
      </div>
    </div>
  `);
}

function confirmDeleteGroup(groupId) {
  const idx = state.data.groupChats.findIndex(g => g.id === groupId);
  if (idx >= 0) {
    state.data.groupChats.splice(idx, 1);
    if (state.data.activeGroupId === groupId) {
      state.data.activeGroupId = '';
      state.chatView = 'list';
    }
    saveToStorage();
    closeModal();
    renderChatList();
    showToast('群聊已删除');
  }
}

// 切换到群聊
function switchToGroupChat(groupId) {
  const grp = state.data.groupChats.find(g => g.id === groupId);
  if (!grp) return;
  if (state.chatLoading) { showToast('正在生成中，请稍后再切换'); return; }

  // 如果当前在NPC对话中，保存当前聊天记录
  if (state.chatView === 'chat' && state.data.activeNpcId) {
    if (state.data.activeNpcId) state.data.npcChats[state.data.activeNpcId] = state.data.chatHistory;
  }

  state.data.activeGroupId = groupId;
  state.chatView = 'group';
  state.chatSessionId++;
  state.chatSessionStartTime = Date.now();
  saveToStorage();
  renderChat();
}

// 渲染群聊对话视图
function renderGroupChatView() {
  const grp = state.data.groupChats.find(g => g.id === state.data.activeGroupId);
  if (!grp) {
    state.chatView = 'list';
    renderChat();
    return;
  }

  // 更新标题
  const titleEl = document.getElementById('chat-title');
  if (titleEl) titleEl.textContent = grp.name || '群聊';

  // 动态更新输入框 placeholder（群聊模式）
  const grpInput = document.getElementById('chat-input');
  if (grpInput) grpInput.placeholder = '输入消息（空发送=看群成员聊天）...';

  const container = document.getElementById('chat-messages');
  const history = grp.chatHistory;

  // 设置群头像为AI侧CSS变量
  const root = document.documentElement.style;
  if (grp.avatar) {
    root.setProperty('--av-ai', `url('${grp.avatar.replace(/'/g, '%27')}')`);
  } else {
    root.removeProperty('--av-ai');
  }
  // 为每个群成员设置独立 CSS 变量，避免内联 base64 重复
  (grp.memberIds || []).forEach(id => {
    const npc = state.data.characters.npcs.find(n => n.id === id);
    if (npc && npc.avatar) {
      root.setProperty(`--av-gnpc-${id}`, `url('${npc.avatar.replace(/'/g, '%27')}')`);
    } else {
      root.removeProperty(`--av-gnpc-${id}`);
    }
  });

  if (history.length === 0) {
    const memberNames = (grp.memberIds || []).map(id => {
      const n = state.data.characters.npcs.find(n => n.id === id);
      return n ? n.name : '';
    }).filter(Boolean).join('、');
    container.innerHTML = `<div class="memory-empty">群聊「${escapeHtml(grp.name || '群聊')}」已就绪<br><span style="font-size:11px;opacity:0.6">成员：${escapeHtml(memberNames)}</span><br><span style="font-size:11px;opacity:0.6">在下方输入消息</span></div>`;
    return;
  }

  const npcs = state.data.characters.npcs || [];
  let html = '';
  let lastSession = -1;
  const currentSessionId = state.chatSessionId;

  // 窗口化渲染：只渲染最近 N 条，顶部留哨兵元素供滚动监听触发自动加载
  const total = history.length;
  const renderCount = Math.min(total, CHAT_RENDER_WINDOW);
  state._groupRenderedCount = renderCount;
  const startIdx = total - renderCount;

  if (startIdx > 0) {
    html += `<div class="chat-load-sentinel" data-remaining="${startIdx}"></div>`;
  }

  for (let i = startIdx; i < total; i++) {
    const msg = history[i];
    if (msg.sessionId !== lastSession) {
      const ts = (msg.sessionId === currentSessionId && state.chatSessionStartTime)
        ? state.chatSessionStartTime
        : msg.timestamp;
      html += `<div class="chat-timestamp">${formatTime(ts)}</div>`;
      lastSession = msg.sessionId;
    }
    html += buildGroupMessageHtml(msg, i, npcs, grp);
  }

  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;

  // 恢复打字动画（跨页面切换后 DOM 被重建）；事件生成中并发聊天时同样恢复
  if (state.isTyping) {
    const grp2 = state.data.groupChats.find(g => g.id === state.data.activeGroupId);
    if (grp2) showGroupTypingIndicator(grp2);
  }
}

// 窗口化渲染：自动加载更早的群聊消息（滑到顶部触发，增量前插，保持滚动位置）
function loadMoreGroupMessages() {
  const container = document.getElementById('chat-messages');
  if (!container) return;
  if (state._chatLoadingMore) return;
  const grp = state.data.groupChats.find(g => g.id === state.data.activeGroupId);
  if (!grp) return;
  const history = grp.chatHistory;
  const npcs = state.data.characters.npcs || [];
  const total = history.length;
  const currentlyRendered = state._groupRenderedCount || CHAT_RENDER_WINDOW;
  const newCount = Math.min(currentlyRendered + CHAT_RENDER_WINDOW, total);
  if (newCount === currentlyRendered) return;

  state._chatLoadingMore = true;

  const sentinel = container.querySelector('.chat-load-sentinel');
  if (sentinel) {
    sentinel.innerHTML = '<div class="chat-load-spinner"><span>加载中</span><span class="dots"><span></span><span></span><span></span></span></div>';
  }

  requestAnimationFrame(() => {
    setTimeout(() => {
      const newStart = total - newCount;
      const oldStart = total - currentlyRendered;
      state._groupRenderedCount = newCount;

      const oldScrollHeight = container.scrollHeight;
      const oldScrollTop = container.scrollTop;

      let prependHtml = '';
      let lastSession = (oldStart < total) ? history[oldStart].sessionId : -1;
      const currentSessionId = state.chatSessionId;
      for (let i = newStart; i < oldStart; i++) {
        const msg = history[i];
        if (msg.sessionId !== lastSession) {
          const ts = (msg.sessionId === currentSessionId && state.chatSessionStartTime)
            ? state.chatSessionStartTime
            : msg.timestamp;
          prependHtml += `<div class="chat-timestamp">${formatTime(ts)}</div>`;
          lastSession = msg.sessionId;
        }
        prependHtml += buildGroupMessageHtml(msg, i, npcs, grp);
      }

      if (sentinel) {
        if (newStart > 0) {
          sentinel.setAttribute('data-remaining', newStart);
          sentinel.innerHTML = '';
          sentinel.insertAdjacentHTML('afterend', prependHtml);
        } else {
          sentinel.remove();
          container.insertAdjacentHTML('afterbegin', prependHtml);
        }
      } else {
        container.insertAdjacentHTML('afterbegin', prependHtml);
      }

      container.scrollTop = oldScrollTop + (container.scrollHeight - oldScrollHeight);
      state._chatLoadingMore = false;
    }, 80);
  });
}

// 群聊消息HTML
function buildGroupMessageHtml(msg, idx, npcs, grp) {
  const isMe = msg.role === 'user';
  const meChar = state.data.characters.me;

  if (isMe) {
    const avatarInner = meChar.avatar ? '' : escapeHtml(getAvatarChar(meChar.name, '我'));
    return `
      <div class="msg-row me" data-idx="${idx}" onclick="showGroupMsgActions(${idx})">
        <div class="chat-avatar me">${avatarInner}</div>
        <div class="msg-bubble">${escapeHtml(msg.content)}</div>
      </div>`;
  }

  // NPC消息：查找说话者
  const speakerNpc = msg.speakerId ? npcs.find(n => n.id === msg.speakerId) : null;
  const speakerName = msg.speakerName || (speakerNpc ? speakerNpc.name : '') || '未知';

  // 头像：用说话者的 CSS 变量（避免内联 base64 重复）
  let avatarStyle = '';
  let avatarInner = '';
  if (speakerNpc && speakerNpc.avatar) {
    avatarStyle = ` style="background-image:var(--av-gnpc-${speakerNpc.id}, linear-gradient(135deg,#3A6FA5 0%,#8AA8D0 100%))"`;
  } else {
    avatarInner = escapeHtml(getAvatarChar(speakerName, 'NPC'));
  }

  return `
    <div class="msg-row ai" data-idx="${idx}" onclick="showGroupMsgActions(${idx})">
      <div class="chat-avatar ai"${avatarStyle}>${avatarInner}</div>
      <div>
        <div class="group-msg-speaker">${escapeHtml(speakerName)}</div>
        <div class="msg-bubble">${escapeHtml(msg.content)}</div>
      </div>
    </div>`;
}

// 群聊发送消息
async function sendGroupChatMessage() {
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send-btn');
  // 聊天线独立守卫：聊天生成中拦截；事件生成中（calendarLoading）允许并发聊天
  if (state.chatLoading) return;
  const text = input.value.trim();

  const grp = state.data.groupChats.find(g => g.id === state.data.activeGroupId);
  if (!grp) return;

  input.value = '';
  autoResizeInput(input);

  // 空回复：让群成员自己根据上下文聊天互动（不添加用户消息）
  if (!text) {
    state.isLoading = true;
    state.chatLoading = true;
    btn.disabled = true;
    showGroupTypingIndicator(grp);
    try {
      // 剧情推进后的首次群聊空发送：消费挂起的分隔信号开新会话（与单聊一致）
      if (state.data.pendingSessionBreak) {
        state.chatSessionId++;
        state.chatSessionStartTime = Date.now();
        state.data.pendingSessionBreak = false;
        saveToStorage();
      }

      // 用特殊提示词触发群成员自主对话
      const reply = await callAIGroupChat('（系统提示：主控暂时没有发言，群成员们根据近期事件和上下文自发聊天互动。选择1-2个最合适的群成员发言，他们之间要自然接话、互动。）', grp, true);
      removeTypingIndicator();
      const responses = parseGroupAIResponse(reply, grp);
      if (responses.length === 0) {
        showToast('群成员暂时没有话说');
        saveToStorage();
        return;
      }
      for (const resp of responses) {
        grp.chatHistory.push({
          role: 'assistant',
          content: resp.content,
          timestamp: Date.now(),
          sessionId: state.chatSessionId,
          speakerId: resp.speakerId,
          speakerName: resp.speakerName
        });
        appendGroupChatMessage(grp.chatHistory.length - 1, grp);
        await new Promise(r => setTimeout(r, 400));
      }
      saveToStorage();
    } catch(e) {
      removeTypingIndicator();
      showToast('群聊回复失败：' + (e.message || '未知错误'));
    } finally {
      state.chatLoading = false;
      // isLoading 恢复为事件线的真实状态：事件仍在生成时保持 true，避免守卫误开
      state.isLoading = state.calendarLoading;
      btn.disabled = false;
      input.focus();
    }
    return;
  }

  // 文字发送：剧情有新进展（挂起的分隔信号）时开新会话并消费信号，再推送用户消息
  if (state.data.pendingSessionBreak) {
    state.chatSessionId++;
    state.chatSessionStartTime = Date.now();
    state.data.pendingSessionBreak = false;
  }

  // 添加用户消息
  grp.chatHistory.push({
    role: 'user',
    content: text,
    timestamp: Date.now(),
    sessionId: state.chatSessionId
  });
  saveToStorage();
  appendGroupChatMessage(grp.chatHistory.length - 1, grp);

  state.isLoading = true;
  state.chatLoading = true;
  btn.disabled = true;
  showGroupTypingIndicator(grp);

  try {
    // 单次AI调用生成群聊回复，prompt中要求接力互动
    const reply = await callAIGroupChat(text, grp);
    removeTypingIndicator();

    const responses = parseGroupAIResponse(reply, grp);
    if (responses.length === 0) {
      showToast('群聊回复解析失败，请重试');
      saveToStorage();
      return;
    }
    for (const resp of responses) {
      grp.chatHistory.push({
        role: 'assistant',
        content: resp.content,
        timestamp: Date.now(),
        sessionId: state.chatSessionId,
        speakerId: resp.speakerId,
        speakerName: resp.speakerName
      });
      appendGroupChatMessage(grp.chatHistory.length - 1, grp);
      await new Promise(r => setTimeout(r, 400));
    }
    saveToStorage();
  } catch(e) {
    removeTypingIndicator();
    showToast('AI回复失败：' + (e.message || '未知错误'));
  } finally {
    state.chatLoading = false;
    // isLoading 恢复为事件线的真实状态：事件仍在生成时保持 true，避免守卫误开
    state.isLoading = state.calendarLoading;
    btn.disabled = false;
    input.focus();
  }
}

// 群聊AI调用（逐个生成：prevReply 为上一轮 NPC 的回复，excludeIds 为已回复的 NPC id）
async function callAIGroupChat(userMessage, grp, isAutoChat) {
  const config = state.data.apiConfig;
  if (!config.apiKey) {
    throw new Error('未配置API密钥，请先在设置中填写');
  }

  const npcs = state.data.characters.npcs || [];
  const meName = (state.data.characters.me.name || '').trim() || '主控';

  // 构建群成员人设（L4 人设层）
  let memberPrompt = '\n【角色设定】\n';
  // 主控角色完整设定
  const meChar = state.data.characters.me;
  memberPrompt += '--- 主控角色 ---\n';
  memberPrompt += `姓名：${meChar.name || '未设定'}，性别：${meChar.gender || '未设定'}，年龄：${meChar.age || '未设定'}，身份：${meChar.identity || '未设定'}\n`;
  memberPrompt += `外貌：${meChar.appearance || '未设定'}\n性格：${meChar.personality || '未设定'}\n人物背景：${meChar.background || '未设定'}\n其他设定：${meChar.other || '无'}\n`;
  // 各群成员完整设定
  grp.memberIds.forEach(id => {
    const n = npcs.find(n => n.id === id);
    if (n) {
      memberPrompt += `--- ${n.name || '未命名'} ---\n`;
      memberPrompt += `姓名：${n.name || '未设定'}，性别：${n.gender || '未设定'}，年龄：${n.age || '未设定'}，身份：${n.identity || '未设定'}\n`;
      memberPrompt += `外貌：${n.appearance || '未设定'}\n性格：${n.personality || '未设定'}\n人物背景：${n.background || '未设定'}\n其他设定：${n.other || '无'}\n`;
      if (n.oneLiner) memberPrompt += `简介：${n.oneLiner}\n`;
      memberPrompt += '\n';
    }
  });

  // 构建群聊模式指令
  const memberNames = grp.memberIds.map(id => {
    const n = npcs.find(n => n.id === id);
    return n ? n.name : '';
  }).filter(Boolean);

  // 构建群聊模式指令（单次调用，要求接力互动）
  const autoChatHint = isAutoChat ? '\n当前状态：主控暂时没有发言，群成员们根据近期事件和上下文自发聊天互动。' : '\n根据主控角色的发言，选择1-2个最合适的群成员进行回复。';
  const groupModePrompt = `\n【当前模式：群聊】\n这是「${grp.name}」的群聊。群成员有：${memberNames.join('、')}。\n主控角色是「${meName}」。${autoChatHint}\n规则：\n1. 选择1-2个最合适的群成员发言。选择标准：谁的性格和当前话题最相关、谁最可能回应。\n2. 如果有2个NPC回复，第二个NPC的回复必须考虑第一个NPC的回复内容，自然地接话、回应或互动，形成群员之间的真实互动感，而不是各自独立回复。\n3. 每个回复必须严格符合该角色的性格设定和说话风格。\n4. 回复格式：每条回复占一行，格式为 NPC姓名|||回复内容。每个NPC一条，不要有多余的说明。\n5. 回复要短句、口语化，像真实的微信群聊一样自然。\n6. 绝对禁止任何括号旁白、动作描写、心理描写。只输出对话文字本身。\n7. 不主动推进重大剧情，不展开长篇叙述。\n8. 绝对禁止输出代码、JSON、markdown或任何结构化标记。\n`;

  // 构建 System Prompt
  let systemPrompt = '';
  systemPrompt += buildBaseAnchor();
  systemPrompt += buildGlobalRulesPrompt();
  systemPrompt += buildRulesPrompt();
  systemPrompt += memberPrompt;
  systemPrompt += buildMainStoryPrompt();
  // L6 时间线上下文（辅助层，置于快照之前）：补齐快照缺失的事件细节（与单聊一致）
  systemPrompt += buildTimelineContextPrompt();
  systemPrompt += buildStoryStatePrompt();
  systemPrompt += groupModePrompt;

  // 构建 history messages
  const MAX_HISTORY = 25;
  const recentHistory = grp.chatHistory.slice(-MAX_HISTORY).map(h => {
    if (h.role === 'user') {
      return { role: 'user', content: h.content };
    } else {
      return { role: 'assistant', content: `${h.speakerName || 'NPC'}：${h.content}` };
    }
  });

  const messages = [
    { role: 'system', content: systemPrompt },
    ...recentHistory
  ];
  // 非空回复模式才将用户消息添加到末尾
  if (!isAutoChat) {
    messages.push({ role: 'user', content: userMessage });
  }

  return await callWithRetry(() => callOpenAICompatible(messages, config), 1);
}

// 解析群聊AI回复
function parseGroupAIResponse(raw, grp) {
  if (!raw) return [];
  const npcs = state.data.characters.npcs || [];
  const lines = raw.trim().split('\n').filter(l => l.trim());
  const results = [];

  lines.forEach(line => {
    const idx = line.indexOf('|||');
    if (idx >= 0) {
      const name = line.slice(0, idx).trim();
      const content = line.slice(idx + 3).trim();
      if (!content) return;
      // 查找NPC
      const npc = npcs.find(n => n.name === name);
      results.push({
        speakerId: npc ? npc.id : '',
        speakerName: name,
        content: content
      });
    } else {
      // 没有分隔符，尝试匹配NPC名前缀
      for (const n of npcs) {
        if (n.name && line.startsWith(n.name + '：')) {
          results.push({
            speakerId: n.id,
            speakerName: n.name,
            content: line.slice(n.name.length + 1).trim()
          });
          return;
        }
      }
      // 无法解析，作为第一个成员的消息
      if (grp.memberIds.length > 0 && results.length === 0) {
        const firstNpc = npcs.find(n => n.id === grp.memberIds[0]);
        results.push({
          speakerId: grp.memberIds[0],
          speakerName: firstNpc ? firstNpc.name : 'NPC',
          content: line.trim()
        });
      }
    }
  });

  // 如果没解析出任何回复，返回空
  return results;
}

// 群聊消息追加到DOM
function appendGroupChatMessage(idx, grp) {
  const container = document.getElementById('chat-messages');
  if (!container) return;
  const msg = grp.chatHistory[idx];
  if (!msg) return;

  const emptyEl = container.querySelector('.memory-empty');
  if (emptyEl) emptyEl.remove();

  const prevMsg = idx > 0 ? grp.chatHistory[idx - 1] : null;
  if (!prevMsg || prevMsg.sessionId !== msg.sessionId) {
    const ts = (msg.sessionId === state.chatSessionId && state.chatSessionStartTime)
      ? state.chatSessionStartTime
      : msg.timestamp;
    container.insertAdjacentHTML('beforeend', `<div class="chat-timestamp">${formatTime(ts)}</div>`);
  }

  const npcs = state.data.characters.npcs || [];
  container.insertAdjacentHTML('beforeend', buildGroupMessageHtml(msg, idx, npcs, grp));
  if (state._groupRenderedCount) state._groupRenderedCount++;
  const newMsg = container.querySelector(`.msg-row[data-idx="${idx}"]`);
  if (newMsg) {
    newMsg.classList.add('msg-new');
    newMsg.addEventListener('animationend', function() { newMsg.classList.remove('msg-new'); }, { once: true });
  }
  container.scrollTop = container.scrollHeight;
}

async function sendChatMessage() {
  // 群聊模式下路由到群聊发送
  if (state.chatView === 'group' && state.data.activeGroupId) {
    return sendGroupChatMessage();
  }
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send-btn');
  // 聊天线独立守卫：聊天生成中拦截；事件生成中（calendarLoading）允许并发聊天
  if (state.chatLoading) return;
  const text = input.value.trim();
  const hasQuote = !!state.quoteContext;

  // Handle quoted reply
  let finalText = text;
  if (hasQuote) {
    finalText = text ? `[引用：「${state.quoteContext.substring(0, 50)}」]\n${text}` : `[引用：「${state.quoteContext.substring(0, 50)}」]`;
    state.quoteContext = null;
    const quoteBar = document.getElementById('quote-bar');
    if (quoteBar) quoteBar.style.display = 'none';
  }

  // Empty text + no quote = "continue" prompt
  if (!text && !hasQuote) {
    const chatHist = state.data.chatHistory;
    const lastIsUser = chatHist.length > 0 && chatHist[chatHist.length - 1].role === 'user';
    state.isLoading = true;
    state.chatLoading = true;
    btn.disabled = true;
    showTypingIndicator();
    try {
      let reply;
      if (state.data.pendingSessionBreak) {
        // 新事件后首次空发送 → AI角色主动发消息（开新会话，不生成快照）
        state.chatSessionId++;
        state.chatSessionStartTime = Date.now();
        state.data.pendingSessionBreak = false;
        saveToStorage();
        reply = await callAI('（系统提示：刚刚发生了一些事，你主动给主控角色发了一条消息。请直接输出这条消息，不要加任何说明或引号，内容要贴合近期事件和你的性格，像平时发微信一样自然。）', 'chat');
      } else if (lastIsUser) {
        // 上一条是主控的消息 → AI回复主控的话（用主控的最后一条消息作为输入，走标准流程）
        const lastUserMsg = chatHist[chatHist.length - 1].content;
        reply = await callAI(lastUserMsg, 'chat');
      } else {
        // 上一条是AI的消息 → 主控沉默，AI继续说
        reply = await callAI('（系统提示：对方没有回复，你紧接着又会说一句话。请直接输出这句话，不要加任何说明或引号，不要重复已经说过的话，内容要自然衔接上一句。）', 'chat');
      }
      removeTypingIndicator();
      const cleanReply = reply.trim();
      if (cleanReply) {
        state.data.chatHistory.push({
          role: 'assistant', content: cleanReply,
          timestamp: Date.now(), sessionId: state.chatSessionId
        });
        appendChatMessage(state.data.chatHistory.length - 1);
        saveToStorage();
      }
    } catch(e) {
      removeTypingIndicator();
      showToast('AI回复失败：' + (e.message || '未知错误'));
    } finally {
      state.chatLoading = false;
      // isLoading 恢复为事件线的真实状态：事件仍在生成时保持 true，避免守卫误开
      state.isLoading = state.calendarLoading;
      btn.disabled = false;
      input.focus();
    }
    return;
  }

  // 文字发送：剧情有新进展（挂起的分隔信号）时开新会话并消费信号，再推送用户消息
  if (state.data.pendingSessionBreak) {
    state.chatSessionId++;
    state.chatSessionStartTime = Date.now();
    state.data.pendingSessionBreak = false;
  }

  // Normal send: add user message, AI replies once
  state.data.chatHistory.push({
    role: 'user', content: text,
    timestamp: Date.now(), sessionId: state.chatSessionId
  });
  input.value = '';
  autoResizeInput(input);
  saveToStorage();
  appendChatMessage(state.data.chatHistory.length - 1);

  state.isLoading = true;
  state.chatLoading = true;
  btn.disabled = true;

  try {
    showTypingIndicator();
    const reply = await callAI(finalText, 'chat');
    removeTypingIndicator();

    const cleanReply = reply.trim();
    if (cleanReply) {
      state.data.chatHistory.push({
        role: 'assistant', content: cleanReply,
        timestamp: Date.now(), sessionId: state.chatSessionId
      });
      appendChatMessage(state.data.chatHistory.length - 1);
      saveToStorage();
    }
  } catch(e) {
    removeTypingIndicator();
    showToast('AI回复失败：' + (e.message || '未知错误'));
    state.data.chatHistory.push({
      role: 'assistant', content: '（回复失败，请检查API配置）',
      timestamp: Date.now(), sessionId: state.chatSessionId
    });
    appendChatMessage(state.data.chatHistory.length - 1);
    saveToStorage();
  } finally {
    state.chatLoading = false;
    // isLoading 恢复为事件线的真实状态：事件仍在生成时保持 true，避免守卫误开
    state.isLoading = state.calendarLoading;
    btn.disabled = false;
    input.focus();
  }
}

/* ========== 消息操作（引用/删除） ========== */
function showMsgActions(idx) {
  // Remove any existing menu
  const existing = document.getElementById('msg-action-menu');
  if (existing) existing.remove();

  const msg = state.data.chatHistory[idx];
  if (!msg) return;

  const isMe = msg.role === 'user';
  const menu = document.createElement('div');
  menu.id = 'msg-action-menu';
  menu.className = 'msg-action-menu';
  // AI消息增加"重新生成"选项
  const regenBtn = !isMe
    ? `<button class="msg-action-item" onclick="regenerateMessage(${idx})">重新生成</button>`
    : '';
  menu.innerHTML = `
    ${regenBtn}
    <button class="msg-action-item" onclick="editMessage(${idx})">编辑</button>
    <button class="msg-action-item" onclick="deleteMessage(${idx})">删除</button>
  `;
  document.body.appendChild(menu);
  menu.classList.add('active');

  // Position near the clicked message
  const msgEl = document.querySelector(`.msg-row[data-idx="${idx}"]`);
  if (msgEl) {
    const rect = msgEl.getBoundingClientRect();
    const menuRect = menu.getBoundingClientRect();
    let top = rect.bottom + 4;
    if (top + menuRect.height > window.innerHeight - 10) {
      top = rect.top - menuRect.height - 4;
    }
    menu.style.top = top + 'px';
    if (isMe) {
      menu.style.right = (window.innerWidth - rect.right + 42) + 'px';
      menu.style.left = 'auto';
    } else {
      menu.style.left = (rect.left + 42) + 'px';
      menu.style.right = 'auto';
    }
  }
}

function closeMsgActions() {
  const menu = document.getElementById('msg-action-menu');
  if (menu) menu.remove();
}

function cancelQuote() {
  state.quoteContext = null;
  const quoteBar = document.getElementById('quote-bar');
  if (quoteBar) quoteBar.style.display = 'none';
}

function deleteMessage(idx) {
  const msg = state.data.chatHistory[idx];
  if (!msg) return;
  closeMsgActions();
  state.data.chatHistory.splice(idx, 1);
  saveToStorage();
  renderChat();
  showToast('已删除');
}

// 重新生成AI回复：移除该AI消息，找到上一条用户消息，重新调用AI
async function regenerateMessage(idx) {
  const msg = state.data.chatHistory[idx];
  if (!msg || msg.role !== 'assistant') return;
  // 聊天生成中禁止重生成（并发会产生重复的打字动画与乱序消息）
  if (state.chatLoading) return;
  closeMsgActions();

  // 找到这条AI回复对应的上一条用户消息
  let userInput = '';
  let userInputIdx = -1;
  for (let i = idx - 1; i >= 0; i--) {
    if (state.data.chatHistory[i].role === 'user') {
      userInput = state.data.chatHistory[i].content;
      userInputIdx = i;
      break;
    }
  }

  // 没有上一条用户消息 → 说明这是AI主动发的消息（如空发送触发）
  // 移除该AI消息后，用空发送的逻辑重新生成
  const isAiInitiated = userInputIdx === -1;

  // 从聊天记录中移除这条AI回复
  state.data.chatHistory.splice(idx, 1);
  saveToStorage();
  renderChat();

  // 显示typing并重新生成
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send-btn');
  state.isLoading = true;
  state.chatLoading = true;
  btn.disabled = true;
  showTypingIndicator();

  try {
    let reply;
    if (isAiInitiated) {
      // AI主动发的消息 → 重新让AI主动发一条
      reply = await callAI('（系统提示：刚刚发生了一些事，你主动给主控角色发了一条消息。请直接输出这条消息，不要加任何说明或引号，内容要贴合近期事件和你的性格，像平时发微信一样自然。）', 'chat');
    } else {
      // 用上一条用户消息重新调用AI
      reply = await callAI(userInput, 'chat');
    }
    removeTypingIndicator();
    const cleanReply = reply.trim();
    if (cleanReply) {
      state.data.chatHistory.push({
        role: 'assistant', content: cleanReply,
        timestamp: Date.now(), sessionId: state.chatSessionId
      });
      appendChatMessage(state.data.chatHistory.length - 1);
      saveToStorage();
    }
  } catch(e) {
    removeTypingIndicator();
    showToast('重新生成失败：' + (e.message || '未知错误'));
  } finally {
    state.chatLoading = false;
    // isLoading 恢复为事件线的真实状态：事件仍在生成时保持 true，避免守卫误开
    state.isLoading = state.calendarLoading;
    btn.disabled = false;
    input.focus();
  }
}
