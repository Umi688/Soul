  if (box) box.innerHTML = `<div class="calendar-loading" style="padding:8px;">重新生成<span class="dots"><span></span><span></span><span></span></span></div>`;

  // 暂时从 eventHistory 中移除当前事件，使 buildHistoryMessages 上下文
  // 只包含此事件之前的历史（上一条未删除的润色/叙事文本），避免当前事件自身干扰重新生成
  const evtIdx = state.data.eventHistory.indexOf(evt);
  state.data.eventHistory.splice(evtIdx, 1);

  try {
    if (side === 'ai') {
      if (evt.isSummary) {
        // 事件总结Retry：重新生成总结
        const calEvt = state.data.calendarEvents.find(e => e.id === evt.calendarEventId);
        if (calEvt) {
          const chainEvents = state.data.eventHistory.filter(e => e.calendarEventId === evt.calendarEventId && !e.isSummary && e.id !== evt.id);
          const _meName = (state.data.characters.me.name || '').trim() || '主控';
          const _otherName = (state.data.characters.other.name || '').trim() || 'AI角色';
          let eventContent = '';
          chainEvents.forEach(e => {
            if (e.polishedWish) eventContent += `【愿望】${e.polishedWish}\n`;
            if (e.aiNarrative) eventContent += `【叙事】${e.aiNarrative}\n`;
          });
          const summaryPrompt = `请根据以下关键事件的内容，生成一段事件总结（类似记忆卡片）。\n\n事件标题：${calEvt.title}\n事件简述：${calEvt.desc}\n\n事件内容：\n${eventContent}\n\n要求：\n1. 总结关键信息：重要事件、角色关系变化、人物状态演变。\n2. 尽量保留具体细节，如涉及的人物姓名、具体约定、关键道具、地点、转折点等，不要只写空泛的概括。\n3. 一段简洁的摘要，不超过400字。一律使用人物姓名指代——主控角色用"${_meName}"，AI角色用"${_otherName}"。\n4. 只记录已发生的事实，不加入推测或评价。\n5. 直接输出摘要正文，不要加任何标题、标记或说明。`;
          evt.aiNarrative = await callAI(summaryPrompt, 'memory');
          state.data.storyStateStale = true;
        }
      } else if (evt.isPrequel) {
        // 前置剧情Retry：重新生成场景铺垫
        const calEvt = state.data.calendarEvents.find(e => e.id === evt.calendarEventId);
        if (calEvt) {
          const _meName = (state.data.characters.me.name || '').trim() || '主控';
          const _otherName = (state.data.characters.other.name || '').trim() || 'AI角色';
          const prequelPrompt = `请为以下关键事件生成一段前置剧情（场景铺垫），为正式事件的发生做铺垫。\n\n事件标题：${calEvt.title}\n事件简述：${calEvt.desc}\n事件日期：${calEvt.date}\n\n要求：\n1. 严格使用第三人称叙述，指代主控角色用"${_meName}"，指代AI角色用"${_otherName}"。\n2. 描写事件发生前的场景、氛围、人物状态，自然引向事件的发生。\n3. 不要直接复述事件简述，而是展开事件发生前的细节。\n4. 200-400字，段落间用换行分隔。\n5. 心理活动用「」括起来，对话内容用""括起来。\n6. 只输出叙事文段，不加任何说明。`;
          evt.aiNarrative = await callAI(prequelPrompt, 'event');
          const parsed = parseNarrativeAndState(evt.aiNarrative);
          evt.aiNarrative = parsed.narrative;
          state.data.storyStateStale = true;
        }
      } else {
        // 叙事Retry：与 sendEventWish 的原始生成逻辑一致
        // 基于玩家的愿望 + 当前的润色文本（若已被删除则只用愿望），从上一条未删除文本之后继续推进
        const polished = evt.polishedWish || '';
        const wish = evt.wish || evt.polishedWish || '';
        let prompt;
        if (polished) {
          prompt = `【玩家的剧情愿望】\n<用户输入>${wish}</用户输入>\n\n【润色后的愿望文本（仅供参考，不要复述其中内容）】\n${polished}\n\n请基于玩家的愿望推进剧情，生成第三人称叙事文段。叙事必须从润色文本结束的地方继续推进，展开新的动作、对话、场景或情节发展，严禁复述或重复润色文本中已写过的任何句子、段落或场景描写。`;
        } else {
          prompt = `【玩家的剧情愿望】\n<用户输入>${wish}</用户输入>\n\n请基于玩家的愿望推进剧情，生成第三人称叙事文段。`;
        }
        evt.aiNarrative = await callAI(prompt, 'event');
        // 清洗叙事文本（防止AI残留 |||STATE||| 等标记）
        const parsed = parseNarrativeAndState(evt.aiNarrative);
        evt.aiNarrative = parsed.narrative;
        // 标记快照过期：下次文字聊天时重新提炼
        state.data.storyStateStale = true;
      }
    } else {
      // 润色Retry：基于玩家投递的叙事愿望，从上一条未删除的文本之后自然衔接
      const wish = evt.wish || evt.polishedWish || '';
      evt.polishedWish = await callAI(wish, 'polish');
    }
    // 恢复当前事件到 eventHistory 原位置
    state.data.eventHistory.splice(evtIdx, 0, evt);
    saveToStorage();
    // Only update the single card body (no full re-render)
    if (box) {
      const body = side === 'ai' ? evt.aiNarrative : evt.polishedWish;
      box.innerHTML = body ? formatNarrativeText(body) : '<span style="color:var(--text-faint);font-style:italic;">（已删除）</span>';
    }
  } catch(e) {
    // 恢复当前事件到 eventHistory 原位置
    state.data.eventHistory.splice(evtIdx, 0, evt);
    showToast('重新生成失败：' + (e.message || '未知错误'));
    // Restore original content on failure
    if (box) {
      const body = side === 'ai' ? evt.aiNarrative : evt.polishedWish;
      box.innerHTML = body ? formatNarrativeText(body) : '<span style="color:var(--text-faint);font-style:italic;">（已删除）</span>';
    }
  } finally {
    state.isLoading = false;
  }
}

function deleteNarrative(evtId, side) {
  const evt = state.data.eventHistory.find(e => e.id === evtId);
  const sideText = (side === 'ai' && evt && evt.isSummary) ? '事件总结' : (side === 'ai' && evt && evt.isPrequel) ? '前置剧情' : (side === 'ai' ? '叙事' : '愿望');
  showModal(`
    <div class="modal">
      <div class="modal-header">删除${sideText}</div>
      <div class="modal-body" style="text-align:center;color:var(--text-dim);font-size:13px;">
        确定要删除这条${sideText}吗？删除后不可恢复。
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="closeModal();doDeleteNarrative('${evtId}','${side}')">确认删除</button>
      </div>
    </div>
  `);
}

function doDeleteNarrative(evtId, side) {
  const evt = state.data.eventHistory.find(e => e.id === evtId);
  if (!evt) return;
  // Clear the deleted side's content
  if (side === 'ai') {
    evt.aiNarrative = '';
  } else {
    evt.polishedWish = '';
    evt.wish = '';
  }

  // Remove the corresponding card element from DOM (no full re-render)
  const blockEl = document.querySelector(`.narrative-block[data-id="${evtId}"]`);
  if (blockEl) {
    const cardEl = blockEl.querySelector(side === 'ai' ? '.narr-card.ai' : '.narr-card.player');
    if (cardEl) cardEl.remove();
  }

  // If both sides are now empty, remove the entire event block from data
  if (!evt.polishedWish && !evt.wish && !evt.aiNarrative) {
    const idx = state.data.eventHistory.findIndex(e => e.id === evtId);
    if (idx !== -1) state.data.eventHistory.splice(idx, 1);
    if (blockEl) blockEl.remove();
  }
  saveToStorage();
  showToast('已删除');
}

/* ========== 记忆页（羁绊） ========== */
function renderMemory() {
  const container = document.getElementById('memory-cards');
  if (!container) return;

  // 事件推进视图：渲染前置剧情 + 叙事卡片
  if (state.activeCalendarEvent) {
    let html = '';
    // 优先从归档事件链读取，否则从当月 eventHistory 读取
    const chainEvents = state.archiveEventChain
      ? state.archiveEventChain
      : state.data.eventHistory.filter(e => e.calendarEventId === state.activeCalendarEvent);
    if (chainEvents.length === 0) {
      html += '<div class="memory-empty">该事件暂无剧情内容</div>';
    } else {
      chainEvents.forEach(evt => {
        html += buildEventBlockHtml(evt);
      });
    }
    html += `<div id="calendar-state-ui">${buildCalendarStateHtml()}</div>`;
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
    renderMemoryEventInput();
    return;
  }

  // 查看归档月份的时间轴
  if (state.viewingArchiveMonth) {
    renderMemoryArchivedTimeline(state.viewingArchiveMonth);
    return;
  }

  // 过往记忆档案视图
  if (state.memoryArchiveMode) {
    renderMemoryArchive(container);
    restoreMemoryActions();
    return;
  }

  // 时间轴事件视图
  const events = state.data.calendarEvents || [];

  if (!events.length) {
    container.innerHTML = `<div class="memory-empty">暂无时间轴事件<br><span style="font-size:11px;color:rgba(58,111,165,0.7)">点击下方按钮生成事件</span></div>`;
    restoreMemoryActions();
    return;
  }

  let html = '<div class="calendar-timeline">';
  events.forEach(evt => {
    const keyClass = evt.isKey ? ' key' : '';
    const advancedClass = evt.advanced ? ' advanced' : '';
    const keyBadge = evt.isKey
      ? (evt.advanced
        ? '<span class="calendar-event-badge done">已推进</span>'
        : '<span class="calendar-event-badge">关键剧情</span>')
      : '';
    // 关键剧情：整个卡片可点击进入（已推进的也可查看）
    const clickable = evt.isKey;
    const clickAttr = clickable ? ` onclick="openCalendarKeyEvent('${evt.id}')"` : '';
    const clickableClass = clickable ? ' clickable' : '';
    // 已推进的事件：显示事件总结（优先用 evt.summary，旧数据回退查 eventHistory）
    let summaryText = '';
    if (evt.isKey && evt.advanced) {
      if (evt.summary) {
        summaryText = evt.summary;
      } else {
        const summaryEvt = (state.data.eventHistory || []).find(
          e => e.calendarEventId === evt.id && e.isSummary
        );
        if (summaryEvt) {
          summaryText = summaryEvt.aiNarrative || '';
          // 回写到事件本身，下次不用再查
          evt.summary = summaryText;
        }
      }
    }
    const summaryHtml = summaryText
      ? `<div class="calendar-event-summary">${escapeHtml(summaryText)}</div>`
      : '';
    html += `
      <div class="calendar-event${keyClass}${advancedClass}${clickableClass}"${clickAttr}>
        <div class="calendar-event-dot"></div>
        <div class="calendar-event-body">
          <div class="calendar-event-date-row">
            <span class="calendar-event-date">${escapeHtml(evt.date)}</span>
            ${keyBadge}
          </div>
          <div class="calendar-event-desc">${escapeHtml(evt.desc)}</div>
          ${summaryHtml}
        </div>
      </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
  restoreMemoryActions();
}

// 恢复羁绊页底部操作栏为默认「至下一月」按钮
function restoreMemoryActions() {
  const actionsArea = document.getElementById('memory-actions');
  if (!actionsArea) return;
  actionsArea.classList.remove('input-bar');
  actionsArea.innerHTML = '<button class="memory-action-btn" id="improve-memory-btn" onclick="advanceToNextMonth()">至下一月</button>';
}

// 羁绊页事件视图输入栏（复用日历事件输入逻辑，渲染到 memory-actions）
function renderMemoryEventInput() {
  const actionsArea = document.getElementById('memory-actions');
  if (!actionsArea) return;
  // 只读模式：已推进的事件不再投递愿望，不显示输入栏
  if (state.eventState === 'readonly') {
    actionsArea.classList.remove('input-bar');
    actionsArea.innerHTML = '';
    return;
  }
  if (state.activeCalendarEvent && (state.eventState === 'idle' || state.eventState === 'active' || state.eventState === 'input' || state.eventState === 'ended')) {
    const placeholder = state.eventState === 'active' ? '继续投递剧情愿望...' : '写下你的剧情愿望...';
    actionsArea.classList.add('input-bar');
    actionsArea.innerHTML = `
      <textarea id="event-input" rows="1" placeholder="${placeholder}" oninput="autoResizeInput(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();sendCalendarEventWish()}"></textarea>
      <button onmousedown="event.preventDefault()" onclick="sendCalendarEventWish()">投递</button>
    `;
  } else {
    actionsArea.classList.remove('input-bar');
    actionsArea.innerHTML = '';
  }
}

// 羁绊页头部按钮切换：事件视图时左上角变为返回箭头、右上角显示保存按钮
function updateMemoryHeaderButtons() {
  const fsBtn = document.getElementById('memory-fs-btn');
  const refreshBtn = document.getElementById('memory-refresh-btn');
  const archiveBtn = document.getElementById('memory-archive-btn');
  const saveBtn = document.getElementById('memory-save-btn');
  const titleEl = document.getElementById('memory-title');
  const inEvent = !!state.activeCalendarEvent;
  const inArchive = state.memoryArchiveMode || !!state.viewingArchiveMonth;

  // 左上角按钮：事件视图时变为返回箭头，其余恢复菜单图标
  const ICON_NAV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>';
  const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';
  if (fsBtn) {
    if (inEvent) {
      fsBtn.innerHTML = ICON_BACK;
      fsBtn.setAttribute('onclick', "exitCalendarKeyEvent()");
      fsBtn.title = '返回';
    } else {
      fsBtn.innerHTML = ICON_NAV;
      fsBtn.setAttribute('onclick', 'openNav()');
      fsBtn.title = '剧本列表';
    }
  }

  if (refreshBtn) refreshBtn.style.display = (inEvent || inArchive) ? 'none' : '';
  if (archiveBtn) archiveBtn.style.display = inEvent ? 'none' : '';
  if (saveBtn) {
    // 保存按钮：仅在当月事件视图且事件未推进时显示
    if (inEvent && !state.archiveEventChain) {
      const calEvt = state.data.calendarEvents.find(e => e.id === state.activeCalendarEvent);
      if (calEvt && calEvt.advanced) {
        // 已保存：隐藏保存按钮，用返回按钮退出
        saveBtn.style.display = 'none';
      } else {
        saveBtn.style.display = '';
        saveBtn.title = '保存结束';
      }
    } else {
      saveBtn.style.display = 'none';
    }
  }
  if (titleEl) {
    if (inEvent) titleEl.textContent = '关键剧情';
    else if (state.viewingArchiveMonth) titleEl.textContent = state.viewingArchiveMonth;
    else if (state.memoryArchiveMode) titleEl.textContent = '过往羁绊';
    else titleEl.textContent = '羁绊';
  }
}

// 退出关键事件视图（不生成总结，可再次进入）
function exitCalendarKeyEvent() {
  if (state.isLoading) { showToast('正在生成中，请稍后再试'); return; }
  state.activeCalendarEvent = null;
  state.currentChainId = null;
  state.archiveEventChain = null;
  state.eventState = 'idle';
  updateMemoryHeaderButtons();
  renderMemory();
}

// 过往羁绊档案视图：按月归档的卡片列表，点击进入当月时间轴+记忆卡片
function renderMemoryArchive(container) {
  const currentMonth = state.data.calendarMonth || '';
  const archives = (state.data.memoryArchives || []).filter(a => a.month !== currentMonth);
  if (!archives.length) {
    container.innerHTML = `<div class="memory-empty">暂无过往羁绊<br><span style="font-size:11px;color:rgba(58,111,165,0.7)">推进月份后过往羁绊会自动归档</span></div>`;
    return;
  }
  const months = [...archives].reverse(); // 最近的在上

  let html = '<div class="memory-archive-list">';
  months.forEach(a => {
    const cardCount = (a.cards || []).length;
    const evtCount = (a.events || []).length;
    const preview = cardCount > 0
      ? (a.cards[0].content || '').substring(0, 40) + (a.cards[0].content.length > 40 ? '…' : '')
      : (evtCount > 0 ? a.events[0].title + '等' + evtCount + '条事件' : '点击查看');
    html += `
      <div class="memory-archive-card" onclick="viewArchivedMonth('${a.month}')">
        <div class="memory-archive-month">${escapeHtml(a.month)}</div>
        <div class="memory-archive-preview">${escapeHtml(preview)}</div>
      </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

// 查看某月的归档时间轴
function viewArchivedMonth(month) {
  // 在羁绊页内显示该月的时间轴事件
  state.viewingArchiveMonth = month;
  state.memoryArchiveMode = false;
  updateMemoryHeaderButtons();
  renderMemoryArchivedTimeline(month);
}

// 渲染归档月份的羁绊内容（时间轴事件 + 记忆卡片，仅来自 memoryArchives）
function renderMemoryArchivedTimeline(month) {
  const container = document.getElementById('memory-cards');
  if (!container) return;

  // 仅从羁绊页自己的归档中查找
  const archive = (state.data.memoryArchives || []).find(a => a.month === month);
  if (!archive) {
    container.innerHTML = `<div class="memory-archive-header"><button class="memory-archive-back" onclick="exitArchivedMonth()">返回</button><span>${escapeHtml(month)}</span></div><div class="memory-empty">该月无归档数据</div>`;
    return;
  }
  const events = archive.events || [];
  const cards = archive.cards || [];

  let html = `<div class="memory-archive-header">
    <button class="memory-archive-back" onclick="exitArchivedMonth()">返回</button>
    <span>${escapeHtml(month)}</span>
  </div>`;

  // 显示该月的记忆卡片
  if (cards.length) {
    html += '<div class="memory-archive-section-title">记忆卡片</div>';
    html += '<div class="memory-archive-cards">';
    cards.forEach(card => {
      html += `<div class="memory-card-item"><div class="memory-card-content">${escapeHtml(card.content || '')}</div></div>`;
    });
    html += '</div>';
  }

  // 显示该月的时间轴事件
  if (events.length) {
    html += '<div class="memory-archive-section-title">时间轴</div>';
    html += '<div class="calendar-timeline">';
    events.forEach(evt => {
      const keyClass = evt.isKey ? ' key' : '';
      const advancedClass = evt.advanced ? ' advanced' : '';
      const keyBadge = evt.isKey
        ? (evt.advanced
          ? '<span class="calendar-event-badge done">已推进</span>'
          : '<span class="calendar-event-badge">关键剧情</span>')
        : '';
      const clickable = evt.isKey;
      const clickAttr = clickable ? ` onclick="openCalendarKeyEvent('${evt.id}','${escapeHtml(month)}')"` : '';
      const clickableClass = clickable ? ' clickable' : '';
      const summaryHtml = (evt.isKey && evt.advanced && evt.summary)
        ? `<div class="calendar-event-summary">${escapeHtml(evt.summary)}</div>`
        : '';
      html += `
        <div class="calendar-event${keyClass}${advancedClass}${clickableClass}"${clickAttr}>
          <div class="calendar-event-dot"></div>
          <div class="calendar-event-body">
            <div class="calendar-event-date-row">
              <span class="calendar-event-date">${escapeHtml(evt.date)}</span>
              ${keyBadge}
            </div>
            <div class="calendar-event-desc">${escapeHtml(evt.desc)}</div>
            ${summaryHtml}
          </div>
        </div>`;
    });
    html += '</div>';
  }

  if (!cards.length && !events.length) {
    html += '<div class="memory-empty">该月无归档数据</div>';
  }

  container.innerHTML = html;
}

// 退出归档月份查看
function exitArchivedMonth() {
  state.viewingArchiveMonth = null;
  state.memoryArchiveMode = true;
  updateMemoryHeaderButtons();
  renderMemory();
}

// 切换过往羁绊视图
function toggleMemoryArchive() {
  state.memoryArchiveMode = !state.memoryArchiveMode;
  state.viewingArchiveMonth = null;
  updateMemoryHeaderButtons();
  renderMemory();
}

// 保存并结束关键事件：生成事件总结，标记已推进（可查看但不能再投递愿望）
async function saveCalendarKeyEvent() {
  if (state.isLoading) { showToast('正在生成中，请稍后再保存'); return; }
  if (!state.activeCalendarEvent) return;

  const calEvt = state.data.calendarEvents.find(e => e.id === state.activeCalendarEvent);
  if (!calEvt) return;

  // 已推进的事件：忽略保存操作
  if (calEvt.advanced) return;

  // 检查是否有实际内容（前置剧情或玩家投递）
  const chainEvents = state.data.eventHistory.filter(e => e.calendarEventId === state.activeCalendarEvent);
  if (!chainEvents.length) {
    showToast('暂无内容可保存');
    return;
  }

  state.isLoading = true;
  state.eventState = 'generating';
  updateMemoryHeaderButtons();
  renderMemory();

  try {
    // 收集事件链内容用于总结
    const _meName = (state.data.characters.me.name || '').trim() || '主控';
    const _otherName = (state.data.characters.other.name || '').trim() || 'AI角色';
    let eventContent = '';
    chainEvents.forEach(e => {
      if (e.polishedWish) eventContent += `【愿望】${e.polishedWish}\n`;
      if (e.aiNarrative) eventContent += `【叙事】${e.aiNarrative}\n`;
    });

    const summaryPrompt = `请根据以下关键事件的内容，生成一段事件总结（类似记忆卡片）。\n\n事件标题：${calEvt.title}\n事件简述：${calEvt.desc}\n\n事件内容：\n${eventContent}\n\n要求：\n1. 总结关键信息：重要事件、角色关系变化、人物状态演变。\n2. 尽量保留具体细节，如涉及的人物姓名、具体约定、关键道具、地点、转折点等，不要只写空泛的概括。\n3. 一段简洁的摘要，不超过400字。一律使用人物姓名指代——主控角色用"${_meName}"，AI角色用"${_otherName}"。\n4. 只记录已发生的事实，不加入推测或评价。\n5. 直接输出摘要正文，不要加任何标题、标记或说明。`;

    const summary = await callAI(summaryPrompt, 'memory');

    // 将总结作为事件总结存入事件链
    state.data.eventHistory.push({
      id: 'summary_' + Date.now(),
      chainId: state.currentChainId,
      calendarEventId: state.activeCalendarEvent,
      wish: '',
      polishedWish: '',
      aiNarrative: summary,
      isSummary: true,
      timestamp: Date.now()
    });

    // 标记关键事件已推进，并存储总结到事件本身
    calEvt.advanced = true;
    calEvt.summary = summary;
    state.data.storyStateStale = true;

    // 将总结添加到记忆卡片
    state.data.memoryCards.push({
      id: 'mc_' + Date.now(),
      content: summary,
      timestamp: Date.now()
    });

    saveToStorage();
    state.isLoading = false;
    state.eventState = 'readonly';

    // 渲染带总结的事件视图，保存按钮隐藏，用返回按钮退出
    updateMemoryHeaderButtons();
    renderMemory();
    showToast('已保存事件总结');
  } catch (err) {
    console.error('事件总结生成失败:', err);
    state.isLoading = false;
    state.eventState = 'idle';
    renderMemory();
    showToast('总结生成失败，请重试');
  }
}

// 推进到下一月（羁绊页「至下一月」按钮）
async function advanceToNextMonth() {
  if (state.isLoading) { showToast('正在生成中，请稍后再试'); return; }
  state.isLoading = true;
  state.eventState = 'generating';
  state.activeCalendarEvent = null;
  state.memoryArchiveMode = false;
  updateMemoryHeaderButtons();

  const refreshBtn = document.getElementById('memory-refresh-btn');
  if (refreshBtn) refreshBtn.classList.add('loading');

  const container = document.getElementById('memory-cards');
  if (container) container.innerHTML = `<div class="calendar-loading" style="padding:60px 0;">推进至下一月<span class="dots"><span></span><span></span><span></span></span></div>`;

  const calContainer = document.getElementById('calendar-content');
  if (calContainer) calContainer.innerHTML = `<div class="calendar-loading" style="padding:60px 0;">推进至下一月<span class="dots"><span></span><span></span><span></span></span></div>`;

  try {
    // 生成新快照（确保归档前和下月内容都基于最新剧情）
    try {
      const snapshot = await generateStoryStateSnapshot();
      if (snapshot) { state.data.storyState = snapshot; state.data.storyStateStale = false; saveToStorage(); }
    } catch(e) {
      console.error('[至下一月] 快照生成失败，使用旧快照', e);
    }

    // 1. 生成当前月晨报（归档前生成，确保有内容）
    const currentMonth = state.data.calendarMonth || '第1年1月';
    if (!state.data.calendarMonthReport && state.data.calendarEvents.length > 0) {
      try {
        const reportCtx = buildMonthlyContextForCalendar();
        const reportRaw = await callAI(`请生成${currentMonth}的晨报。${reportCtx}`, 'calendarReport');
        state.data.calendarMonthReport = reportRaw.trim();
      } catch(e) {
        console.error('晨报生成失败:', e);
      }
    }

    const currentCards = state.data.memoryCards || [];

    // 羁绊页归档：时间轴事件 + 记忆卡片 + 事件链历史（属于羁绊页面）
    if (state.data.calendarEvents.length > 0 || currentCards.length > 0) {
      // 归档当前月的事件链历史（关键事件的剧情内容）
      const currentEventIds = state.data.calendarEvents.map(e => e.id);
      const archivedEventHistory = state.data.eventHistory.filter(
        e => currentEventIds.includes(e.calendarEventId)
      );
      state.data.memoryArchives.push({
        id: 'ma_' + Date.now(),
        month: currentMonth,
        events: JSON.parse(JSON.stringify(state.data.calendarEvents)),
        cards: JSON.parse(JSON.stringify(currentCards)),
        eventHistory: JSON.parse(JSON.stringify(archivedEventHistory))
      });
    }

    // 晨报页归档：晨报 + 日历内容（备忘录/通知/餐食/舆论/关系/新闻）
    if (state.data.calendarMonthReport || (state.data.calendarMemos && state.data.calendarMemos.length) || (state.data.calendarNotifications && state.data.calendarNotifications.length)) {
      state.data.calendarArchives.push({
        id: 'ca_' + Date.now(),
        month: currentMonth,
        monthReport: state.data.calendarMonthReport || '',
        memos: JSON.parse(JSON.stringify(state.data.calendarMemos || [])),
        notifications: JSON.parse(JSON.stringify(state.data.calendarNotifications || [])),
        menu: JSON.parse(JSON.stringify(state.data.calendarMenu || [])),
        social: JSON.parse(JSON.stringify(state.data.calendarSocial || [])),
        connections: JSON.parse(JSON.stringify(state.data.calendarConnections || [])),
        dailyNews: JSON.parse(JSON.stringify(state.data.calendarDailyNews || []))
      });
    }

    // 2. 计算下一月
    const nextMonth = incrementGameMonth(currentMonth);
    // 备份旧月份，事件生成失败时回滚
    const oldMonth = state.data.calendarMonth;
    const oldStartedAt = state.data.calendarMonthStartedAt;
    state.data.calendarMonth = nextMonth;
    state.data.calendarMonthStartedAt = Date.now();

    // 3. 生成新一月的时间轴事件
    let events = [];
    try {
      const eventsCtx = buildMonthlyContextForCalendar();
      const eventsRaw = await callAI(`请生成${nextMonth}的时间轴事件。所有日期须使用"${nextMonth}"中的年份和月份，格式为"第X年X月X日"。${eventsCtx}`, 'calendarEvents');
      const lines = eventsRaw.trim().split('\n').filter(l => l.trim());
      lines.forEach((line, i) => {
        const parts = line.split('|||').map(s => s.trim());
        if (parts.length >= 3) {
          events.push({
            id: 'cal_' + Date.now() + '_' + i,
            date: parts[0],
            title: parts[1],
            desc: parts[2],
            isKey: (parts[3] || '').toLowerCase() === 'key',
            advanced: false
          });
        }
      });
    } catch(e) {
      console.error('[至下一月] 时间轴事件生成失败，回滚月份:', e);
      // 恢复旧月份，保留旧数据
      state.data.calendarMonth = oldMonth;
      state.data.calendarMonthStartedAt = oldStartedAt;
      saveToStorage();
      showToast('时间轴事件生成失败，已恢复，请重试');
      return;
    }

    // 事件生成成功，替换当月数据
    state.data.calendarEvents = events;
    state.data.calendarMonthReport = '';
    // 清空当月羁绊数据（已归档）
    state.data.memoryCards = [];
    // 清空当月事件链历史（已归档）
    state.data.eventHistory = [];
    // 清空当月晨报数据（已归档），下月需重新生成
    state.data.calendarMemos = [];
    state.data.calendarNotifications = [];
    state.data.calendarMenu = [];
    state.data.calendarSocial = [];
    state.data.calendarConnections = [];
    state.data.calendarDailyNews = [];
    state.data.storyStateStale = true;
    saveToStorage();

    // 4. 生成新一月的晨报内容（失败不中断，用户可后续刷新）
    try {
      await _generateCalendarContent(nextMonth);
    } catch(e) {
      console.error('[至下一月] 晨报内容生成失败，用户可手动刷新:', e);
      showToast('月份已推进，晨报内容生成失败，请点击刷新按钮重试');
    }

    showToast('已推进至' + nextMonth);
  } catch(e) {
    showToast('生成失败：' + (e.message || '未知错误'));
  } finally {
    state.isLoading = false;
    state.eventState = 'idle';
    const refreshBtn2 = document.getElementById('memory-refresh-btn');
    if (refreshBtn2) refreshBtn2.classList.remove('loading');
    renderMemory();
    renderCalendar();
  }
}

// 游戏月份递增：解析"第x年y月"→"第x年(y+1)月"，y=12时进位
function incrementGameMonth(monthStr) {
  const m = monthStr.match(/第(\d+)年(\d+)月/);
  if (!m) return '第1年1月';
  let year = parseInt(m[1]);
  let month = parseInt(m[2]);
  month++;
  if (month > 12) { month = 1; year++; }
  return `第${year}年${month}月`;
}

    : '';
  const nameHtml = ch.name
    ? escapeHtml(ch.name)

  const linerHtml = ch.oneLiner
    ? escapeHtml(ch.oneLiner)
    : `<span style="opacity:0.4">暂无介绍</span>`;
  return `
    <div class="char-block" onclick="openCharacterEditor('${type}')">

}

function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showToast('请选择图片文件');
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    showToast('图片不能超过5MB');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    // Compress avatar via canvas to keep localStorage small
    // Use PNG (lossless) at 400px for retina sharpness — ~50-150KB typically
    const img = new Image();
    img.onload = function() {
      const maxDim = 400;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      // 压缩为有损格式：WebP > JPEG > PNG 兜底。
      // 之前用无损 PNG，照片类头像常达 100-300KB base64，
      // 头像会被存进每条消息渲染与每次自动保存的序列化里，体积直接放大卡顿感。
      // WebP/JPEG 0.85 通常只有 20-60KB，画质在 400px 头像尺寸下无肉眼差异。
      let compressed = canvas.toDataURL('image/webp', 0.85);
      if (!compressed.startsWith('data:image/webp')) {
        compressed = canvas.toDataURL('image/jpeg', 0.85);
        if (!compressed.startsWith('data:image/jpeg')) compressed = canvas.toDataURL('image/png');
      }
      const frame = document.querySelector('.avatar-frame');
      if (frame) {
        frame.innerHTML = `<img src="${compressed}" alt="头像"><div class="avatar-frame-hint">更换头像</div>`;
      }
      // Only update a temporary preview variable; commit to state.data on saveCharacter()
      if (editorCharType) {
        editorPendingAvatar = compressed;
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function saveCharacter(type) {
  // 读取表单字段
  const fields = {
    name: document.getElementById('char-name').value.trim(),
    gender: document.getElementById('char-gender').value.trim(),
    age: document.getElementById('char-age').value.trim(),
    identity: document.getElementById('char-identity').value.trim(),
    oneLiner: document.getElementById('char-oneliner').value.trim(),
    appearance: document.getElementById('char-appearance').value.trim(),
    personality: document.getElementById('char-personality').value.trim(),
    background: document.getElementById('char-background').value.trim(),
    other: document.getElementById('char-other').value.trim()
  };
  if (editorPendingAvatar !== null) fields.avatar = editorPendingAvatar;

  if (type === 'me' || type === 'other') {
    const c = state.data.characters[type];
    c.name = fields.name || c.name;
    c.gender = fields.gender; c.age = fields.age; c.identity = fields.identity;
    c.oneLiner = fields.oneLiner; c.appearance = fields.appearance;
    c.personality = fields.personality; c.background = fields.background; c.other = fields.other;
    if (fields.avatar !== undefined) c.avatar = fields.avatar;
  } else if (type === 'npc') {
    if (editorNpcId) {
      // 编辑已有NPC
      const npc = state.data.characters.npcs.find(n => n.id === editorNpcId);
      if (npc) {
        npc.name = fields.name || npc.name;
        npc.gender = fields.gender; npc.age = fields.age; npc.identity = fields.identity;
        npc.oneLiner = fields.oneLiner; npc.appearance = fields.appearance;
        npc.personality = fields.personality; npc.background = fields.background; npc.other = fields.other;
        if (fields.avatar !== undefined) npc.avatar = fields.avatar;
        // 若编辑的是当前激活NPC，同步到工作副本
        if (editorNpcId === state.data.activeNpcId) syncActiveNpcToOther();
      }
    } else {
      // 新增NPC
      if (!fields.name) {
        showToast('请填写姓名');
        return;
      }
      const newId = 'npc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      const npc = Object.assign({ id: newId }, fields);
      state.data.characters.npcs.push(npc);
      // 若当前没有激活NPC，自动激活新建的
      if (!state.data.activeNpcId) {
        state.data.activeNpcId = newId;
        syncActiveNpcToOther();
        state.data.chatHistory = [];
      }
    }
  }

  editorPendingAvatar = null;
  editorNpcId = null;
  saveToStorage();
  closeModal();
  applyChatAvatarVars();
  renderSettings();
  if (state.currentTab === 'chat') renderChat();
  renderNavCharList();
  showToast('人设已保存');
}

// 拉取平台下属模型列表
async function fetchModels() {
  const urlEl = document.getElementById('api-baseurl');
  const keyEl = document.getElementById('api-key');
  const statusEl = document.getElementById('fetch-models-status');
  const btn = document.getElementById('fetch-models-btn');
  const baseUrl = urlEl ? urlEl.value.trim() : '';
  const apiKey = keyEl ? keyEl.value.trim() : '';

  if (!baseUrl) { showToast('请先填写平台地址'); return; }
  if (!apiKey) { showToast('请先填写 API Key'); return; }

  btn.disabled = true;
  if (statusEl) statusEl.textContent = '拉取中…';

  try {
    const models = await fetchModelList(baseUrl, apiKey);
    // 同步保存到运行时：apiKey、baseUrl、models、model
    // 这样即使用户未点"保存"就关闭，内存中的配置也是完整的
    state.data.apiConfig.apiKey = apiKey;
    state.data.apiConfig.baseUrl = baseUrl;
    state.data.apiConfig.models = models;
    // 若当前 model 不在列表里，默认选第一个
    if (models.length > 0 && !models.includes(state.data.apiConfig.model)) {
      state.data.apiConfig.model = models[0];
    }
    if (statusEl) statusEl.textContent = `拉取成功，共 ${models.length} 个模型`;
    // 重新渲染模型字段为下拉框
    const cfg = state.data.apiConfig;
    const options = models.map(m =>
      `<option value="${escapeHtml(m)}" ${cfg.model === m ? 'selected' : ''}>${escapeHtml(m)}</option>`
    ).join('');
    const modelWrap = btn.parentElement.querySelector('#api-model');
    if (modelWrap) {
      const select = document.createElement('select');
      select.className = 'form-input';
      select.id = 'api-model';
      select.innerHTML = options;
      modelWrap.replaceWith(select);
    }
    showToast('已拉取 ' + models.length + ' 个模型');
  } catch(e) {
    if (statusEl) statusEl.textContent = '拉取失败：' + (e.message || '未知错误') + '（可手填模型名）';
    showToast('拉取失败，可手填模型名');
  } finally {
    btn.disabled = false;
  }
}

function saveApiConfig() {
  const cfg = state.data.apiConfig;
  const keyEl = document.getElementById('api-key');
  const modelEl = document.getElementById('api-model');
  const urlEl = document.getElementById('api-baseurl');
  const tempEl = document.getElementById('api-temperature');

function exportData() {
  try {
    const backup = {
      _type: 'soul_full_backup',
      _version: APP_VERSION,
      _exportTime: Date.now(),
      currentData: state.data,
      // 多角色档案：全部角色 + 全局配置（存档系统已移除，进度实时保存在角色档案中）
      profiles: {
        order: profiles.order,
        activeId: profiles.activeId,
        globals: profiles.globals,
        meta: profiles.meta,
        data: profiles.data
      }
    };
    const jsonStr = JSON.stringify(backup, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `soul_backup_${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('数据已导出');
    closeModal();
  } catch(e) {
    console.error('导出失败', e);
    showToast('导出失败：' + e.message);
  }
}

// exportSavesOnly 已随存档系统一并移除

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const backup = JSON.parse(e.target.result);
      if (!backup._type || !(backup._type.startsWith('soul_') || backup._type.startsWith('echo_'))) {
        showToast('文件格式不正确，请选择Soul备份文件');
        return;
      }

      let importMsg = '';

      // 恢复多角色档案（新格式备份）：合并角色，同名ID覆盖
      // 注：存档系统已移除，旧备份中的 saves 字段不再恢复（进度都在角色档案里）
      if (backup.profiles && backup.profiles.data) {
        const inc = backup.profiles;
        Object.keys(inc.data).forEach(id => {
          profiles.data[id] = inc.data[id];
          profiles.meta[id] = (inc.meta && inc.meta[id]) || profiles.meta[id] ||
            { name: '', avatar: '', createdAt: Date.now(), updatedAt: Date.now() };
        });
        (Array.isArray(inc.order) ? inc.order : []).forEach(id => {
          if (profiles.data[id] && !profiles.order.includes(id)) profiles.order.push(id);
        });
        if (inc.globals) {
          if (inc.globals.apiConfig) profiles.globals.apiConfig = inc.globals.apiConfig;
          if (Array.isArray(inc.globals.globalRules)) profiles.globals.globalRules = inc.globals.globalRules;
        }
        if (!profiles.activeId && profiles.order.length) profiles.activeId = profiles.order[0];
        persistProfiles();
        if (profiles.activeId) {
          loadProfileIntoState(profiles.activeId);
          resetRuntimeState();
          saveToStorage();
          applyBgImage();
          enterChatMain();
        } else {
          renderNavCharList();
        }
        importMsg += (importMsg ? '；' : '') + '角色数据已恢复（' + Object.keys(inc.data).length + '个角色）';
        closeModal();
        showToast(importMsg);
        return;
      }

      // 恢复当前游戏数据（旧格式备份兼容）
      if (backup.currentData && (backup._type === 'soul_full_backup' || backup._type === 'echo_full_backup') && !backup.profiles) {
        showModal(`
          <div class="modal">
            <div class="modal-header">确认导入当前数据</div>
            <div class="modal-body" style="padding:20px;text-align:center;">
              <p style="font-size:13px;color:var(--text-dim);margin:0;line-height:1.6;">
                检测到备份中包含当前游戏进度数据。<br>
                导入将<strong style="color:var(--gold);">覆盖当前游戏数据</strong>，是否继续？
              </p>
            </div>
            <div class="modal-footer">
              <button class="modal-btn" onclick="closeModal()">取消</button>
              <button class="modal-btn primary" onclick="confirmImportCurrentData()">确认覆盖</button>
            </div>
          </div>
        `);
        // 暂存备份数据供确认后使用
        window._pendingImportData = backup.currentData;
        return;
      }

      if (importMsg) {
        showToast(importMsg);
      }
      closeModal();
    } catch(err) {
      console.error('导入失败', err);
      showToast('导入失败：文件解析错误');
    }
  };
  reader.readAsText(file);
  // 清空 input，允许再次选择同一文件
  event.target.value = '';
}

function confirmImportCurrentData() {
  if (!window._pendingImportData) return;
  try {
    const parsed = structuredClone(window._pendingImportData);
    // 旧格式备份：装入当前角色；若还没有任何角色则创建一个
    if (!profiles.activeId) {
      const id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      profiles.order.unshift(id);
      profiles.activeId = id;
    }
    if (parsed.apiConfig) profiles.globals.apiConfig = migrateApiConfig(parsed.apiConfig);
    if (Array.isArray(parsed.globalRules)) profiles.globals.globalRules = parsed.globalRules;
    state.data = deepMerge(structuredClone(DEFAULT_DATA), parsed);
    applyGlobalsToState();
    resetRuntimeState();
    saveToStorage();
    applyBgImage();
    enterChatMain();
    delete window._pendingImportData;
    showToast('数据已恢复');
    closeModal();
  } catch(e) {
    console.error('恢复失败', e);
    showToast('恢复失败：' + e.message);
    delete window._pendingImportData;
    closeModal();
  }
}

// 渲染规则卡片列表
function renderGlobalRules() {
  const container = document.getElementById('global-rules-list');
  const rules = state.data.globalRules || [];
  if (!rules.length) {
    container.innerHTML = `<div class="global-rules-empty">暂无全局规则<br>点击右上角「新增」添加</div>`;
    return;
  }
  container.innerHTML = rules.map(r => `
    <div class="global-rule-card ${r.enabled ? '' : 'disabled'}">
      <div class="global-rule-card-header">
        <div class="global-rule-card-name">${escapeHtml(r.name || '未命名规则')}</div>
        <div class="global-rule-card-actions">
          <button class="global-rule-card-btn" onclick="toggleGlobalRule('${r.id}')">${r.enabled ? '停用' : '启用'}</button>
          <button class="global-rule-card-btn" onclick="editGlobalRule('${r.id}')">编辑</button>
          <button class="global-rule-card-btn danger" onclick="deleteGlobalRule('${r.id}')">删除</button>
        </div>
      </div>
      <div class="global-rule-card-content">${escapeHtml(r.content || '')}</div>
    </div>
  `).join('');
}

// 启用/停用
function toggleGlobalRule(id) {
  const rule = state.data.globalRules.find(r => r.id === id);
  if (!rule) return;
  rule.enabled = !rule.enabled;
  saveToStorage();
  renderGlobalRules();
  showToast(rule.enabled ? '已启用' : '已停用');
}

// 删除
function deleteGlobalRule(id) {
  state.data.globalRules = state.data.globalRules.filter(r => r.id !== id);
  saveToStorage();
  renderGlobalRules();
  showToast('已删除');
}

// 新增/编辑（id 为 null 时新增）
function editGlobalRule(id) {
  const isNew = !id;
  const rule = isNew ? { name: '', content: '' } : state.data.globalRules.find(r => r.id === id);
  if (!rule) return;
  showModal(`
    <div class="modal">
      <div class="modal-header">${isNew ? '新增规则' : '编辑规则'}</div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">规则名称</label>
          <input type="text" class="form-input" id="gr-name" value="${escapeHtml(rule.name)}" placeholder="如：写作风格、禁止事项…">
        </div>
        <div class="form-group">
          <label class="form-label">指令内容</label>
          <textarea class="form-textarea" id="gr-content" style="min-height:200px;" placeholder="输入适用于所有剧本的指令词…">${escapeHtml(rule.content)}</textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="saveGlobalRule('${id || ''}')">保存</button>
      </div>
    </div>
  `);
}

// 保存（新增或更新）
function saveGlobalRule(id) {
  const nameEl = document.getElementById('gr-name');
  const contentEl = document.getElementById('gr-content');
  const name = nameEl ? nameEl.value.trim() : '';
  const content = contentEl ? contentEl.value.trim() : '';
  if (!name) { showToast('请填写规则名称'); return; }
  if (!content) { showToast('请填写指令内容'); return; }
  if (!state.data.globalRules) state.data.globalRules = [];
  if (id) {
    const rule = state.data.globalRules.find(r => r.id === id);
    if (rule) { rule.name = name; rule.content = content; }
  } else {
    state.data.globalRules.push({
      id: 'gr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      name, content, enabled: true
    });
  }
  saveToStorage();
  closeModal();
  renderGlobalRules();
  showToast('已保存');
}
/* ========== 存档系统已移除 ==========
