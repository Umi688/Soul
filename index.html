// 导航角色列表：带变更守卫 —— 名字/头像/顺序/激活项没变时跳过重建（saveToStorage 高频调用）
let _navListSig = '';
function renderNavCharList() {
  const listEl = document.getElementById('nav-char-list');
  if (!listEl || !profiles) return;
  if (!profiles.order.length) {
    if (_navListSig !== 'empty') {
      _navListSig = 'empty';
      listEl.innerHTML = '<div class="nav-char-empty">还没有剧本<br>点击下方「新增世界」开始</div>';
    }
    return;
  }
  const sig = profiles.order.join('|') + '::' + profiles.activeId + '::' +
    profiles.order.map(id => {
      const m = profiles.meta[id] || {};
      return (m.name || '') + '#' + (m.avatar || '');
    }).join('|');
  if (sig === _navListSig) return;  // 无变化，跳过 DOM 重建
  _navListSig = sig;
  let html = '';
  profiles.order.forEach(id => {
    const m = profiles.meta[id] || {};
    const name = m.name || '未命名世界';
    const active = id === profiles.activeId;
    const avatarStyle = m.avatar ? ` style="background-image:url('${m.avatar}');background-size:cover;background-position:center"` : '';
    const avatarInner = m.avatar ? '' : escapeHtml(getAvatarChar(name, '剧'));
    html += `
      <div class="nav-char-item${active ? ' active' : ''}" onclick="switchProfile('${id}')">
        <div class="nav-char-avatar"${avatarStyle}>${avatarInner}</div>
        <div class="nav-char-name">${escapeHtml(name)}</div>
        <button class="nav-char-edit" title="编辑名称" onclick="event.stopPropagation();openEditProfileName('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="nav-char-del" title="删除世界" onclick="event.stopPropagation();confirmDeleteProfile('${id}')">×</button>
      </div>
    `;
  });
  listEl.innerHTML = html;
}

// 切换角色：当前进度自动保存，目标角色进度原样恢复
function switchProfile(id) {
  if (!profiles.data[id]) return;
  if (id === profiles.activeId) { closeNav(); return; }
  if (state.isLoading) { showToast('正在生成中，请稍后再切换'); return; }
  // 保存当前角色进度
  if (state.data && profiles.activeId) saveToStorage();
  profiles.activeId = id;
  persistProfiles();
  loadProfileIntoState(id);
  resetRuntimeState();
  saveToStorage();
  flushProfilesNow();  // 切换角色属关键操作，立即落盘
  applyBgImage();
  closeNav();
  enterChatMain();
  showToast('已切换至「' + profileDisplayName(id) + '」');
}

// 编辑剧本名称（与角色名称无关，仅修改剧本显示名）
function openEditProfileName(id) {
  if (!profiles.meta[id]) return;
  const currentName = profiles.meta[id].name || '';
  showModal(`
    <div class="modal">
      <div class="modal-header">编辑剧本名称</div>
      <div class="modal-body">
        <input type="text" id="edit-profile-name-input" class="form-input" placeholder="输入剧本名称" value="${escapeHtml(currentName)}" maxlength="20" />
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="saveEditProfileName('${id}')">保存</button>
      </div>
    </div>
  `);
  setTimeout(() => {
    const input = document.getElementById('edit-profile-name-input');
    if (input) { input.focus(); input.select(); }
  }, 100);
}

function saveEditProfileName(id) {
  const input = document.getElementById('edit-profile-name-input');
  if (!input) return;
  const newName = input.value.trim();
  if (!newName) { showToast('名称不能为空'); return; }
  profiles.meta[id].name = newName;
  persistProfiles();
  flushProfilesNow();
  closeModal();
  renderNavCharList();
  // 如果编辑的是当前剧本，同步更新聊天页标题
  if (id === profiles.activeId) {
    const titleEl = document.getElementById('chat-title');
    if (titleEl) titleEl.textContent = newName;
  }
  showToast('已修改剧本名称');
}

function confirmDeleteProfile(id) {
  // 删除当前角色时，生成中禁止操作（防止进行中的回复写入错误角色）
  if (id === profiles.activeId && state.isLoading) {
    showToast('正在生成中，请稍后再试');
    return;
  }
  const name = profileDisplayName(id);
  showModal(`
    <div class="modal">
      <div class="modal-header">删除世界</div>
      <div class="modal-body" style="text-align:center;color:var(--text-dim);font-size:13px;line-height:1.8;">
        确定删除「${escapeHtml(name)}」吗？<br>该世界的全部聊天记录与进度将一并删除，不可撤销。
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" style="color:var(--danger);" onclick="deleteProfile('${id}')">确认删除</button>
      </div>
    </div>
  `);
}

function deleteProfile(id) {
  delete profiles.data[id];
  delete profiles.meta[id];
  profiles.order = profiles.order.filter(x => x !== id);
  const wasActive = profiles.activeId === id;
  if (wasActive) {
    if (profiles.order.length) {
      // 还有其他角色：激活下一个
      profiles.activeId = profiles.order[0];
      loadProfileIntoState(profiles.activeId);
    } else {
      // 全部删光：回到空状态
      profiles.activeId = null;
      state.data = structuredClone(DEFAULT_DATA);
      applyGlobalsToState();
    }
    resetRuntimeState();
  }
  persistProfiles();
  flushProfilesNow();  // 删除角色属关键操作，立即落盘
  applyBgImage();
  closeModal();
  renderNavCharList();
  if (profiles.activeId || wasActive) enterChatMain();
  if (!profiles.order.length) {
    // 全部删光：回到空状态，等待用户新建
    showToast('已删除世界');
  } else {
    showToast('已删除世界');
  }
}

/* ========== 右滑呼出角色抽屉 ========== */
function setupSwipeNav() {
  let sx = 0, sy = 0, st = 0, tracking = false;
  document.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1) { tracking = false; return; }
    const t = e.touches[0];
    tracking = true; sx = t.clientX; sy = t.clientY; st = Date.now();
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    if (!t) return;
    const dx = t.clientX - sx, dy = t.clientY - sy, dt = Date.now() - st;
    // 忽略慢速滑动与纵向为主的滑动
    if (dt > 700) return;
    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
    // 弹窗打开时不响应
    if (document.getElementById('modal-overlay').classList.contains('active')) return;
    const navEl = document.getElementById('nav-overlay');
    if (navEl.classList.contains('open')) {
      // 抽屉打开时左滑关闭
      if (dx < 0) closeNav();
      return;
    }
    const gameVisible = document.getElementById('game-screen').style.display !== 'none';
    const rulesVisible = document.getElementById('global-rules-screen').style.display !== 'none';
    const apiVisible = document.getElementById('api-config-screen').style.display !== 'none';
    // 从屏幕左缘右滑 → 打开角色抽屉（聊天 / 全局设定 / API配置 页均可）
    if (dx > 0 && sx < 70 && (gameVisible || rulesVisible || apiVisible)) openNav();
  }, { passive: true });
}

function switchTab(tab) {
  // Close any open modal
  closeModal();
  // Dismiss keyboard on tab switch
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }

  if (state.currentTab === tab) return;

  // If something is loading/generating, just switch visibility without re-rendering
  // This preserves the "generating" state on all tabs
  if (state.isLoading) {
    state.currentTab = tab;
    const target = document.getElementById('tab-' + tab);
    target.style.display = 'flex';
    document.querySelectorAll('.tab-content').forEach(el => {
      if (el !== target) el.style.display = 'none';
    });
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    return;
  }

  // Render target content BEFORE showing it (prevents flash during DOM rebuild)
  if (tab === 'chat') {
    renderNavCharList();
    renderChat();
  } else if (tab === 'calendar') {
    state.calendarArchiveMode = false;
    state.viewingCalendarArchiveMonth = null;
    updateCalendarHeaderButtons();
    renderCalendar();
  } else if (tab === 'memory') {
    state.memoryArchiveMode = false;
    state.viewingArchiveMonth = null;
    updateMemoryHeaderButtons();
    renderMemory();
    renderCalendar();
  } else if (tab === 'settings') {
    renderSettings();
  }

  // Now switch visibility — target is already rendered, so no flash
  state.currentTab = tab;
  const target = document.getElementById('tab-' + tab);
  target.style.display = 'flex';
  document.querySelectorAll('.tab-content').forEach(el => {
    if (el !== target) el.style.display = 'none';
  });
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
}

/* ========== 工具函数 ========== */
function showToast(msg, duration) {
  duration = duration || 2500;
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('out');
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

// 保存弹窗打开前的滚动位置，关闭时恢复（防止 focusout 处理器把页面滚到底部）
let _modalScrollSave = null;

function showModal(html) {
  // 保存当前可见滚动容器的滚动位置
  _modalScrollSave = {};
  const chat = document.getElementById('chat-messages');
  if (chat && chat.offsetParent !== null) _modalScrollSave.chat = chat.scrollTop;
  const calendar = document.getElementById('calendar-content');
  if (calendar && calendar.offsetParent !== null) _modalScrollSave.calendar = calendar.scrollTop;
  const mem = document.getElementById('memory-cards');
  if (mem && mem.offsetParent !== null) _modalScrollSave.memory = mem.scrollTop;
  const overlay = document.getElementById('modal-overlay');
  overlay.innerHTML = html;
  overlay.classList.add('active');
}

function closeModal() {
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.remove('active');
  overlay.innerHTML = '';
  // 恢复弹窗前的滚动位置（延迟以覆盖 focusout 处理器的异步滚动）
  if (_modalScrollSave) {
    const saved = _modalScrollSave;
    _modalScrollSave = null;
    setTimeout(function() {
      if (saved.chat != null) {
        const chat = document.getElementById('chat-messages');
        if (chat) chat.scrollTop = saved.chat;
      }
      if (saved.calendar != null) {
        const calendar = document.getElementById('calendar-content');
        if (calendar) calendar.scrollTop = saved.calendar;
      }
      if (saved.memory != null) {
        const mem = document.getElementById('memory-cards');
        if (mem) mem.scrollTop = saved.memory;
      }
    }, 250);
  }
}

// ========== 全屏模式 ==========
// 全屏功能已按需求移除（原入口在「设定」页，现已删除）
// 浏览器自带的全屏操作（如系统菜单）仍可用，键盘高度处理逻辑保留兼容

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function truncateText(text, maxLen) {
  if (!text) return '';
  let t = text.replace(/\s+/g, ' ');
  if (t.length > maxLen) t = t.slice(0, maxLen) + '…';
  return t;
}

// Render text as <p> paragraphs, splitting on newlines for visual spacing
function renderParagraphs(text) {
  if (!text) return '';
  return text.split(/\n+/).filter(p => p.trim()).map(p => `<p>${escapeHtml(p.trim())}</p>`).join('');
}

// Format narrative text: paragraph breaks + 「」italic (thoughts) + ""bold (dialogue)
function formatNarrativeText(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  // Paragraph breaks: \n → <p> tags (段落独立分段，间距由CSS控制)
  const lines = html.split(/\r?\n/);
  html = lines.map(line => `<p>${line}</p>`).join('');
  // 「...」 → italic, keep the brackets (心理活动)
  html = html.replace(/「([^」]*)」/g, '<i>「$1」</i>');
  // "..." (Chinese curly quotes U+201C U+201D) → bold, keep the quotes (对话引用)
  html = html.replace(/\u201C([^\u201D]*)\u201D/g, '<b>\u201C$1\u201D</b>');
  // Straight quotes "...": escapeHtml does NOT convert " in text content,
  // so match the raw " character directly
  html = html.replace(/"([^"]*?)"/g, '<b>"$1"</b>');
  return html;
}

function getAvatarChar(name, fallback) {
  if (name && name.length > 0) return name[0];
  return fallback || '?';
}

function formatTime(ts) {
  const d = new Date(ts);
  const h = d.getHours().toString().padStart(2,'0');
  const m = d.getMinutes().toString().padStart(2,'0');
  const gameMonth = state.data.calendarMonth || '';
  return `${gameMonth} ${h}:${m}`;
}

// 相对时间：用于好友列表预览（刚刚/x分钟前/昨天/月日）
function formatRelativeTime(ts) {
  if (!ts) return '';
  const now = Date.now();
  const diff = now - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff/3600000) + '小时前';
  const d = new Date(ts);
  const today = new Date();
  const isYesterday = (today.getTime() - ts) < 172800000 && d.getDate() !== today.getDate();
  if (isYesterday) return '昨天';
  if (diff < 604800000) return Math.floor(diff/86400000) + '天前';
  const M = (d.getMonth()+1).toString().padStart(2,'0');
  const D = d.getDate().toString().padStart(2,'0');
  return `${M}月${D}日`;
}

// 取某NPC的聊天记录数组：激活NPC在 state.data.chatHistory，其余在 npcChats
function getNpcChat(npcId) {
  if (!state.data) return [];
  if (npcId === state.data.activeNpcId) return state.data.chatHistory || [];
  return state.data.npcChats[npcId] || [];
}

// L8 即时上下文：最近记录
// 双向打通：聊天能看到近期剧情，剧情能看到近期聊天
function buildHistoryMessages(mode, isContinuation) {
  const MAX_PRIMARY = 25;     // 主上下文条数上限
  const MAX_CROSS = 10;       // 跨模块注入条数上限

  let primary = [];
  let cross = [];

  if (mode === 'chat') {
    // 聊天模式：主上下文是聊天记录
    // 正常发送：sendChatMessage 会先把用户消息 push 到 chatHistory，再调用 callAI；
    // callAI 又会把 userMessage 作为最后一条单独追加。
    // 如果最后一条是 user 消息，说明是刚 push 进去的，需要排除，否则AI会看到两条相同的消息（误判用户复读）。
    // 空发送续写：没有新消息 push，chatHistory 最后一条可能是 user（删除AI回复后）或 assistant；
    // 此时 userMessage 是系统提示而非真实用户消息，不应排除最后一条，否则会丢失真实上文。
    const chatHist = state.data.chatHistory;
    const excludeLast = !isContinuation && chatHist.length > 0 && chatHist[chatHist.length - 1].role === 'user';
    const sliceSource = excludeLast ? chatHist.slice(0, -1) : chatHist;
    primary = sliceSource.slice(-MAX_PRIMARY).map(h => ({
      role: h.role === 'user' ? 'user' : 'assistant',
      content: h.content || ''
    }));
    // 跨模块剧情注入：故事状态快照已在 System Prompt 中注入（L6），此处不再重复注入事件全文
    // 避免旧事件叙事干扰AI对当前时间节点的感知
  } else if (mode === 'event') {
    // 剧情模式：主上下文是剧情事件链，跨模块注入近期聊天
    primary = state.data.eventHistory.flatMap(e => [
      { role: 'user', content: `剧情愿望：${e.wish}` },
      { role: 'assistant', content: e.aiNarrative }
    ]).slice(-MAX_PRIMARY);
    const recentChats = state.data.chatHistory.slice(-MAX_CROSS);
    if (recentChats.length > 0) {
      const _meName = (state.data.characters.me.name || '').trim() || '主控';
      const _otherName = (state.data.characters.other.name || '').trim() || 'AI角色';
      const chatSummary = recentChats.map(h => {
        const speaker = h.role === 'user' ? _meName : _otherName;
        return `${speaker}：${h.content || ''}`;
      }).join('\n');
      cross.push({ role: 'user', content: `【近期聊天记录（供你感知当前关系状态和约定，叙事中可自然承接）】\n${chatSummary}` });
    }
  } else if (mode === 'polish') {
    // 润色模式：注入近期剧情叙事作为上下文，确保润色文本与上文衔接
    primary = state.data.eventHistory.flatMap(e => [
      { role: 'user', content: `剧情愿望：${e.polishedWish || e.wish || ''}` },
      { role: 'assistant', content: e.aiNarrative || '' }
    ]).slice(-MAX_PRIMARY);
    const recentChats = state.data.chatHistory.slice(-MAX_CROSS);
    if (recentChats.length > 0) {
      const _meName = (state.data.characters.me.name || '').trim() || '主控';
      const _otherName = (state.data.characters.other.name || '').trim() || 'AI角色';
      const chatSummary = recentChats.map(h => {
        const speaker = h.role === 'user' ? _meName : _otherName;
        return `${speaker}：${h.content || ''}`;
      }).join('\n');
      cross.push({ role: 'user', content: `【近期聊天记录（供你感知当前关系状态，勿在叙事中复述）】\n${chatSummary}` });
    }
  }

  // 顺序：跨模块上下文 → 主上下文（当前交互在最末尾，最受关注）
  return [...cross, ...primary];
}

// L6 故事状态快照：注入缓存的当前故事状态
// 快照在首次文字聊天时提炼并缓存，后续聊天持续注入（不消费、不删除）
// 新事件生成时标记过期，下次文字聊天重新提炼
// 快照基于近几月羁绊数据（memoryArchives + 当月事件）生成
function buildStoryStatePrompt() {
  const ss = state.data.storyState;
  if (!ss || !ss.trim()) return '';
  return '\n【当前故事状态（供你内在感知剧情进展）】\n' + ss.trim() + '\n';
}

// 完整 System Prompt 拼装：L1 → L2 → L3 → L4 → L5 → L6 → L7
// 越靠后的层越接近用户消息，AI 读取权重越高（attention recency bias）
// 因此将人设和主线剧情后移，让它们更接近实际对话，提升约束力
// L8（即时上下文）作为 history messages 单独传入，不拼入 system prompt
function buildSystemPrompt(mode) {
  let prompt = '';
  prompt += buildBaseAnchor();        // L1 基础锚定
  prompt += buildGlobalRulesPrompt(); // L2 全局规则
  prompt += buildRulesPrompt();      // L3 外部规则（舞台背景，前置铺垫）
  prompt += buildCharacterPrompt();  // L4 人设库（后移，更接近对话）
  prompt += buildMainStoryPrompt();  // L5 主线剧情约束（高权重，后移）
  prompt += buildStoryStatePrompt(); // L6 故事状态快照
  prompt += buildModeInstruction(mode); // L7 模式指令
  return prompt;
}

async function callAI(userMessage, mode) {
  const config = state.data.apiConfig;

  if (!config.apiKey) {
    return mockResponse(mode, userMessage);
  }

  const systemPrompt = buildSystemPrompt(mode);
  // 空发送续写时，userMessage 是系统提示而非真实用户消息，不需要排除 chatHistory 最后一条
  const isContinuation = mode === 'chat' && userMessage.startsWith('（系统提示：');
  // L8 即时上下文：最近20条记录，作为 history messages 注入
  const historyMsgs = (mode === 'chat' || mode === 'event' || mode === 'polish') ? buildHistoryMessages(mode, isContinuation) : [];

  const messages = [
    { role: 'system', content: systemPrompt },
    ...historyMsgs,
    { role: 'user', content: mode === 'polish' ? `请将以下内容润色为叙事文段：\n${userMessage}` : userMessage }
  ];

  try {
    const maxTokens = mode === 'calendarReport' ? 1500
      : mode === 'calendarEvents' ? 2000
      : mode === 'calendarDailyNews' ? 2500
      : mode === 'calendarMemo' || mode === 'calendarNotification' || mode === 'calendarMenu' || mode === 'calendarSocial' || mode === 'calendarConnection' ? 1500
      : 2000;
    // 自动重试：网络/超时类错误重试 1 次，内容审查类不重试
    return await callWithRetry(() => callOpenAICompatible(messages, config, maxTokens), 1);
  } catch(e) {
    console.error('AI调用失败', e);
    throw e;
  }
}

// 自动重试包装：仅对网络错误/超时/5xx 重试，内容审查/4xx 不重试
async function callWithRetry(fn, maxRetries) {
  let lastError;
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      return await fn();
    } catch(e) {
      lastError = e;
      const msg = (e.message || '').toLowerCase();
      // 可重试：网络错误、超时、5xx 服务端错误
      const isRetryable = e.name === 'AbortError'
        || msg.includes('网络请求失败')
        || msg.includes('超时')
        || /api\s+5\d{2}/.test(msg)
        || msg.includes('failed to fetch');
      if (!isRetryable || attempt === maxRetries) throw e;
      // 重试前等 1 秒
      await new Promise(r => setTimeout(r, 1000));
    }
  }
  throw lastError;
}

// 统一 OpenAI 兼容调用（支持所有 OpenAI 兼容平台：DeepSeek官方/OpenRouter/各类代理等）
async function callOpenAICompatible(messages, config, maxTokens) {
  // 规范化 baseUrl：去除末尾的 / 和 /v1
  let base = (config.baseUrl || '').replace(/\/+$/, '');
  base = base.replace(/\/v1$/, '');
  // 超时控制：90秒无响应则中止请求，防止 UI 永久卡在加载状态
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 90000);

  // 构建请求体：检测到 Gemini 模型时附加 safety_settings，放宽安全过滤阈值。
  // Gemini 默认阈值为 BLOCK_MEDIUM_AND_ABOVE（中等风险即拦截），
  // 对古言权谋、战争、政治等正常创作题材误判率极高。
  // 改为 BLOCK_ONLY_HIGH：仅拦截高概率有害内容，大幅减少误判 [$TRAE_REF](https://ai.google.dev/gemini-api/docs/safety-settings?hl=zh-cn)
  const reqBody = {
    model: config.model,
    messages: messages,
    temperature: config.temperature != null ? config.temperature : 0.85,
    frequency_penalty: config.frequencyPenalty != null ? config.frequencyPenalty : 0.4,
    presence_penalty: config.presencePenalty != null ? config.presencePenalty : 0.3,
    max_tokens: maxTokens || 2000
  };
  const isGemini = /gemini/i.test(config.model || '') || /generativelanguage\.googleapis\.com/i.test(base);
  if (isGemini) {
    reqBody.safety_settings = [
      { category: 'HARM_CATEGORY_HARASSMENT', threshold: 'BLOCK_ONLY_HIGH' },
      { category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_ONLY_HIGH' },
      { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_ONLY_HIGH' },
      { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_ONLY_HIGH' },
      { category: 'HARM_CATEGORY_CIVIC_INTEGRITY', threshold: 'BLOCK_ONLY_HIGH' }
    ];
  }

  let resp;
  try {
    resp = await fetch(`${base}/v1/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${config.apiKey}`
      },
      body: JSON.stringify(reqBody),
      signal: controller.signal
    });
  } catch(e) {
    clearTimeout(timeoutId);
    if (e.name === 'AbortError') {
      throw new Error('请求超时（90秒无响应），请检查网络或API服务状态');
    }
    throw new Error('网络请求失败：' + (e.message || '未知错误'));
  }
  clearTimeout(timeoutId);
  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(`API ${resp.status}: ${errText}`);
  }

  // 解析返回
  const data = await resp.json();
  if (!data.choices || !data.choices[0]) throw new Error('API返回为空');
  const choice = data.choices[0];
  const content = (choice.message?.content || '').trim();

  // 检测内容审查拦截：Google Gemini 通过 OpenAI 兼容端点返回时，
  // HTTP 状态码为 200，但 finish_reason 标记为 safety/content_filter，
  // 或 content 里直接塞入了审查错误的英文说明文本。
  const safetyReasons = ['safety', 'content_filter', 'recitation'];
  if (safetyReasons.includes(choice.finish_reason)) {
    throw new Error('内容被安全审查拦截（finish_reason: ' + choice.finish_reason + '），请调整剧情内容后重试');
  }
  // 内容审查错误文本特征（Gemini 会把这段话塞进 content 而非走错误码）
  const censorshipPatterns = [
    /prompt could not be submitted/i,
    /sensitive words? that violate/i,
    /Generative AI Prohibited Use policy/i,
    /Try rephrasing the prompt/i
  ];
  if (content && censorshipPatterns.some(re => re.test(content))) {
    throw new Error('内容被安全审查拦截，请调整剧情内容后重试');
  }

  if (!content) throw new Error('API返回内容为空（可能是内容审查拦截或token超限）');
  return content;
}

// 自动拉取平台下属的模型列表（OpenAI 兼容 GET /v1/models）
async function fetchModelList(baseUrl, apiKey) {
  let base = (baseUrl || '').replace(/\/+$/, '');
  base = base.replace(/\/v1$/, '');
  const resp = await fetch(`${base}/v1/models`, {
    method: 'GET',
    headers: { 'Authorization': `Bearer ${apiKey}` }
  });
  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(`拉取模型失败 ${resp.status}: ${errText}`);
  }
  const data = await resp.json();
  if (!data.data || !Array.isArray(data.data)) throw new Error('模型列表格式异常');
  return data.data.map(m => m.id).filter(Boolean);
}

  if (history.length === 0) {
    const npcName = (state.data.characters.other.name || '').trim();
    container.innerHTML = npcName
      ? `<div class="memory-empty">开始与「${escapeHtml(npcName)}」的对话<br><span style="font-size:11px;opacity:0.6">在下方输入消息</span></div>`
      : `<div class="memory-empty">开始你的故事<br><span style="font-size:11px;opacity:0.6">在下方输入消息</span></div>`;
    return;
  }

  let html = '';
  let lastSession = -1;
  const currentSessionId = state.chatSessionId;

  history.forEach((msg, idx) => {
    if (msg.sessionId !== lastSession) {
      const ts = (msg.sessionId === currentSessionId && state.chatSessionStartTime)
        ? state.chatSessionStartTime
        : msg.timestamp;
      html += `<div class="chat-timestamp">${formatTime(ts)}</div>`;
      lastSession = msg.sessionId;
    }
    html += buildMessageHtml(msg, idx);
  });

  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

// 好友列表（NPC + 群聊混排，按最后消息时间倒序）
function renderChatList() {
  const container = document.getElementById('chat-list-view');
  if (!container) return;
  const npcs = state.data.characters.npcs || [];
  const groups = state.data.groupChats || [];

  if (!npcs.length && !groups.length) {
    container.innerHTML = `<div class="memory-empty">还没有NPC<br><span style="font-size:11px;opacity:0.6">点击右上角「＋」新增</span></div>`;
    return;
  }

  // 统一收集所有对话项
  let items = [];

  // NPC 项
  npcs.forEach(npc => {
    const chat = getNpcChat(npc.id);
    const last = chat.length ? chat[chat.length - 1] : null;
    items.push({
      type: 'npc',
      id: npc.id,
      name: npc.name || '未命名',
      preview: last ? truncateText(last.content, 28) : '开始对话',
      time: last ? last.timestamp : 0,
      timeStr: last ? formatRelativeTime(last.timestamp) : '',
      avatar: npc.avatar || '',
      avatarChar: getAvatarChar(npc.name, 'NPC'),
      active: npc.id === state.data.activeNpcId && !state.data.activeGroupId,
      onclick: `switchNpcChat('${npc.id}')`,
      onAvatarClick: `event.stopPropagation();openNpcEditor('${npc.id}')`
    });
  });

  // 群聊项
  groups.forEach(grp => {
    const last = grp.chatHistory.length ? grp.chatHistory[grp.chatHistory.length - 1] : null;
    let preview = '开始群聊';
    if (last) {
      const prefix = last.role === 'assistant' && last.speakerName ? last.speakerName + '：' : '';
      preview = truncateText(prefix + (last.content || ''), 28);
    }
    items.push({
      type: 'group',
      id: grp.id,
      name: grp.name || '未命名群聊',
      preview: preview,
      time: last ? last.timestamp : (grp.createdAt || 0),
      timeStr: last ? formatRelativeTime(last.timestamp) : '',
      avatar: grp.avatar || '',
      avatarChar: (grp.name || '群')[0],
      active: grp.id === state.data.activeGroupId,
      onclick: `switchToGroupChat('${grp.id}')`,
      onAvatarClick: `event.stopPropagation();editGroupChat('${grp.id}')`
    });
  });

  // 按最后消息时间倒序排列（无消息的按创建时间排后）
  items.sort((a, b) => b.time - a.time);

  let html = '<div class="npc-list">';
  items.forEach(item => {
    const avatarStyle = item.avatar ? ` style="background-image:url('${item.avatar}');background-size:cover;background-position:center"` : '';
    const avatarInner = item.avatar ? '' : escapeHtml(item.avatarChar);
    const nameHtml = item.name && item.name !== '未命名' && item.name !== '未命名群聊'
      ? escapeHtml(item.name)
      : `<span style="opacity:0.45">${escapeHtml(item.name)}</span>`;
    html += `
      <div class="npc-list-item${item.active ? ' active' : ''}" onclick="${item.onclick}">
        <div class="npc-list-avatar"${avatarStyle} onclick="${item.onAvatarClick}">${avatarInner}</div>
        <div class="npc-list-info">
          <div class="npc-list-top"><span class="npc-list-name">${nameHtml}</span>${item.timeStr ? `<span class="npc-list-time">${item.timeStr}</span>` : ''}</div>
          <div class="npc-list-preview">${escapeHtml(item.preview)}</div>
        </div>
      </div>`;
  });
  html += '</div>';

  container.innerHTML = html;
}

// 返回好友列表（保存当前NPC设定回写）
function backToChatList() {
  syncOtherToActiveNpc();
  state.chatView = 'list';
  renderChat();
  renderNavCharList();
}

// 群聊创建临时状态
let _groupCreatorState = { name: '', avatar: '', selectedIds: [], editId: null };

// 打开群聊创建/编辑弹窗
function openGroupCreator(editId) {
  const npcs = state.data.characters.npcs || [];
  if (npcs.length < 2) {
    showToast('至少需要2个NPC才能创建群聊');
    return;
  }

  if (editId) {
    const grp = state.data.groupChats.find(g => g.id === editId);
    if (!grp) return;
    _groupCreatorState = {
      name: grp.name || '',
      avatar: grp.avatar || '',
      selectedIds: [...(grp.memberIds || [])],
      editId: editId
    };
  } else {
    _groupCreatorState = { name: '', avatar: '', selectedIds: [], editId: null };
  }

  let membersHtml = '';
  npcs.forEach(npc => {
    const checked = _groupCreatorState.selectedIds.includes(npc.id);
    const avatarStyle = npc.avatar ? `style="background-image:url('${npc.avatar}');background-size:cover;background-position:center"` : '';
    const avatarInner = npc.avatar ? '' : escapeHtml(getAvatarChar(npc.name, 'NPC'));
    membersHtml += `
      <div class="group-member-item" onclick="toggleGroupMember('${npc.id}')">
        <div class="group-member-avatar" ${avatarStyle}>${avatarInner}</div>
        <div class="group-member-info">
          <div class="group-member-name">${escapeHtml(npc.name || '未命名')}</div>
          <div class="group-member-desc">${escapeHtml(npc.oneLiner || npc.identity || '无介绍')}</div>
        </div>
        <div class="group-member-check${checked ? ' checked' : ''}" id="gcheck-${npc.id}"></div>
      </div>`;
  });

  const avatarBg = _groupCreatorState.avatar
    ? `style="background-image:url('${_groupCreatorState.avatar}');background-size:cover;background-position:center"`
    : '';
  const avatarText = _groupCreatorState.avatar ? '' : `<span style="font-size:24px;font-weight:300;color:rgba(239,244,250,0.95)">${escapeHtml((_groupCreatorState.name || '群')[0])}</span>`;

  showModal(`
    <div class="modal">
      <div class="modal-header">${editId ? '编辑群聊' : '新建群聊'}</div>
      <div class="modal-body group-creator-body">
        <div class="group-creator-avatar" id="group-avatar-preview" ${avatarBg} onclick="uploadGroupAvatar()" title="点击上传群头像">${avatarText}</div>
        <input type="text" class="group-creator-name" id="group-name-input" placeholder="群聊名称" value="${escapeHtml(_groupCreatorState.name)}" oninput="_groupCreatorState.name=this.value;updateGroupAvatarPreview()">
        <div class="group-member-list">${membersHtml}</div>
      </div>
      <div class="modal-footer">
        ${editId ? '<button class="modal-btn" style="color:var(--danger)" onclick="deleteGroupChat(\'' + editId + '\')">删除</button>' : ''}
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="saveGroupChat()">${editId ? '保存' : '创建'}</button>
      </div>
    </div>
  `);
}

// 切换NPC选中状态
// 输入群名时实时更新默认头像首字
function updateGroupAvatarPreview() {
  if (_groupCreatorState.avatar) return; // 有自定义头像时不更新
  const preview = document.getElementById('group-avatar-preview');
  if (!preview) return;
  const firstChar = (_groupCreatorState.name || '群')[0];
  preview.innerHTML = `<span style="font-size:24px;font-weight:300;color:rgba(239,244,250,0.95)">${escapeHtml(firstChar)}</span>`;
}

function toggleGroupMember(npcId) {
  const idx = _groupCreatorState.selectedIds.indexOf(npcId);
  if (idx >= 0) {
    _groupCreatorState.selectedIds.splice(idx, 1);
  } else {
    _groupCreatorState.selectedIds.push(npcId);
  }
  const check = document.getElementById('gcheck-' + npcId);
  if (check) check.classList.toggle('checked');
}

// 上传群头像
function uploadGroupAvatar() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      _groupCreatorState.avatar = ev.target.result;
      const preview = document.getElementById('group-avatar-preview');
      if (preview) {
        preview.style.backgroundImage = `url('${ev.target.result}')`;
        preview.style.backgroundSize = 'cover';
        preview.style.backgroundPosition = 'center';
        preview.innerHTML = '';
      }
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

// 保存/创建群聊
function saveGroupChat() {
  let name = (_groupCreatorState.name || '').trim();
  if (_groupCreatorState.selectedIds.length < 2) { showToast('至少选择2个NPC'); return; }

  // 群聊名称未填写时，用成员名自动生成默认名
  if (!name) {
    const npcs = state.data.characters.npcs || [];
    const memberNames = _groupCreatorState.selectedIds.map(id => {
      const n = npcs.find(n => n.id === id);
      return n ? n.name : '';
    }).filter(Boolean);
    name = memberNames.slice(0, 3).join('、') + (memberNames.length > 3 ? '等' : '') + '的群聊';
  }

  if (_groupCreatorState.editId) {
    const grp = state.data.groupChats.find(g => g.id === _groupCreatorState.editId);
    if (grp) {
      grp.name = name;
      grp.avatar = _groupCreatorState.avatar;
      grp.memberIds = [..._groupCreatorState.selectedIds];
    }
  } else {
    const newGroup = {
      id: 'grp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      name: name,
      avatar: _groupCreatorState.avatar,
      memberIds: [..._groupCreatorState.selectedIds],
      chatHistory: [],
      createdAt: Date.now()
    };
    state.data.groupChats.push(newGroup);
  }
  saveToStorage();
  closeModal();
  renderChatList();
  showToast(_groupCreatorState.editId ? '群聊已更新' : '群聊已创建');
}

// 编辑群聊
function editGroupChat(groupId) {
  openGroupCreator(groupId);
}

// 删除群聊
function deleteGroupChat(groupId) {
  showModal(`
    <div class="modal">
      <div class="modal-header">删除群聊</div>
      <div class="modal-body" style="text-align:center;color:var(--text-dim);font-size:13px;">
        确定删除该群聊吗？聊天记录将一并删除。
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn" style="color:var(--danger)" onclick="confirmDeleteGroup('${groupId}')">删除</button>
      </div>
    </div>
  `);
}

function confirmDeleteGroup(groupId) {
  const idx = state.data.groupChats.findIndex(g => g.id === groupId);
  if (idx >= 0) {
    state.data.groupChats.splice(idx, 1);
    if (state.data.activeGroupId === groupId) {
      state.data.activeGroupId = '';
      state.chatView = 'list';
    }
    saveToStorage();
    closeModal();
    renderChatList();
    showToast('群聊已删除');
  }
}

// 切换到群聊
function switchToGroupChat(groupId) {
  const grp = state.data.groupChats.find(g => g.id === groupId);
  if (!grp) return;
  if (state.isLoading) { showToast('正在生成中，请稍后再切换'); return; }

  // 如果当前在NPC对话中，保存当前NPC设定和聊天
  if (state.chatView === 'chat' && state.data.activeNpcId) {
    syncOtherToActiveNpc();
    if (state.data.activeNpcId) state.data.npcChats[state.data.activeNpcId] = state.data.chatHistory;
  }

  state.data.activeGroupId = groupId;
  state.chatView = 'group';
  state.chatSessionId++;
  state.chatSessionStartTime = Date.now();
  saveToStorage();
  renderChat();
}

// 渲染群聊对话视图
function renderGroupChatView() {
  const grp = state.data.groupChats.find(g => g.id === state.data.activeGroupId);
  if (!grp) {
    state.chatView = 'list';
    renderChat();
    return;
  }

  // 更新标题
  const titleEl = document.getElementById('chat-title');
  if (titleEl) titleEl.textContent = grp.name || '群聊';

  const container = document.getElementById('chat-messages');
  const history = grp.chatHistory;

  // 设置群头像为AI侧CSS变量
  const root = document.documentElement.style;
  if (grp.avatar) {
    root.setProperty('--av-ai', `url('${grp.avatar.replace(/'/g, '%27')}')`);
  } else {
    root.removeProperty('--av-ai');
  }
  // 为每个群成员设置独立 CSS 变量，避免内联 base64 重复
  (grp.memberIds || []).forEach(id => {
    const npc = state.data.characters.npcs.find(n => n.id === id);
    if (npc && npc.avatar) {
      root.setProperty(`--av-gnpc-${id}`, `url('${npc.avatar.replace(/'/g, '%27')}')`);
    } else {
      root.removeProperty(`--av-gnpc-${id}`);
    }
  });

  if (history.length === 0) {
    const memberNames = (grp.memberIds || []).map(id => {
      const n = state.data.characters.npcs.find(n => n.id === id);
      return n ? n.name : '';
    }).filter(Boolean).join('、');
    container.innerHTML = `<div class="memory-empty">群聊「${escapeHtml(grp.name || '群聊')}」已就绪<br><span style="font-size:11px;opacity:0.6">成员：${escapeHtml(memberNames)}</span><br><span style="font-size:11px;opacity:0.6">在下方输入消息</span></div>`;
    return;
  }

  const npcs = state.data.characters.npcs || [];
  let html = '';
  let lastSession = -1;
  const currentSessionId = state.chatSessionId;

  history.forEach((msg, idx) => {
    if (msg.sessionId !== lastSession) {
      const ts = (msg.sessionId === currentSessionId && state.chatSessionStartTime)
        ? state.chatSessionStartTime
        : msg.timestamp;
      html += `<div class="chat-timestamp">${formatTime(ts)}</div>`;
      lastSession = msg.sessionId;
    }
    html += buildGroupMessageHtml(msg, idx, npcs, grp);
  });

  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

// 群聊消息HTML
function buildGroupMessageHtml(msg, idx, npcs, grp) {
  const isMe = msg.role === 'user';
  const meChar = state.data.characters.me;

  if (isMe) {
    const avatarInner = meChar.avatar ? '' : escapeHtml(getAvatarChar(meChar.name, '我'));
    return `
      <div class="msg-row me" data-idx="${idx}">
        <div class="chat-avatar me">${avatarInner}</div>
        <div class="msg-bubble">${escapeHtml(msg.content)}</div>
      </div>`;
  }

  // NPC消息：查找说话者
  const speakerNpc = msg.speakerId ? npcs.find(n => n.id === msg.speakerId) : null;
  const speakerName = msg.speakerName || (speakerNpc ? speakerNpc.name : '') || '未知';

  // 头像：用说话者的 CSS 变量（避免内联 base64 重复）
  let avatarStyle = '';
  let avatarInner = '';
  if (speakerNpc && speakerNpc.avatar) {
    avatarStyle = ` style="background-image:var(--av-gnpc-${speakerNpc.id}, linear-gradient(135deg,#3A6FA5 0%,#8AA8D0 100%))"`;
  } else {
    avatarInner = escapeHtml(getAvatarChar(speakerName, 'NPC'));
  }

  return `
    <div class="msg-row ai" data-idx="${idx}" onclick="showGroupMsgActions(${idx})">
      <div class="chat-avatar ai"${avatarStyle}>${avatarInner}</div>
      <div>
        <div class="group-msg-speaker">${escapeHtml(speakerName)}</div>
        <div class="msg-bubble">${escapeHtml(msg.content)}</div>
      </div>
    </div>`;
}

// 群聊发送消息
async function sendGroupChatMessage() {
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send-btn');
  if (state.isLoading) return;
  const text = input.value.trim();
  if (!text) return;

  const grp = state.data.groupChats.find(g => g.id === state.data.activeGroupId);
  if (!grp) return;

  input.value = '';
  autoResizeInput(input);

  // 添加用户消息
  grp.chatHistory.push({
    role: 'user',
    content: text,
    timestamp: Date.now(),
    sessionId: state.chatSessionId
  });
  saveToStorage();
  appendGroupChatMessage(grp.chatHistory.length - 1, grp);

  state.isLoading = true;
  btn.disabled = true;
  showGroupTypingIndicator(grp);

  try {
    // 快照过期时先提炼
    if (state.data.storyStateStale) {
      try {
        const snapshot = await generateStoryStateSnapshot();
        if (snapshot) state.data.storyState = snapshot;
      } catch(e) {
        console.error('快照提炼失败，使用旧快照', e);
      }
      state.data.storyStateStale = false;
      saveToStorage();
    }

    const reply = await callAIGroupChat(text, grp);
    removeTypingIndicator();

    // 解析AI返回的多NPC回复
    const responses = parseGroupAIResponse(reply, grp);
    if (responses.length === 0) {
      showToast('群聊回复解析失败，请重试');
      // 保留用户消息，移除AI占位
      saveToStorage();
      return;
    }
    for (const resp of responses) {
      grp.chatHistory.push({
        role: 'assistant',
        content: resp.content,
        timestamp: Date.now(),
        sessionId: state.chatSessionId,
        speakerId: resp.speakerId,
        speakerName: resp.speakerName
      });
      appendGroupChatMessage(grp.chatHistory.length - 1, grp);
      // NPC之间回复加短暂延迟感
      await new Promise(r => setTimeout(r, 300));
    }
    saveToStorage();
  } catch(e) {
    removeTypingIndicator();
    showToast('AI回复失败：' + (e.message || '未知错误'));
  } finally {
    state.isLoading = false;
    btn.disabled = false;
    input.focus();
  }
}

// 群聊AI调用
async function callAIGroupChat(userMessage, grp) {
  const config = state.data.apiConfig;
  if (!config.apiKey) {
    return mockGroupResponse(grp);
  }

  const npcs = state.data.characters.npcs || [];
  const meName = (state.data.characters.me.name || '').trim() || '主控';

  // 构建群成员人设（L4 人设层）
  let memberPrompt = '\n【角色设定】\n';
  // 主控角色完整设定
  const meChar = state.data.characters.me;
  memberPrompt += '--- 主控角色 ---\n';
  memberPrompt += `姓名：${meChar.name || '未设定'}，性别：${meChar.gender || '未设定'}，年龄：${meChar.age || '未设定'}，身份：${meChar.identity || '未设定'}\n`;
  memberPrompt += `外貌：${meChar.appearance || '未设定'}\n性格：${meChar.personality || '未设定'}\n人物背景：${meChar.background || '未设定'}\n其他设定：${meChar.other || '无'}\n`;
  // 各群成员完整设定
  grp.memberIds.forEach(id => {
    const n = npcs.find(n => n.id === id);
    if (n) {
      memberPrompt += `--- ${n.name || '未命名'} ---\n`;
      memberPrompt += `姓名：${n.name || '未设定'}，性别：${n.gender || '未设定'}，年龄：${n.age || '未设定'}，身份：${n.identity || '未设定'}\n`;
      memberPrompt += `外貌：${n.appearance || '未设定'}\n性格：${n.personality || '未设定'}\n人物背景：${n.background || '未设定'}\n其他设定：${n.other || '无'}\n`;
      if (n.oneLiner) memberPrompt += `简介：${n.oneLiner}\n`;
      memberPrompt += '\n';
    }
  });

  // 构建群聊模式指令
  const memberNames = grp.memberIds.map(id => {
    const n = npcs.find(n => n.id === id);
    return n ? n.name : '';
  }).filter(Boolean);

  const groupModePrompt = `\n【当前模式：群聊】\n这是「${grp.name}」的群聊。群成员有：${memberNames.join('、')}。\n主控角色是「${meName}」。\n规则：\n1. 根据主控角色的发言，选择1-2个最合适的群成员进行回复。选择标准：谁的性格和当前话题最相关、谁最可能回应。\n2. 每个回复必须严格符合该角色的性格设定和说话风格。\n3. 回复格式：每条回复占一行，格式为 NPC姓名|||回复内容。每个NPC一条，不要有多余的说明。\n4. 回复要短句、口语化，像真实的微信群聊一样自然。\n5. 绝对禁止任何括号旁白、动作描写、心理描写。只输出对话文字本身。\n6. 不主动推进重大剧情，不展开长篇叙述。\n7. 绝对禁止输出代码、JSON、markdown或任何结构化标记。\n`;

  // 构建 System Prompt
  let systemPrompt = '';
  systemPrompt += buildBaseAnchor();
  systemPrompt += buildGlobalRulesPrompt();
  systemPrompt += buildRulesPrompt();
  systemPrompt += memberPrompt;
  systemPrompt += buildMainStoryPrompt();
  systemPrompt += buildStoryStatePrompt();
  systemPrompt += groupModePrompt;

  // 构建 history messages
  const MAX_HISTORY = 20;
  const recentHistory = grp.chatHistory.slice(-MAX_HISTORY).map(h => {
    if (h.role === 'user') {
      return { role: 'user', content: h.content };
    } else {
      return { role: 'assistant', content: `${h.speakerName || 'NPC'}：${h.content}` };
    }
  });

  const messages = [
    { role: 'system', content: systemPrompt },
    ...recentHistory,
    { role: 'user', content: userMessage }
  ];

  return await callWithRetry(() => callOpenAICompatible(messages, config, 1500), 1);
}

// 解析群聊AI回复
function parseGroupAIResponse(raw, grp) {
  if (!raw) return [];
  const npcs = state.data.characters.npcs || [];
  const lines = raw.trim().split('\n').filter(l => l.trim());
  const results = [];

  lines.forEach(line => {
    const idx = line.indexOf('|||');
    if (idx >= 0) {
      const name = line.slice(0, idx).trim();
      const content = line.slice(idx + 3).trim();
      if (!content) return;
      // 查找NPC
      const npc = npcs.find(n => n.name === name);
      results.push({
        speakerId: npc ? npc.id : '',
        speakerName: name,
        content: content
      });
    } else {
      // 没有分隔符，尝试匹配NPC名前缀
      for (const n of npcs) {
        if (n.name && line.startsWith(n.name + '：')) {
          results.push({
            speakerId: n.id,
            speakerName: n.name,
            content: line.slice(n.name.length + 1).trim()
          });
          return;
        }
      }
      // 无法解析，作为第一个成员的消息
      if (grp.memberIds.length > 0 && results.length === 0) {
        const firstNpc = npcs.find(n => n.id === grp.memberIds[0]);
        results.push({
          speakerId: grp.memberIds[0],
          speakerName: firstNpc ? firstNpc.name : 'NPC',
          content: line.trim()
        });
      }
    }
  });

  // 如果没解析出任何回复，返回空
  return results;
}

async function sendChatMessage() {
  // 群聊模式下路由到群聊发送
  if (state.chatView === 'group' && state.data.activeGroupId) {
    return sendGroupChatMessage();
  }
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send-btn');
  if (state.isLoading) return;
  const text = input.value.trim();
  const hasQuote = !!state.quoteContext;

  // Handle quoted reply
  let finalText = text;
  if (hasQuote) {
    finalText = text ? `[引用：「${state.quoteContext.substring(0, 50)}」]\n${text}` : `[引用：「${state.quoteContext.substring(0, 50)}」]`;
    state.quoteContext = null;
    const quoteBar = document.getElementById('quote-bar');
    if (quoteBar) quoteBar.style.display = 'none';
  }

  // Empty text + no quote = "continue" prompt
  if (!text && !hasQuote) {
    const chatHist = state.data.chatHistory;
    const lastIsUser = chatHist.length > 0 && chatHist[chatHist.length - 1].role === 'user';
    state.isLoading = true;
    btn.disabled = true;
    showTypingIndicator();
    try {
      let reply;
      if (state.data.storyStateStale) {
        // 新事件后首次空发送 → AI角色主动发消息（触发快照提炼，开新会话）
        state.chatSessionId++;
        state.chatSessionStartTime = Date.now();
        try {
          const snapshot = await generateStoryStateSnapshot();
          if (snapshot) state.data.storyState = snapshot;
        } catch(e) {
          console.error('快照提炼失败，使用旧快照', e);
        }
        state.data.storyStateStale = false;
        saveToStorage();
        reply = await callAI('（系统提示：刚刚发生了一些事，你主动给主控角色发了一条消息。请直接输出这条消息，不要加任何说明或引号，内容要贴合近期事件和你的性格，像平时发微信一样自然。）', 'chat');
      } else if (lastIsUser) {
        // 上一条是主控的消息 → AI回复主控的话（用主控的最后一条消息作为输入，走标准流程）
        const lastUserMsg = chatHist[chatHist.length - 1].content;
        reply = await callAI(lastUserMsg, 'chat');
      } else {
        // 上一条是AI的消息 → 主控沉默，AI继续说
        reply = await callAI('（系统提示：对方没有回复，你紧接着又会说一句话。请直接输出这句话，不要加任何说明或引号，不要重复已经说过的话，内容要自然衔接上一句。）', 'chat');
      }
      removeTypingIndicator();
      const cleanReply = reply.trim();
      if (cleanReply) {
        state.data.chatHistory.push({
          role: 'assistant', content: cleanReply,
          timestamp: Date.now(), sessionId: state.chatSessionId
        });
        appendChatMessage(state.data.chatHistory.length - 1);
        saveToStorage();
      }
    } catch(e) {
      removeTypingIndicator();
      showToast('AI回复失败：' + (e.message || '未知错误'));
    } finally {
      state.isLoading = false;
      btn.disabled = false;
      input.focus();
    }
    return;
  }

  // 文字发送：如果快照过期，先提炼快照（以快照为新会话边界）
  if (state.data.storyStateStale) {
    state.chatSessionId++;
    state.chatSessionStartTime = Date.now();
  }

  // Normal send: add user message, AI replies once
  state.data.chatHistory.push({
    role: 'user', content: text,
    timestamp: Date.now(), sessionId: state.chatSessionId
  });
  input.value = '';
  autoResizeInput(input);
  saveToStorage();
  appendChatMessage(state.data.chatHistory.length - 1);

  state.isLoading = true;
  btn.disabled = true;

  try {
    showTypingIndicator();
    // 快照过期时，先提炼快照（花费一次API调用），后续聊天复用缓存
    if (state.data.storyStateStale) {
      try {
        const snapshot = await generateStoryStateSnapshot();
        if (snapshot) state.data.storyState = snapshot;
      } catch(e) {
        console.error('快照提炼失败，使用旧快照', e);
      }
      state.data.storyStateStale = false;
      saveToStorage();
    }
    const reply = await callAI(finalText, 'chat');
    removeTypingIndicator();

    const cleanReply = reply.trim();
    if (cleanReply) {
      state.data.chatHistory.push({
        role: 'assistant', content: cleanReply,
        timestamp: Date.now(), sessionId: state.chatSessionId
      });
      appendChatMessage(state.data.chatHistory.length - 1);
      saveToStorage();
    }
  } catch(e) {
    removeTypingIndicator();
    showToast('AI回复失败：' + (e.message || '未知错误'));
    state.data.chatHistory.push({
      role: 'assistant', content: '（回复失败，请检查API配置）',
      timestamp: Date.now(), sessionId: state.chatSessionId
    });
    appendChatMessage(state.data.chatHistory.length - 1);
    saveToStorage();
  } finally {
    state.isLoading = false;
    btn.disabled = false;
    input.focus();
  }
}

// 重新生成AI回复：移除该AI消息，找到上一条用户消息，重新调用AI
async function regenerateMessage(idx) {
  const msg = state.data.chatHistory[idx];
  if (!msg || msg.role !== 'assistant') return;
  closeMsgActions();

  // 找到这条AI回复对应的上一条用户消息
  let userInput = '';
  let userInputIdx = -1;
  for (let i = idx - 1; i >= 0; i--) {
    if (state.data.chatHistory[i].role === 'user') {
      userInput = state.data.chatHistory[i].content;
      userInputIdx = i;
      break;
    }
  }

  // 没有上一条用户消息 → 说明这是AI主动发的消息（如空发送触发）
  // 移除该AI消息后，用空发送的逻辑重新生成
  const isAiInitiated = userInputIdx === -1;

  // 从聊天记录中移除这条AI回复
  state.data.chatHistory.splice(idx, 1);
  saveToStorage();
  renderChat();

  // 显示typing并重新生成
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send-btn');
  state.isLoading = true;
  btn.disabled = true;
  showTypingIndicator();

  try {
    let reply;
    if (isAiInitiated) {
      // AI主动发的消息 → 重新让AI主动发一条
      reply = await callAI('（系统提示：刚刚发生了一些事，你主动给主控角色发了一条消息。请直接输出这条消息，不要加任何说明或引号，内容要贴合近期事件和你的性格，像平时发微信一样自然。）', 'chat');
    } else {
      // 用上一条用户消息重新调用AI
      reply = await callAI(userInput, 'chat');
    }
    removeTypingIndicator();
    const cleanReply = reply.trim();
    if (cleanReply) {
      state.data.chatHistory.push({
        role: 'assistant', content: cleanReply,
        timestamp: Date.now(), sessionId: state.chatSessionId
      });
      appendChatMessage(state.data.chatHistory.length - 1);
      saveToStorage();
    }
  } catch(e) {
    removeTypingIndicator();
    showToast('重新生成失败：' + (e.message || '未知错误'));
  } finally {
    state.isLoading = false;
    btn.disabled = false;
    input.focus();
  }
}

// 日历模式：晨报 + 时间轴事件(5-10条, 1-3关键剧情可推进)
// 关键剧情推进复用愿望→润色→叙事系统

function buildEventBlockHtml(evt) {
  const hasPlayer = evt.polishedWish || evt.wish;
  const hasAi = evt.aiNarrative;
  const playerBody = evt.polishedWish ? formatNarrativeText(evt.polishedWish) : (evt.wish ? formatNarrativeText(evt.wish) : '');
  const aiBody = evt.aiNarrative ? formatNarrativeText(evt.aiNarrative) : '';
  const isPrequel = evt.isPrequel;
  const isSummary = evt.isSummary;
  const aiTag = isSummary ? '事件总结' : (isPrequel ? '前置剧情' : '叙事');
  const aiExtraClass = isSummary ? ' summary' : (isPrequel ? ' prequel' : '');
  let html = `<div class="narrative-block" data-id="${evt.id}">`;
  if (hasPlayer) {
    html += `
      <div class="narr-card player">
        <div class="narr-card-header">
          <span class="narr-card-tag">愿望</span>
          <div class="narr-card-header-actions">
            <button class="narr-card-header-btn" onclick="editNarrative('${evt.id}','player')">EDIT</button>
            <button class="narr-card-header-btn" onclick="refreshNarrative('${evt.id}','player')">RETRY</button>
            <button class="narr-card-header-btn danger" onclick="deleteNarrative('${evt.id}','player')">DELETE</button>
          </div>
        </div>
        <div class="narr-card-body" id="player-narr-${evt.id}">${playerBody}</div>
        <div class="narr-card-actions" id="player-actions-${evt.id}"></div>
      </div>`;
  }
  if (hasAi) {
    html += `
      <div class="narr-card ai${aiExtraClass}">
        <div class="narr-card-header">
          <span class="narr-card-tag">${aiTag}</span>
          <div class="narr-card-header-actions">
            <button class="narr-card-header-btn" onclick="editNarrative('${evt.id}','ai')">EDIT</button>
            <button class="narr-card-header-btn" onclick="refreshNarrative('${evt.id}','ai')">RETRY</button>
            <button class="narr-card-header-btn danger" onclick="deleteNarrative('${evt.id}','ai')">DELETE</button>
          </div>
        </div>
        <div class="narr-card-body" id="ai-narr-${evt.id}">${aiBody}</div>
        <div class="narr-card-actions" id="ai-actions-${evt.id}"></div>
      </div>`;
  }
  html += `</div>`;
  return html;
}

function getCurrentMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function renderCalendarArchive(container) {
  const currentMonth = state.data.calendarMonth || '';
  const archives = (state.data.calendarArchives || []).filter(a => a.month !== currentMonth);
  if (!archives.length) {
    container.innerHTML = `<div class="memory-empty" style="padding:60px 0;">暂无过往晨报<br><span style="font-size:11px;color:rgba(58,111,165,0.7)">推进月份后晨报会自动归档</span></div>`;
    return;
  }
  const months = [...archives].reverse(); // 最近的在上
  let html = '<div class="memory-archive-list">';
  months.forEach(a => {
    const preview = a.monthReport
      ? a.monthReport.substring(0, 40) + (a.monthReport.length > 40 ? '…' : '')
      : ((a.memos && a.memos.length) ? a.memos.length + '条备忘录' : '点击查看');
    html += `
      <div class="memory-archive-card" onclick="viewCalendarArchivedMonth('${a.month}')">
        <div class="memory-archive-month">${escapeHtml(a.month)}</div>
        <div class="memory-archive-preview">${escapeHtml(preview)}</div>
      </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

function renderCalendarArchivedMonth(container, month) {
  const archive = (state.data.calendarArchives || []).find(a => a.month === month);
  if (!archive) {
    container.innerHTML = `<div class="memory-archive-header"><button class="memory-archive-back" onclick="exitCalendarArchivedMonth()">返回</button><span>${escapeHtml(month)}</span></div><div class="memory-empty">该月无归档数据</div>`;

  }

  let html = `<div class="memory-archive-header">
    <button class="memory-archive-back" onclick="exitCalendarArchivedMonth()">返回</button>
    <span>${escapeHtml(month)}</span>
  </div>`;

  // 晨报
  if (archive.monthReport) {
    html += `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">晨报</span></div><div class="cal-section-body"><div class="cal-memo-item">${escapeHtml(archive.monthReport)}</div></div></div>`;

    memos.forEach(m => { html += `<div class="cal-memo-item">${escapeHtml(m)}</div>`; });

    html += `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">NOTIFICATIONS</span><span class="cal-section-title-cn">通知</span></div><div class="cal-section-body">`;
    notifs.forEach(n => { html += `<div class="cal-notif-item">${escapeHtml(n)}</div>`; });

  }

  // 餐食
  const menu = archive.menu || [];
  if (menu.length) {
    html += `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">DAILY MENU</span><span class="cal-section-title-cn">每日餐食</span></div><div class="cal-section-body">`;
    menu.forEach(m => {
      html += `<div class="cal-menu-item"><span class="cal-menu-type">${escapeHtml(m.type||'')}</span><span class="cal-menu-food">${escapeHtml(m.food||'')}</span><span class="cal-menu-source">${escapeHtml(m.source||'')}</span>${m.thought?`<span class="cal-menu-thought">${escapeHtml(m.thought)}</span>`:''}</div>`;
    });

  // 舆论

  if (social.length) {
    html += `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">SOCIAL FEEDBACK</span><span class="cal-section-title-cn">舆论</span></div><div class="cal-section-body">`;
    social.forEach(s => { html += `<div class="cal-social-item">${escapeHtml(s)}</div>`; });
    html += `</div></div>`;

  // 羁绊进展
  const connections = archive.connections || [];
  if (connections.length) {
    html += `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">CONNECTIONS</span><span class="cal-section-title-cn">羁绊</span></div><div class="cal-section-body">`;
    connections.forEach(c => {
      html += `<div class="cal-conn-item"><span class="cal-conn-pair">${escapeHtml(c.pair||'')}</span><span class="cal-conn-text">${escapeHtml(c.text||'')}</span></div>`;
    });

  // 每日新闻
  const news = archive.dailyNews || [];
  if (news.length) {
    html += `<div class="cal-section"><div class="cal-section-header"><span class="cal-section-title">DAILY NEWS</span><span class="cal-section-title-cn">每日新闻</span></div>`;
    news.forEach(n => {

    html += '<div class="memory-empty">该月无归档数据</div>';

// 生成全部晨报内容（内部核心逻辑，可被 advanceToNextMonth 复用）
// 收集当月上下文，供晨报各模块生成时注入（层面一）
function buildMonthlyContextForCalendar() {
  let ctx = '\n【历史上下文（生成时务必紧扣这些内容）】\n';

  // 1. 主线剧情
  const mainStory = (state.data.mainStory || '').trim();
  if (mainStory) {
    ctx += `【主线剧情】\n${mainStory}\n`;
  }

  // 2. 归档羁绊（最近2个月，全文）
  const archives = state.data.memoryArchives || [];
  const recentArchives = archives.slice(-2);
  if (recentArchives.length) {
    ctx += '【归档羁绊】\n';
    recentArchives.forEach(arch => {
      ctx += `${arch.month}：\n`;
      (arch.events || []).forEach(e => {
        ctx += `- ${e.title}：${e.desc}\n`;
        if (e.summary) ctx += `  总结：${e.summary}\n`;
      });
    });
  }

  // 3. 当月聊天记录（权重最低，超限时截断）
  const npcs = state.data.characters.npcs || [];
  const meName = (state.data.characters.me.name || '').trim() || '主控';
  const monthStart = state.data.calendarMonthStartedAt || 0;
  const MAX_CHAT_CHARS = 6000; // 聊天记录字符上限，超出时只取最近消息
  let chatCtx = '';
  npcs.forEach(npc => {
    if (!npc.id || !npc.name) return;
    const chat = getNpcChat(npc.id);
    if (chat && chat.length) {
      const monthly = chat.filter(m => m.content && m.content.trim() && (!m.timestamp || m.timestamp >= monthStart));
      if (monthly.length) {
        chatCtx += `与${npc.name}当月对话：\n`;
        monthly.forEach(m => {
          const speaker = m.role === 'assistant' ? npc.name : meName;
          chatCtx += `${speaker}：${m.content}\n`;
        });
      }
    }
  });
  // 超限时只取最近的消息
  if (chatCtx.length > MAX_CHAT_CHARS) {
    chatCtx = '（聊天记录过长，仅保留最近部分）\n' + chatCtx.slice(-MAX_CHAT_CHARS);
  }
  ctx += chatCtx;

  // 4. 归档晨报（最近2个月，全文）
  const calArchives = state.data.calendarArchives || [];
  const recentCalArchives = calArchives.slice(-2);
  if (recentCalArchives.length) {
    ctx += '【归档晨报】\n';
    recentCalArchives.forEach(arch => {
      if (arch.monthReport && arch.monthReport.trim()) {
        ctx += `${arch.month}：\n${arch.monthReport}\n`;
      }
    });
  }

  return ctx;
}

// 格式化前序模块产出摘要（层面三：模块间传递）
function formatPrevModuleSummary(label, items) {
  if (!items || !items.length) return '';
  let preview = '';
  items.slice(0, 2).forEach(item => {
    if (typeof item === 'string') {
      preview += `- ${item.substring(0, 60)}\n`;
    } else if (item.pair) {
      preview += `- ${item.pair}：${(item.text||'').substring(0, 50)}\n`;
    } else if (item.type) {
      preview += `- ${item.type}｜${item.food}｜${item.source}\n`;
    }
  });
  if (!preview) return '';
  return `\n【前序模块·${label}】\n${preview}`;
}

async function _generateCalendarContent(targetMonth) {
  const month = targetMonth || state.data.calendarMonth || '';
  const monthPrefix = month ? `当前是${month}。` : '';

  // 收集历史上下文，注入每个模块的触发消息
  const monthlyCtx = buildMonthlyContextForCalendar();

  // 1. MEMO
  try {
    const memoRaw = await callAI(monthPrefix + monthlyCtx + '请生成4条主控的备忘录。', 'calendarMemo');
    state.data.calendarMemos = memoRaw.trim().split('\n').filter(l => l.trim());
  } catch(e) { console.error('[晨报] 备忘录生成失败:', e); }

  // 2. NOTIFICATIONS（注入备忘录摘要）
  let prevCtx = formatPrevModuleSummary('备忘录', state.data.calendarMemos);
  try {
    const notifRaw = await callAI(monthPrefix + monthlyCtx + prevCtx + '请生成3条突发事件通知。', 'calendarNotification');
    state.data.calendarNotifications = notifRaw.trim().split('\n').filter(l => l.trim());
  } catch(e) { console.error('[晨报] 突发事件生成失败:', e); }

  // 3. Daily Menu（注入备忘录+突发事件摘要）
  prevCtx = formatPrevModuleSummary('备忘录', state.data.calendarMemos)
          + formatPrevModuleSummary('突发事件', state.data.calendarNotifications);
  try {
    const menuRaw = await callAI(monthPrefix + monthlyCtx + prevCtx + '请生成3条餐食记录。', 'calendarMenu');
    state.data.calendarMenu = menuRaw.trim().split('\n').filter(l => l.trim()).map((line, i) => {
      const parts = line.split('|||').map(s => s.trim());
      return { type: parts[0]||'', food: parts[1]||'', source: parts[2]||'', thought: parts[3]||'' };
    });
  } catch(e) { console.error('[晨报] 餐食生成失败:', e); }

  // 4. Social Feedback（注入备忘录+突发事件摘要）
  prevCtx = formatPrevModuleSummary('备忘录', state.data.calendarMemos)
          + formatPrevModuleSummary('突发事件', state.data.calendarNotifications);
  try {
    const socialRaw = await callAI(monthPrefix + monthlyCtx + prevCtx + '请生成3-5条舆论。', 'calendarSocial');
    state.data.calendarSocial = socialRaw.trim().split('\n').filter(l => l.trim());
  } catch(e) { console.error('[晨报] 舆论生成失败:', e); }

  // 5. Connections（注入舆论摘要）
  prevCtx = formatPrevModuleSummary('突发事件', state.data.calendarNotifications)
          + formatPrevModuleSummary('舆论', state.data.calendarSocial);
  try {
    const connRaw = await callAI(monthPrefix + monthlyCtx + prevCtx + '请生成3条NPC与主控的关系进展。', 'calendarConnection');
    state.data.calendarConnections = connRaw.trim().split('\n').filter(l => l.trim()).map(line => {
      const parts = line.split('|||').map(s => s.trim());
      return { pair: parts[0]||'', text: parts[1]||'' };
    });
  } catch(e) { console.error('[晨报] 羁绊进展生成失败:', e); }

  // 6. Daily News（注入全部前序摘要）
  prevCtx = formatPrevModuleSummary('备忘录', state.data.calendarMemos)
          + formatPrevModuleSummary('突发事件', state.data.calendarNotifications)
          + formatPrevModuleSummary('舆论', state.data.calendarSocial)
          + formatPrevModuleSummary('羁绊进展', state.data.calendarConnections);
  try {
    const newsRaw = await callAI(monthPrefix + monthlyCtx + prevCtx + '请生成3条每日新闻简报。', 'calendarDailyNews');
    const newsBlocks = newsRaw.trim().split(/===/).map(s => s.trim()).filter(s => s);
    state.data.calendarDailyNews = newsBlocks.map(block => {
      const parts = block.split('|||').map(s => s.trim());
      const title = parts[0] || '';
      const body = parts[1] || '';
      const comments = [];
      for (let i = 2; i < parts.length; i++) {
        const c = parts[i];
        const colonIdx = c.indexOf('：');
        if (colonIdx > 0) {
          comments.push({ author: c.substring(0, colonIdx).trim(), text: c.substring(colonIdx + 1).trim() });
        }
      }
      return { title, body, comments };
    });

  let chainEvents = [];

    // 从归档数据中读取

    if (!archive) return;

    state.archiveEventChain = chainEvents;

    renderMemory();

  state.currentChainId = 'cal_chain_' + evtId;

// 从事件叙事AI响应中拆分叙事正文和状态快照
// AI在叙事正文后输出 |||STATE||| 分隔符，再输出状态快照
// 返回 { narrative: '叙事正文', state: '状态快照' }
function parseNarrativeAndState(raw) {
  if (!raw) return { narrative: '', state: '' };
  const delimiter = '|||STATE|||';
  const idx = raw.indexOf(delimiter);
  if (idx === -1) {
    // AI没输出分隔符，尝试找【状态快照】等变体
    const altIdx = raw.search(/\n【?状态快照】?\n?/);
    if (altIdx !== -1) {
      return {
        narrative: raw.slice(0, altIdx).trim(),
        state: raw.slice(altIdx).replace(/^[\n【】状态快照]+/, '').trim()
      };
    }
    return { narrative: raw.trim(), state: '' };
  }
  return {
    narrative: raw.slice(0, idx).trim(),
    state: raw.slice(idx + delimiter.length).trim()
  };
}

// 生成故事状态快照：独立的API调用，基于近期事件提炼当前故事状态
// 在用户首次文字聊天时触发（空发送不触发），结果缓存到 storyState 供后续聊天复用
async function generateStoryStateSnapshot() {
  const config = state.data.apiConfig;
  if (!config.apiKey) { console.log('[快照] 无API Key，跳过'); return ''; }

  const _meName = (state.data.characters.me.name || '').trim() || '主控';
  const npcs = state.data.characters.npcs || [];
  const npcNames = npcs.map(n => n.name).filter(Boolean);
  const _npcListStr = npcNames.length ? npcNames.join('、') : 'AI角色';
  console.log('[快照] 开始生成 | 主控:%s | NPC列表:%s | 游戏月:%s | 月起始时间戳:%s', _meName, _npcListStr, state.data.calendarMonth, state.data.calendarMonthStartedAt);

  // ===== 1. 羁绊数据 =====
  const archives = state.data.memoryArchives || [];
  const recentArchives = archives.slice(-2);
  let bondContext = '';
  console.log('[快照] 羁绊归档总数:%d | 取最近%d个月', archives.length, recentArchives.length);

  // 归档月份的羁绊
  recentArchives.forEach(arch => {
    const archKeyEvents = (arch.events || []).filter(e => e.isKey);
    const archNormalEvents = (arch.events || []).filter(e => !e.isKey);
    const archChains = (arch.eventHistory || []).filter(e => !e.isSummary && !e.isPrequel);
    console.log('[快照] 归档[%s] 关键事件:%d | 日常事件:%d | 叙事片段:%d', arch.month, archKeyEvents.length, archNormalEvents.length, archChains.length);

    bondContext += `\n【${arch.month} 羁绊概况】\n`;
    archKeyEvents.forEach(e => {
      bondContext += `关键事件：${e.title} - ${e.desc}\n`;
      if (e.summary) bondContext += `事件总结：${e.summary}\n`;
    });
    archNormalEvents.forEach(e => {
      bondContext += `日常事件：${e.title} - ${e.desc}\n`;
    });
    archChains.forEach(e => {
      if (e.aiNarrative) bondContext += `叙事片段：${e.aiNarrative}\n`;
    });
  });

  // 当月羁绊
  const currentMonth = state.data.calendarMonth || '当月';
  bondContext += `\n【${currentMonth} 羁绊概况】\n`;
  const currentKeyEvents = (state.data.calendarEvents || []).filter(e => e.isKey);
  const currentNormalEvents = (state.data.calendarEvents || []).filter(e => !e.isKey);
  const currentChains = (state.data.eventHistory || []).filter(e => !e.isSummary && !e.isPrequel);
  console.log('[快照] 当月[%s] 关键事件:%d | 日常事件:%d | 叙事片段:%d', currentMonth, currentKeyEvents.length, currentNormalEvents.length, currentChains.length);
  currentKeyEvents.forEach(e => {
    bondContext += `关键事件：${e.title} - ${e.desc}\n`;
    if (e.summary) bondContext += `事件总结：${e.summary}\n`;
  });
  currentNormalEvents.forEach(e => {
    bondContext += `日常事件：${e.title} - ${e.desc}\n`;
  });
  currentChains.forEach(e => {
    if (e.aiNarrative) bondContext += `叙事片段：${e.aiNarrative}\n`;
  });
  console.log('[快照] 羁绊数据总字数:%d', bondContext.length);

  // ===== 2. 当月聊天记录 =====
  const monthStart = state.data.calendarMonthStartedAt || 0;
  let chatContext = '';
  let chatTotal = 0;
  npcs.forEach(npc => {
    if (!npc.id || !npc.name) return;
    const chat = getNpcChat(npc.id);
    if (chat && chat.length) {
      const monthly = chat.filter(m => m.content && m.content.trim() && (!m.timestamp || m.timestamp >= monthStart));
      if (monthly.length) {
        chatTotal += monthly.length;
        console.log('[快照] NPC[%s] 当月对话:%d条 (总记录:%d, 过滤起始:%s)', npc.name, monthly.length, chat.length, new Date(monthStart).toLocaleString());
        chatContext += `与${npc.name}当月对话：\n`;
        monthly.forEach(m => {
          const speaker = m.role === 'assistant' ? npc.name : _meName;
          chatContext += `${speaker}：${m.content}\n`;
        });
      }
    }
  });
  console.log('[快照] 聊天记录总条数:%d | 总字数:%d', chatTotal, chatContext.length);
  // 聊天记录超限时截断（权重最低，只保留最近部分）
  const MAX_SNAP_CHAT = 8000;
  if (chatContext.length > MAX_SNAP_CHAT) {
    chatContext = '（聊天记录过长，仅保留最近部分）\n' + chatContext.slice(-MAX_SNAP_CHAT);
    console.log('[快照] 聊天记录已截断至 %d 字符', MAX_SNAP_CHAT);
  }

  // ===== 3. 晨报内容（当月+最近2个月历史归档） =====
  let calendarContext = '';
  if (state.data.calendarMonthReport && state.data.calendarMonthReport.trim()) {
    calendarContext += `【当月晨报】\n${state.data.calendarMonthReport}\n`;
    console.log('[快照] 当月晨报已注入，字数:%d', state.data.calendarMonthReport.length);
  }
  if (state.data.calendarMemos && state.data.calendarMemos.length) {
    console.log('[快照] 当月备忘录:%d条', state.data.calendarMemos.length);
    calendarContext += '当月备忘录：\n';
    state.data.calendarMemos.forEach(m => { calendarContext += `- ${m}\n`; });
  }
  if (state.data.calendarConnections && state.data.calendarConnections.length) {
    console.log('[快照] 当月羁绊进展:%d条', state.data.calendarConnections.length);
    calendarContext += '当月羁绊进展：\n';
    state.data.calendarConnections.forEach(c => { calendarContext += `- ${c.pair}：${c.text || ''}\n`; });
  }
  const calArchives = state.data.calendarArchives || [];
  const recentCalArchives = calArchives.slice(-2);
  console.log('[快照] 晨报归档总数:%d | 取最近%d个月', calArchives.length, recentCalArchives.length);
  recentCalArchives.forEach(arch => {
    if (arch.monthReport && arch.monthReport.trim()) {
      console.log('[快照] 历史晨报[%s] 字数:%d', arch.month, arch.monthReport.length);
      calendarContext += `\n【${arch.month} 晨报】\n${arch.monthReport}\n`;
    }
  });
  console.log('[快照] 晨报数据总字数:%d', calendarContext.length);

  // ===== 4. 主线剧情 =====
  const mainStory = (state.data.mainStory || '').trim();
  console.log('[快照] 主线剧情:%s (字数:%d)', mainStory ? '已设置' : '未设置', mainStory.length);

  // ===== 拼装完整Prompt =====
  const statePrompt = `请通读以下全部数据后，进行归纳总结，生成当前故事状态快照。关注权重递减为：关键事件 → 羁绊日常事件 → 聊天记录 → 晨报。

要求：
1. 提取关键信息：重要事件、角色关系变化、人物状态演变。尽量保留具体细节，如涉及的人物姓名、具体约定、关键道具、地点、转折点等，不要只写空泛的概括。

  【近期经历】概括最近几个月发生了什么，体现从先前到现在的变化脉络。用故事内的相对时间表达。
