// 拉取平台下属模型列表
async function fetchModels() {
  const urlEl = document.getElementById('api-baseurl');
  const keyEl = document.getElementById('api-key');
  const statusEl = document.getElementById('fetch-models-status');
  const btn = document.getElementById('fetch-models-btn');
  const baseUrl = urlEl ? urlEl.value.trim() : '';
  const apiKey = keyEl ? keyEl.value.trim() : '';

  if (!baseUrl) { showToast('请先填写平台地址'); return; }
  if (!apiKey) { showToast('请先填写 API Key'); return; }

  btn.disabled = true;
  if (statusEl) statusEl.textContent = '拉取中…';

  try {
    const models = await fetchModelList(baseUrl, apiKey);
    // 同步保存到运行时：apiKey、baseUrl、models、model
    // 这样即使用户未点"保存"就关闭，内存中的配置也是完整的
    state.data.apiConfig.apiKey = apiKey;
    state.data.apiConfig.baseUrl = baseUrl;
    state.data.apiConfig.models = models;
    // 若当前 model 不在列表里，默认选第一个
    if (models.length > 0 && !models.includes(state.data.apiConfig.model)) {
      state.data.apiConfig.model = models[0];
    }
    if (statusEl) statusEl.textContent = `拉取成功，共 ${models.length} 个模型`;
    // 重新渲染模型字段为下拉框
    const cfg = state.data.apiConfig;
    const options = models.map(m =>
      `<option value="${escapeHtml(m)}" ${cfg.model === m ? 'selected' : ''}>${escapeHtml(m)}</option>`
    ).join('');
    const modelWrap = btn.parentElement.querySelector('#api-model');
    if (modelWrap) {
      const select = document.createElement('select');
      select.className = 'form-input';
      select.id = 'api-model';
      select.innerHTML = options;
      modelWrap.replaceWith(select);
    }
    showToast('已拉取 ' + models.length + ' 个模型');
  } catch(e) {
    if (statusEl) statusEl.textContent = '拉取失败：' + (e.message || '未知错误') + '（可手填模型名）';
    showToast('拉取失败，可手填模型名');
  } finally {
    btn.disabled = false;
  }
}

function saveApiConfig() {
  const cfg = state.data.apiConfig;
  const keyEl = document.getElementById('api-key');
  const modelEl = document.getElementById('api-model');
  const urlEl = document.getElementById('api-baseurl');
  const tempEl = document.getElementById('api-temperature');
  const freqEl = document.getElementById('api-frequency-penalty');
  const presEl = document.getElementById('api-presence-penalty');
  if (keyEl) cfg.apiKey = keyEl.value.trim();
  if (modelEl) cfg.model = modelEl.value.trim();
  if (urlEl) cfg.baseUrl = urlEl.value.trim();
  if (tempEl) cfg.temperature = parseFloat(tempEl.value);
  if (freqEl) cfg.frequencyPenalty = parseFloat(freqEl.value);
  if (presEl) cfg.presencePenalty = parseFloat(presEl.value);
  saveToStorage();
  // 从 API 配置页返回聊天主界面
  backToHome();
  showToast('API配置已保存');
}

// ========== 数据备份/导入 ==========
function showBackupModal() {
  closeNav();
  showModal(`
    <div class="modal">

          导入：覆盖全局规则与同代码剧本，本地独有剧本予以保留。<br>

        </p>

        </button>
        <input type="file" id="import-file-input" accept=".json" style="position:absolute;top:-100px;left:0;width:1px;height:1px;opacity:0;overflow:hidden;" onchange="importData(event)">

function exportData() {
  try {
    // 导出前强制落盘一次，保证 profiles 与 state.data 一致
    saveToStorage();
    const activeId = profiles.activeId;
    const activeMeta = (activeId && profiles.meta[activeId]) || {};
    const backup = {
      _type: 'soul_full_backup',
      _version: APP_VERSION,
      _exportTime: Date.now(),
      _profileCount: profiles.order.length,
      _activeProfileId: activeId || '',
      _activeProfileName: activeMeta.name || '',
      // 全局设定：仅含 globalRules。API 配置(apiConfig)独立于备份，
      // 不导出也不覆盖，始终保留本机当前配置（含密钥）。
      // 全部剧本：每个剧本代码 = profile ID，data[id] 含该剧本的
      // 完整数据（对话/设定/事件/历史/记忆/日历等全部信息）
      profiles: {
        order: profiles.order,
        activeId: profiles.activeId,
        globals: { globalRules: profiles.globals.globalRules },
        meta: profiles.meta,
        data: profiles.data
      }
    };
    const jsonStr = JSON.stringify(backup, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `soul_backup_${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('数据已导出');
    closeModal();
  } catch(e) {
    console.error('导出失败', e);
    showToast('导出失败：' + e.message);
  }
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    let backup;
    try {
      backup = JSON.parse(e.target.result);
    } catch(err) {
      console.error('导入失败：JSON 解析错误', err);
      showToast('导入失败：文件解析错误');
      return;
    }
    try {
      // 格式校验：Soul 为全新游戏，仅接受 soul_full_backup，不再兼容 Echo
      if (backup._type !== 'soul_full_backup') {
        showToast('文件格式不正确，请选择 Soul 备份文件');
        return;
      }
      // 结构校验：必须含 profiles.data（剧本字典）
      if (!backup.profiles || !backup.profiles.data || typeof backup.profiles.data !== 'object' || Array.isArray(backup.profiles.data)) {
        showToast('备份文件结构损坏，缺少剧本数据');
        return;
      }
      // 版本感知：备份版本高于当前时记录日志（仅提示，不阻断）
      const backupVer = backup._version || '未知';
      if (typeof backupVer === 'string' && !isNaN(parseFloat(backupVer)) && parseFloat(backupVer) > parseFloat(APP_VERSION)) {
        console.log('[导入] 备份版本 %s 高于当前 %s，部分数据可能不兼容', backupVer, APP_VERSION);
      }

      const incCount = Object.keys(backup.profiles.data).length;
      // 确认覆盖导入：全局设定与同代码剧本将被覆盖，本地独有剧本（代码不同）保留
      showModal(`
        <div class="modal">
          <div class="modal-header">确认导入</div>
          <div class="modal-body" style="padding:20px;text-align:center;">
            <p style="font-size:13px;color:var(--text-dim);margin:0;line-height:1.6;">
              备份含 <strong style="color:var(--gold);">${incCount}</strong> 个剧本。<br>
              导入将<strong style="color:var(--gold);">覆盖全局规则与同代码剧本</strong>，<br>
              本地独有剧本（代码不同）将予以保留。<br>
              API 配置不受影响。是否继续？
            </p>
          </div>
          <div class="modal-footer">
            <button class="modal-btn" onclick="closeModal()">取消</button>
            <button class="modal-btn primary" onclick="doImportBackup()">确认导入</button>
          </div>
        </div>
      `);
      // 暂存整个备份，确认后执行
      window._pendingBackup = backup;
    } catch(err) {
      console.error('导入失败', err);
      showToast('导入失败：' + (err && err.message ? err.message : '未知错误'));
      closeModal();
    }
  };
  reader.readAsText(file);
  // 清空 input，允许再次选择同一文件
  event.target.value = '';
}

function doImportBackup() {
  const backup = window._pendingBackup;
  if (!backup) return;
  try {
    const inc = backup.profiles;
    let upserted = 0;

    // 1. 全局设定：仅覆盖 globalRules。API 配置(apiConfig)独立于备份，
    // 保留本机当前配置不动，不导入也不覆盖。
    profiles.globals.globalRules = Array.isArray(inc.globals && inc.globals.globalRules) ? inc.globals.globalRules : profiles.globals.globalRules;

    // 2. 剧本：按代码（profile ID）覆盖导入；本地独有剧本（代码不同，不在备份中）原样保留
    Object.keys(inc.data).forEach(id => {
      // 跳过非法条目，避免污染本地档案
      if (!inc.data[id] || typeof inc.data[id] !== 'object') return;
      profiles.data[id] = inc.data[id];
      const incMeta = (inc.meta && inc.meta[id]) || {};
      // 剧本头像由剧本名称首字派生，清除备份中可能残留的角色头像脏数据
      profiles.meta[id] = {
        name: incMeta.name || '',
        avatar: '',
        scriptId: incMeta.scriptId || 'custom',
        createdAt: incMeta.createdAt || Date.now(),
        updatedAt: incMeta.updatedAt || Date.now()
      };
      if (!profiles.order.includes(id)) profiles.order.push(id);
      upserted++;
    });

    // 3. 激活剧本：优先用备份的 activeId（已导入），否则保持本地当前，否则取第一个
    if (inc.activeId && profiles.data[inc.activeId]) {
      profiles.activeId = inc.activeId;
    } else if (!profiles.activeId && profiles.order.length) {
      profiles.activeId = profiles.order[0];
    }

    // 4. 载入激活剧本（含结构迁移/归一化）后一次性落盘
    // 注意：先 loadProfileIntoState 再 saveToStorage，避免后者用旧 state.data 覆盖刚导入的激活剧本
    if (profiles.activeId) {
      loadProfileIntoState(profiles.activeId);
      resetRuntimeState();
      saveToStorage();
      applyBgImage();
      enterChatMain();
    } else {
      renderNavCharList();
    }

    delete window._pendingBackup;
    showToast('已导入 ' + upserted + ' 个剧本（本地独有剧本已保留）');
    closeModal();
  } catch(e) {
    console.error('导入执行失败', e);
    showToast('导入失败：' + e.message);
    delete window._pendingBackup;
    closeModal();
  }
}

// 渲染规则卡片列表
function renderGlobalRules() {
  const container = document.getElementById('global-rules-list');
  const rules = state.data.globalRules || [];
  if (!rules.length) {
    container.innerHTML = `<div class="global-rules-empty">暂无全局规则<br>点击右上角「新增」添加</div>`;
    return;
  }
  container.innerHTML = rules.map(r => `
    <div class="global-rule-card ${r.enabled ? '' : 'disabled'}">
      <div class="global-rule-card-header">
        <div class="global-rule-card-name">${escapeHtml(r.name || '未命名规则')}</div>
        <div class="global-rule-card-actions">
          <button class="global-rule-card-btn" onclick="toggleGlobalRule('${r.id}')">${r.enabled ? '停用' : '启用'}</button>
          <button class="global-rule-card-btn" onclick="editGlobalRule('${r.id}')">编辑</button>
          <button class="global-rule-card-btn danger" onclick="deleteGlobalRule('${r.id}')">删除</button>
        </div>
      </div>
      <div class="global-rule-card-content">${escapeHtml(r.content || '')}</div>
    </div>
  `).join('');
}

// 启用/停用
function toggleGlobalRule(id) {
  const rule = state.data.globalRules.find(r => r.id === id);
  if (!rule) return;
  rule.enabled = !rule.enabled;
  saveToStorage();
  renderGlobalRules();
  showToast(rule.enabled ? '已启用' : '已停用');
}

// 删除
function deleteGlobalRule(id) {
  state.data.globalRules = state.data.globalRules.filter(r => r.id !== id);
  saveToStorage();
  renderGlobalRules();
  showToast('已删除');
}

// 新增/编辑（id 为 null 时新增）
function editGlobalRule(id) {
  const isNew = !id;
  const rule = isNew ? { name: '', content: '' } : state.data.globalRules.find(r => r.id === id);
  if (!rule) return;
  showModal(`
    <div class="modal">
      <div class="modal-header">${isNew ? '新增规则' : '编辑规则'}</div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">规则名称</label>
          <input type="text" class="form-input" id="gr-name" value="${escapeHtml(rule.name)}" placeholder="如：写作风格、禁止事项…">
        </div>
        <div class="form-group">
          <label class="form-label">指令内容</label>
          <textarea class="form-textarea" id="gr-content" style="min-height:200px;" placeholder="输入适用于所有剧本的指令词…">${escapeHtml(rule.content)}</textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="saveGlobalRule('${id || ''}')">保存</button>
      </div>
    </div>
  `);
}

// 保存（新增或更新）
function saveGlobalRule(id) {
  const nameEl = document.getElementById('gr-name');
  const contentEl = document.getElementById('gr-content');
  const name = nameEl ? nameEl.value.trim() : '';
  const content = contentEl ? contentEl.value.trim() : '';
  if (!name) { showToast('请填写规则名称'); return; }
  if (!content) { showToast('请填写指令内容'); return; }
  if (!state.data.globalRules) state.data.globalRules = [];
  if (id) {
    const rule = state.data.globalRules.find(r => r.id === id);
    if (rule) { rule.name = name; rule.content = content; }
  } else {
    state.data.globalRules.push({
      id: 'gr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      name, content, enabled: true
    });
  }
  saveToStorage();
  closeModal();
  renderGlobalRules();
  showToast('已保存');
}

/* ========== 启动 ========== */
init();
</script>
